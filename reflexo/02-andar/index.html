<!--
  REFLEXO — PASSO 2: ANDAR

  O zelador anda e gira pela planta, relativo à direção em que olha, e
  não atravessa paredes. Teclado ou botões na tela.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexo — passo 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Reflexo</h1>

    <canvas id="jogo" width="384" height="288">
        Seu navegador não suporta canvas.
    </canvas>

    <p id="leitura"></p>

    <div id="controles">
        <button type="button" data-acao="girarEsquerda" aria-label="Girar para a esquerda">⟲</button>
        <button type="button" data-acao="frente" aria-label="Andar para a frente">▲</button>
        <button type="button" data-acao="girarDireita" aria-label="Girar para a direita">⟳</button>
        <button type="button" data-acao="esquerda" aria-label="Passo para a esquerda">◀</button>
        <button type="button" data-acao="tras" aria-label="Andar para trás">▼</button>
        <button type="button" data-acao="direita" aria-label="Passo para a direita">▶</button>
    </div>

    <p id="ajuda">W S ou ↑ ↓: andar · A D: passo lateral · ← →: girar · H: mostrar o invisível</p>
</body>
</html>
