<!--
  REFLEXO — PASSO 4: PAREDES

  A sala em primeira pessoa: um raio por coluna da imagem, e a altura de
  cada coluna vem da distância até a parede. H troca a imagem pela planta
  com o leque de raios.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflexo — passo 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Reflexo</h1>

    <div id="palco">
        <canvas id="visao" width="320" height="200" role="img"
            aria-label="A sala em primeira pessoa: paredes de tijolo e de pedra, mais altas quanto mais perto">
            Seu navegador não suporta canvas.
        </canvas>
        <canvas id="jogo" width="384" height="288" role="img" hidden
            aria-label="Planta da sala vista de cima, com o leque de raios que sai do zelador">
            Seu navegador não suporta canvas.
        </canvas>
    </div>

    <p id="leitura"></p>

    <div id="controles">
        <button type="button" data-acao="girarEsquerda" aria-label="Girar para a esquerda">⟲</button>
        <button type="button" data-acao="frente" aria-label="Andar para a frente">▲</button>
        <button type="button" data-acao="girarDireita" aria-label="Girar para a direita">⟳</button>
        <button type="button" data-acao="esquerda" aria-label="Passo para a esquerda">◀&#xFE0E;</button>
        <button type="button" data-acao="tras" aria-label="Andar para trás">▼</button>
        <button type="button" data-acao="direita" aria-label="Passo para a direita">▶&#xFE0E;</button>
    </div>

    <p id="ajuda">W S ou ↑ ↓: andar · A D: passo lateral · ← →: girar<br>H: trocar a imagem pela planta (● linha vertical cruzada · ■ horizontal)</p>
</body>
</html>
