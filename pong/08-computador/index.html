<!--
  PONG — PASSO 8: O COMPUTADOR

  Entram dois botões. Repare que nenhum deles tem onclick="..." —
  o que o botão FAZ é comportamento, e comportamento mora no JavaScript.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong — passo 8</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pong</h1>

    <div id="jogo-container">

        <div id="placar">
            <span id="pontos-esquerda">0</span>
            <span id="separador">—</span>
            <span id="pontos-direita">0</span>
        </div>

        <div id="tela">
            <!-- position: relative — o ponto de referência da camada de mensagem. -->

            <canvas id="jogo" width="160" height="96">
                Seu navegador não suporta canvas.
            </canvas>

            <div id="camada-mensagem" hidden>
                <p id="mensagem-titulo">Fim de jogo</p>
                <p id="mensagem-texto"></p>
                <!--
                  Esta camada JÁ EXISTE na página, escondida pelo atributo
                  hidden. Terminar o jogo é só removê-lo.

                  Mostrar algo que já existe é mais simples do que criar
                  elementos por código: menos passos, menos como errar.
                -->
            </div>
        </div>

    </div>

    <div id="controles">
        <button id="botao-iniciar" type="button">Novo jogo</button>
        <button id="botao-modo" type="button">Modo: 1 jogador</button>
    </div>

    <p id="ajuda">
        <span id="ajuda-jogador1">Esquerda: W / S</span>
        <span id="ajuda-jogador2">Direita: computador</span>
    </p>
</body>
</html>
