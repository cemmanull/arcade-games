<!--
  XENOMORPH — PASSO 3: O SALTO

  Pular — e tudo o que faz um pulo parecer bom: altura que depende de
  quanto tempo se segura o botão, um perdão na beirada, um perdão no
  aperto adiantado. E duas coisas novas no cenário e no corpo: plataformas
  que se atravessam por baixo, e uma esquiva rápida.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenomorph — passo 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Xenomorph</h1>
    <p id="subtitulo">Protocolo de Extinção</p>

    <canvas id="jogo" width="256" height="144">
        Seu navegador não suporta canvas.
    </canvas>

    <p id="ajuda">
        <span>← → ou A D: andar</span>
        <span>Espaço, Z ou K: pular (segure para ir mais alto)</span>
        <span>↓ + pular: descer da plataforma</span>
        <span>Shift, C ou L: esquivar</span>
        <span>H: mostrar as caixas</span>
    </p>
</body>
</html>
