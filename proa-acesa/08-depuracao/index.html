<!--
  PASSO 8: A DEPURAÇÃO

  A ponte entre o three.js (um módulo ES) e os nossos scripts clássicos, agora com o OrbitControls (um "addon" da
  biblioteca, achado pelo import map em "three/addons/"). A ORDEM importa: import map, módulo inline, regras.js e SÓ ENTÃO o script.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proa Acesa — passo 8</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        window.THREE = THREE;
        window.OrbitControls = OrbitControls;
    </script>
    <script src="regras.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Proa Acesa</h1>
        <button id="botao-clarao" type="button" aria-pressed="false">Reduzir clarões</button>
    </header>
    <div id="hud">
        <p id="relogio"></p>
        <p id="calor"></p>
        <meter id="medidor" min="0" max="1" low="0.6" high="0.85" optimum="0" aria-label="Calor da lanterna"></meter>
    </div>
    <p id="placar" aria-live="polite"></p>
    <main id="palco"></main>
    <p id="mensagem" aria-live="polite"></p>
    <pre id="depuracao" hidden></pre>
    <div id="controles">
        <button id="botao-esquerda" type="button" aria-label="Virar à esquerda">◀</button>
        <button id="botao-direita" type="button" aria-label="Virar à direita">▶</button>
        <div id="acoes">
            <button id="botao-devagar" type="button" aria-label="Devagar (segure)">Devagar</button>
            <button id="botao-foco" type="button">Foco: largo</button>
        </div>
    </div>
    <p id="aviso" role="alert" hidden></p>
</body>
</html>
