<!--
  DIQUE — PASSO 2: AS ALTURAS

  A mesma ilha, agora com altura: cada casa é um bloco com topo e duas laterais, pintado
  de trás para a frente. Q e R giram a vista; H mostra os números e o que a inversa acha.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dique — passo 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="regras.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Dique</h1>

    <canvas id="jogo" width="384" height="252">
        Seu navegador não suporta canvas.
    </canvas>

    <div id="botoes">
        <button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>
        <button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>
        <button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>
    </div>

    <pre id="leitura" aria-live="off"></pre>

    <p id="ajuda">Mouse ou dedo: marcar · Q R: girar · H: mostrar o invisível</p>
</body>
</html>
