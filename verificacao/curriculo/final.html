    <script>
        const PASSO = "final";

        function marcosEmOrdem(documento) {
            return Array.from(documento.querySelectorAll("header, nav, main, section, footer")).map(function (marco) { return marco.localName; });
        }

        async function esperarMiniatura(imagem) {
            imagem.loading = "eager";                              // uma imagem lazy fora da tela não carrega: o teste quer saber se o ARQUIVO carrega
            for (let tentativa = 0; tentativa < 50 && !(imagem.complete && imagem.naturalWidth > 0); tentativa++) await esperar(100);
            return imagem.complete && imagem.naturalWidth > 0;
        }

        // ------------------------------------------------------------
        // Estrutura (passo 1): títulos, marcos, pular para o conteúdo, âncoras, nomes acessíveis, links
        // ------------------------------------------------------------
        async function casosDeEstrutura() {
            const quadro = await abrirPasso(PASSO, ESPELHO_DO_INDEX);
            const janela = quadro.contentWindow, documento = janela.document;

            testar("títulos: um só h1 (o nome, no cabeçalho) e nenhum nível pulado", function () {
                conferirIgual("exatamente 1 h1", documento.querySelectorAll("h1").length, 1);
                conferir("o h1 está no header e tem texto", documento.querySelector("header > h1") !== null && documento.querySelector("h1").textContent.trim() !== "");
                const niveis = niveisDosTitulos(documento);
                conferir("os níveis (" + niveis.join(",") + ") nunca pulam", saltosDeTitulo(niveis).length === 0, saltosDeTitulo(niveis).join("; "));
                conferirIgual("cada projeto (article) tem um h3 e só um", Array.from(documento.querySelectorAll("article")).every(function (cartao) { return cartao.querySelectorAll("h3").length === 1; }), true);
                conferir("todo título tem texto", Array.from(documento.querySelectorAll("h1, h2, h3")).every(function (titulo) { return titulo.textContent.trim() !== ""; }));
            });

            testar("marcos: header, nav com nome, main, footer e section com aria-labelledby", function () {
                conferirIgual("um header", documento.querySelectorAll("header").length, 1);
                conferirIgual("um main", documento.querySelectorAll("main").length, 1);
                conferirIgual("um footer", documento.querySelectorAll("footer").length, 1);
                conferirIgual("o header é filho direto do body", documento.querySelector("header").parentElement, documento.body);
                conferirIgual("o footer também", documento.querySelector("footer").parentElement, documento.body);
                const menus = Array.from(documento.querySelectorAll("nav"));
                conferir("há um nav e todo nav tem aria-label preenchido", menus.length >= 1 && menus.every(function (menu) { return (menu.getAttribute("aria-label") || "").trim() !== ""; }));
                const secoes = Array.from(documento.querySelectorAll("section"));
                conferir("há seções e todas ficam dentro do main", secoes.length > 0 && secoes.every(function (secao) { return secao.closest("main") !== null; }));
                secoes.forEach(function (secao) {
                    const rotulo = documento.getElementById(secao.getAttribute("aria-labelledby") || "");
                    conferir("section #" + secao.id + ": aria-labelledby aponta para um título com texto", rotulo !== null && /^H[1-6]$/.test(rotulo.tagName) && rotulo.textContent.trim() !== "", String(secao.getAttribute("aria-labelledby")));
                });
                conferir("a ordem dos marcos é header, nav, main, seções, footer", marcosEmOrdem(documento).join(" ").indexOf("header nav main section") === 0 && marcosEmOrdem(documento).pop() === "footer", marcosEmOrdem(documento).join(" "));
            });

            testar("o link 'pular para o conteúdo' é o primeiro foco e leva ao main", function () {
                const ordem = elementosNaOrdemDoTab(documento);
                const principalDoPasso = documento.querySelector("main");
                conferir("o main tem id", principalDoPasso.id !== "");
                conferirIgual("nenhum elemento usa tabindex positivo (ele embaralha a ordem do Tab)", ordem.filter(function (e) { return e.tabIndex > 0; }).length, 0);
                conferirIgual("o primeiro foco do Tab é um link", ordem[0].localName, "a");
                conferirIgual("e ele aponta para o id do main", ordem[0].getAttribute("href"), "#" + principalDoPasso.id);
                conferir("e tem texto", nomeAcessivel(ordem[0]) !== "");
                ordem[0].focus();
                conferir("com foco ele aparece na tela", ordem[0].getBoundingClientRect().top >= 0);
                ordem[0].blur();
            });

            testar("âncoras: todo href=\"#x\" tem um id, e nenhum id se repete", function () {
                conferir(documento.querySelectorAll('a[href^="#"]').length + " links de âncora", documento.querySelectorAll('a[href^="#"]').length >= 5);
                conferirIgual("âncoras sem destino", ancorasQuebradas(documento).join(" "), "");
                conferirIgual("ids repetidos", idsRepetidos(documento).join(" "), "");
                const destinosDoMenu = Array.from(documento.querySelectorAll("nav a[href^='#']")).map(function (link) { return documento.getElementById(link.getAttribute("href").slice(1)); });
                conferir("cada link do menu leva a uma section", destinosDoMenu.length > 0 && destinosDoMenu.every(function (destino) { return destino !== null && destino.localName === "section"; }));
                const destinosDasHabilidades = Array.from(documento.querySelectorAll(".habilidades a[href^='#']")).map(function (link) { return documento.getElementById(link.getAttribute("href").slice(1)); });
                conferir("cada prova de uma habilidade leva a um projeto (article)", destinosDasHabilidades.length > 0 && destinosDasHabilidades.every(function (destino) { return destino !== null && destino.localName === "article"; }));
            });

            testar("nome acessível: todo botão, campo e link tem nome", function () {
                const quemPrecisaDeNome = documento.querySelectorAll("button, input, select, textarea, a[href]");
                const semNome = Array.from(quemPrecisaDeNome).filter(function (elemento) { return nomeAcessivel(elemento) === ""; });
                conferir(quemPrecisaDeNome.length + " controles e links, todos com nome", quemPrecisaDeNome.length > 0 && semNome.length === 0, semNome.map(function (e) { return e.outerHTML.slice(0, 50); }).join(" | "));
            });

            testar("links para os jogos: os 4 cartões apontam para ../../<jogo>/final/index.html, que existe", function () {
                const cartoes = Array.from(documento.querySelectorAll("#lista-projetos > article"));
                conferirIgual("4 projetos", cartoes.length, 4);
                cartoes.forEach(function (cartao) {
                    const links = cartao.querySelectorAll(".acoes a[href]");
                    conferirIgual("#" + cartao.id + ": um link de jogo", links.length, 1);
                    const href = links[0].getAttribute("href");
                    conferir("#" + cartao.id + ": " + href + " tem a forma ../../<jogo>/final/index.html", /^\.\.\/\.\.\/[a-z-]+\/final\/index\.html$/.test(href));
                    const destino = caminhoNoRepositorio(href, PASSO);
                    conferir("#" + cartao.id + ": e existe no repositório (" + destino + ")", ARQUIVOS_EXISTENTES.indexOf(destino) >= 0, String(destino));
                });
                const locais = Array.from(documento.querySelectorAll("a[href]")).map(function (link) { return caminhoNoRepositorio(link.getAttribute("href"), PASSO); }).filter(function (caminho) { return caminho !== null; });
                conferir(locais.length + " links de arquivo no total, todos no inventário", locais.length === cartoes.length && locais.every(function (caminho) { return ARQUIVOS_EXISTENTES.indexOf(caminho) >= 0; }));
                const creditos = Array.from(documento.querySelectorAll("a[href^='https://github.com/']")).map(function (link) { return link.getAttribute("href"); });
                conferir("o crédito do curso é sempre o mesmo endereço absoluto https:// (" + creditos.length + " links)", creditos.length >= 5 && creditos.every(function (href) { return href === creditos[0]; }));
            });

            quadro.remove();
        }

        // ------------------------------------------------------------
        // Layout (passo 2): colunas que se veem, cabeçalho, alvos de toque
        // ------------------------------------------------------------
        async function casosDeLayout() {
            const quadro = await abrirPasso(PASSO, ESPELHO_DO_INDEX, { largura: 390, altura: 750 });
            const janela = quadro.contentWindow, documento = janela.document;
            const cartoes = Array.from(documento.querySelectorAll(".cartao"));

            await testarAssincrono("sem rolagem horizontal em 360, 390 e 1280 (e em 320 e 640), com todo cartão dentro da janela", async function () {
                for (const largura of [360, 390, 1280, 320, 640]) {
                    await mudarTamanho(quadro, largura);
                    conferirSemRolagemHorizontal(quadro, "final");
                    conferir(largura + ": todo cartão cabe na janela", cartoes.every(function (cartao) { const caixa = cartao.getBoundingClientRect(); return caixa.left >= -0.5 && caixa.right <= documento.documentElement.clientWidth + 0.5; }));
                }
            });

            await testarAssincrono("cartões e habilidades: 1 coluna em 360 e 390, 2 ou mais em 1280", async function () {
                for (const largura of [360, 390, 1280]) {
                    await mudarTamanho(quadro, largura);
                    const habilidades = Array.from(documento.querySelectorAll(".habilidades li"));
                    if (largura < 768) {
                        conferirIgual(largura + ": a grade tem 1 coluna", colunasDaGrade(documento, ".projetos"), 1);
                        conferirIgual(largura + ": e os cartões ficam empilhados", colunasVisiveis(cartoes), 1);
                        conferirIgual(largura + ": as habilidades também", colunasVisiveis(habilidades), 1);
                    } else {
                        conferir(largura + ": a grade tem 2 ou mais colunas (" + colunasDaGrade(documento, ".projetos") + ")", colunasDaGrade(documento, ".projetos") >= 2);
                        conferir(largura + ": e os cartões aparecem lado a lado (" + colunasVisiveis(cartoes) + ")", colunasVisiveis(cartoes) >= 2);
                        conferir(largura + ": as habilidades também (" + colunasVisiveis(habilidades) + ")", colunasVisiveis(habilidades) >= 2);
                    }
                    conferir(largura + ": nenhum cartão fica com altura 0", cartoes.every(function (cartao) { return cartao.getBoundingClientRect().height > 40; }));
                }
            });

            await testarAssincrono("o cabeçalho: menu abaixo do título no celular, ao lado dele no desktop", async function () {
                const titulo = documento.querySelector("h1"), menu = documento.querySelector("nav");
                await mudarTamanho(quadro, 390);
                conferir("390: o menu começa abaixo do título", menu.getBoundingClientRect().top >= titulo.getBoundingClientRect().bottom - 0.5);
                await mudarTamanho(quadro, 1280);
                conferir("1280: o menu fica à direita do título", menu.getBoundingClientRect().left >= titulo.getBoundingClientRect().left + 100);
            });

            await testarAssincrono("alvos de toque de pelo menos 48 px em 360 e 390 (menu, tema, cartões e contato)", async function () {
                for (const largura of [360, 390]) {
                    await mudarTamanho(quadro, largura);
                    conferir(largura + ": " + alvosDeToque(documento).length + " alvos conferidos", alvosDeToque(documento).length >= 8);
                    conferirIgual(largura + ": alvos com menos de 48 px", alvosPequenos(documento).join(" | "), "");
                }
                const pular = documento.querySelector(".pular");
                pular.focus();
                conferir("o link 'Pular' tem 48 px de altura quando aparece (" + Math.round(pular.getBoundingClientRect().height) + ")", pular.getBoundingClientRect().height >= ALTURA_MINIMA_DO_ALVO);
                pular.blur();
            });

            quadro.remove();
        }

        // ------------------------------------------------------------
        // Miniaturas (arquivos PNG): carregam, têm alt que nomeia o jogo; o peso é conferido por espelho.mjs --conferir
        // ------------------------------------------------------------
        async function casosDasMiniaturas() {
            const quadro = await abrirPasso(PASSO, ESPELHO_DO_INDEX);
            const janela = quadro.contentWindow, documento = janela.document;
            const projetos = janela.eval("projetos");
            const imagens = Array.from(documento.querySelectorAll("#lista-projetos .miniatura"));

            testar("os dados apontam para as 4 miniaturas do inventário, com a caixa certa", function () {
                conferirIgual("uma miniatura por projeto", imagens.length, projetos.length);
                conferirIgual("o inventário tem 4 miniaturas", AMOSTRAS_DO_FINAL.length, 4);
                projetos.forEach(function (projeto) {
                    conferirIgual(projeto.id + ": imagem é amostras/<id>.png", projeto.imagem, "amostras/" + projeto.id + ".png");
                    conferir(projeto.id + ": e o arquivo " + projeto.id + ".png está no inventário", AMOSTRAS_DO_FINAL.indexOf(projeto.id + ".png") >= 0);
                });
            });

            await testarAssincrono("cada miniatura carrega de verdade (naturalWidth > 0) e o alt diz de que jogo ela é", async function () {
                for (let posicao = 0; posicao < imagens.length; posicao++) {
                    const imagem = imagens[posicao], projeto = projetos[posicao];
                    conferir(projeto.id + ": a imagem carregou (" + imagem.naturalWidth + "×" + imagem.naturalHeight + ")", await esperarMiniatura(imagem), imagem.src);
                    conferir(projeto.id + ": o endereço termina em /curriculo/final/amostras/" + projeto.id + ".png (mesmas maiúsculas do arquivo)", imagem.src.slice(-("/curriculo/final/amostras/" + projeto.id + ".png").length) === "/curriculo/final/amostras/" + projeto.id + ".png", imagem.src);
                    conferir(projeto.id + ': o alt "' + imagem.alt.slice(0, 40) + '..." cita o nome do jogo (' + projeto.nome + ")", imagem.alt.toLowerCase().indexOf(projeto.nome.toLowerCase()) >= 0);
                }
            });

            testar("as únicas imagens da página são as miniaturas dos cartões (nenhuma foto pessoal)", function () {
                const todas = Array.from(documento.querySelectorAll("img"));
                conferirIgual("4 imagens", todas.length, 4);
                conferir("todas dentro de um cartão e vindas de amostras/", todas.every(function (imagem) { return imagem.closest(".cartao") !== null && /\/curriculo\/final\/amostras\/[a-z]+\.png$/.test(imagem.src); }));
            });

            testar("a conferência de alt do final enxerga um alt que não nomeia o jogo", function () {
                const alt = "Uma tela colorida";
                conferirIgual("alt sem o nome do jogo é detectado", alt.toLowerCase().indexOf(projetos[1].nome.toLowerCase()) >= 0, false);
            });

            quadro.remove();
        }

        // ------------------------------------------------------------
        // Privacidade (GDD, seção 7): o que a página, os dados e o texto na tela dizem
        // ------------------------------------------------------------
        async function casosDePrivacidade() {
            const quadro = await abrirPasso(PASSO, ESPELHO_DO_INDEX);
            const janela = quadro.contentWindow, documento = janela.document;

            testar("a conferência de privacidade não é vazia: ela enxerga CPF, RG, telefone e e-mail real, e deixa passar o fictício", function () {
                ["123.456.789-09", "12.345.678-9", "(11) 98765-4321", "11 98765-4321", "+55 11 98765-4321", "98765-4321", "11987654321", "joao.silva@gmail.com", "alex@exemplo.com"].forEach(function (dado) {
                    conferir("detecta " + dado, achadosDePrivacidade("contato: " + dado).length >= 1);
                });
                ["alex@exemplo.invalid", "#1f6f43", "390×750", "2026-10-28", "2024-2026", "rgb(1, 3, 5)", "Cidade Exemplo, UF"].forEach(function (inocente) {
                    conferirIgual("deixa passar " + inocente, achadosDePrivacidade("texto: " + inocente).join(" | "), "");
                });
            });

            testar("o index.html, os dados dos projetos e o texto na tela não têm CPF, RG, telefone nem e-mail real", function () {
                conferirIgual("index.html (espelho)", achadosDePrivacidade(ESPELHO_DO_INDEX).join(" | "), "");
                conferirIgual("style.css (espelho)", achadosDePrivacidade(ESPELHO_DO_CSS).join(" | "), "");
                conferirIgual("dados de projetos.js", achadosDePrivacidade(JSON.stringify(janela.eval("projetos"))).join(" | "), "");
                conferirIgual("texto que a pessoa lê na tela", achadosDePrivacidade(documento.body.textContent).join(" | "), "");
            });

            testar("todo e-mail é @exemplo.invalid, e o contato é só e-mail, perfil e cidade", function () {
                const emails = Array.from(documento.querySelectorAll('a[href^="mailto:"]')).map(function (link) { return link.getAttribute("href"); });
                conferir("há 1 mailto: e ele é @exemplo.invalid (" + emails.join(", ") + ")", emails.length === 1 && /@exemplo\.invalid$/.test(emails[0]));
                const contato = documento.getElementById("contato");
                conferirIgual("nenhum link tel:", documento.querySelectorAll('a[href^="tel:"], a[href^="sms:"], a[href^="whatsapp:"]').length, 0);
                conferir("o contato tem só 3 linhas: e-mail, perfil e cidade (" + contato.querySelectorAll("p").length + ")", contato.querySelectorAll("p").length === 3);
                conferir("o perfil é de um domínio .invalid", Array.from(contato.querySelectorAll('a[href^="http"]')).every(function (link) { return /^https:\/\/exemplo\.invalid\//.test(link.getAttribute("href")); }));
            });

            testar("og:url e og:image são marcadores SEU-USUARIO/SEU-REPOSITORIO, nunca um endereço real", function () {
                const pagina = new DOMParser().parseFromString(ESPELHO_DO_INDEX, "text/html");
                ["og:url", "og:image"].forEach(function (campo) {
                    const endereco = pagina.head.querySelector('meta[property="' + campo + '"]').getAttribute("content");
                    conferir(campo + " = " + endereco, /^https:\/\/SEU-USUARIO\.github\.io\/SEU-REPOSITORIO\//.test(endereco));
                });
                const hospedeiros = Array.from(pagina.querySelectorAll("[href], [src], meta[content^='http']")).map(function (elemento) { return elemento.getAttribute("href") || elemento.getAttribute("src") || elemento.getAttribute("content"); })
                    .filter(function (endereco) { return /^https?:\/\//.test(endereco); }).map(function (endereco) { return new URL(endereco).hostname; });
                const permitidos = ["github.com", "exemplo.invalid", "seu-usuario.github.io"];   // new URL() devolve o nome em minúsculas
                conferir("todo endereço absoluto do index.html é o do curso, fictício ou marcador (" + Array.from(new Set(hospedeiros)).join(", ") + ")", hospedeiros.every(function (nome) { return permitidos.indexOf(nome) >= 0; }));
            });

            testar("o aviso de privacidade está no topo do index.html, antes do <head>", function () {
                const aviso = ESPELHO_DO_INDEX.slice(0, ESPELHO_DO_INDEX.indexOf("<head>"));
                ["NÃO PUBLIQUE", "CPF", "telefone", "PREFIRA", "TROQUE"].forEach(function (palavra) { conferir("o comentário inicial cita " + palavra, aviso.indexOf(palavra) >= 0); });
            });

            quadro.remove();
        }

        async function casosDoFinal() {
            await casosDeEstrutura();
            await casosDeLayout();
            await casosDasMiniaturas();
            await casosDePrivacidade();

            const quadro = await executarCasosDeCompartilhamento(PASSO, ESPELHO_DO_INDEX);
            quadro.remove();
        }

        vigiarOFim(280);
        rodarAcabamento(PASSO, ESPELHO_DO_INDEX, ESPELHO_DO_CSS, casosDoFinal);
    </script>
