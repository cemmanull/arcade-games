        "",
        "<body>",

        "            <h2 id=\"titulo-sobre\">Sobre mim<\/h2>",

        "                <li><strong>Canvas e laço de jogo.<\/strong> Prova: <a href=\"#projeto-cobrinha\">Jogo da Cobrinha<\/a>.<\/li>",

    const ESPELHO_DO_CSS = [
        "/*",
        "  PASSO 5: TEMA, MOVIMENTO, IMPRESSÃO E A TECLA H (sobre o layout do passo 2)",
        "  As regras fora de qualquer media query valem para o celular (390 px). O que muda em tela grande fica",
        "  no fim, em @media (min-width: 48rem). Cores e espaços são variáveis: troque aqui e muda em tudo.",
        "*/",
        ":root {",
        "    color-scheme: light dark;",
        "    --fundo: light-dark(#f7f7fb, #12121a);",
        "    --superficie: light-dark(#ffffff, #1c1c28);",
        "    --texto: light-dark(#1b1b26, #ececf5);",
        "    --texto-suave: light-dark(#4a4a5c, #b8b8cc);",
        "    --destaque: light-dark(#3b3bb3, #9db4ff);",
        "    --borda: light-dark(#8a8aa0, #7a7a92);",
        "    --foco: light-dark(#b34700, #ffb454);",
        "    --espaco: 1rem;",
        "    --raio: 0.75rem;",
        "}",
        "",
        "/* A escolha do botão (gravada em localStorage) vira data-tema no <html> e vence o sistema. */",
        ":root[data-tema=\"claro\"] { color-scheme: light; }",
        ":root[data-tema=\"escuro\"] { color-scheme: dark; }",
        "",
        "* { box-sizing: border-box; }",
        "",
        "body {",
        "    margin: 0 auto;",
        "    padding: 0 var(--espaco);",
        "    max-width: 70rem;",
        "    font-family: system-ui, sans-serif;",
        "    font-size: 1.125rem;",
        "    line-height: 1.5;",
        "    color: var(--texto);",
        "    background: var(--fundo);",
        "}",
        "",
        "h1, h2, h3 { margin: 0 0 0.5rem; line-height: 1.2; }",
        "h1 { margin-top: var(--espaco); font-size: 2rem; }",
        "h2 { font-size: 1.5rem; }",
        "h3 { font-size: 1.25rem; }",
        "",
        "a { color: var(--destaque); }",
        "a:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }",
        "",
        ".pular {",
        "    position: absolute;",
        "    left: 0.5rem;",
        "    top: 0.5rem;",
        "    padding: 0.75rem 1rem;",
        "    background: var(--superficie);",
        "    transform: translateY(-200%);",
        "}",
        "",
        ".pular:focus { transform: none; }",
        "",
        "/* O MENU: uma linha que quebra para a seguinte quando falta espaço. Cada alvo tem 3rem (48 px) de altura. */",
        "nav ul {",
        "    display: flex;",
        "    flex-wrap: wrap;",
        "    gap: 0.5rem;",
        "    margin: 0;",
        "    padding: 0;",
        "    list-style: none;",
        "}",
        "",
        "nav a, nav button, .cartao a, #contato a {",
        "    display: inline-flex;",
        "    align-items: center;",
        "    min-height: 3rem;",
        "}",
        "",
        "nav a, nav button {",
        "    padding: 0 var(--espaco);",
        "    border: 2px solid var(--borda);",
        "    border-radius: var(--raio);",
        "    background: var(--superficie);",
        "}",
        "",
        "section { margin: 2rem 0; }",
        "",
        "/* A GRADE: tantas colunas de pelo menos 16rem (256 px) quantas couberem, com 1rem de vão. Duas pedem 2×256+16 = 528 px de",
        "   espaço útil e três pedem 800 px. Em 390 px cabe 1. Em 1280 px cabem 3, nunca 4: o corpo para em 70rem e perde 2rem de cada lado. */",
        ".habilidades, .projetos {",
        "    display: grid;",
        "    grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));",
        "    gap: var(--espaco);",
        "    margin: 0;",
        "    padding: 0;",
        "    list-style: none;",
        "}",
        "",
        ".habilidades li, .cartao {",
        "    padding: var(--espaco);",
        "    border: 2px solid var(--borda);",
        "    border-radius: var(--raio);",
        "    background: var(--superficie);",
        "}",
        "",
        ".cartao { display: flex; flex-direction: column; }",
        ".cartao p { margin: 0 0 0.5rem; color: var(--texto-suave); }",
        "",
        "/* A MINIATURA: um bloco 16:9 que enche a largura do cartão (SVG ou, no final, uma <img>). */",
        ".miniatura {",
        "    display: block;",
        "    width: 100%;",
        "    aspect-ratio: 16 / 9;",
        "    margin-bottom: var(--espaco);",
        "    border-radius: calc(var(--raio) / 2);",
        "    object-fit: cover;",
        "    object-position: top;",
        "}",
        "",
        "/* As técnicas são texto em etiquetas: o significado está nas palavras, não na cor. */",
        ".tecnicas {",
        "    display: flex;",
        "    flex-wrap: wrap;",
        "    gap: 0.5rem;",
        "    margin: 0 0 var(--espaco);",
        "    padding: 0;",
        "    list-style: none;",
        "    font-size: 0.875rem;",
        "}",
        "",
        ".tecnicas li {",
        "    padding: 0.125rem 0.75rem;",
        "    border: 1px solid var(--borda);",
        "    border-radius: 1rem;",
        "}",
        "",
        "/* As ações, o selo e a amostra de código. */",
        ".acoes { display: flex; flex-wrap: wrap; gap: var(--espaco); align-items: center; }",
        ".cartao .selo { font-weight: bold; color: var(--texto); }",
        "",
        "button {",
        "    min-height: 3rem;",
        "    padding: 0 var(--espaco);",
        "    border: 2px solid var(--borda);",
        "    border-radius: var(--raio);",
        "    font: inherit;",
        "    color: var(--texto);",
        "    background: var(--superficie);",
        "}",
        "",
        "button:focus-visible, summary:focus-visible, pre:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; }",
        "",
        "details { margin-top: var(--espaco); }",
        "summary { display: flex; align-items: center; gap: 0.5rem; min-height: 3rem; cursor: pointer; color: var(--destaque); text-decoration: underline; }",
        "summary::before { content: \"▸\"; }",
        "details[open] summary::before { content: \"▾\"; }",
        "",
        "pre {",
        "    margin: 0;",
        "    padding: var(--espaco);",
        "    overflow-x: auto;",
        "    font-size: 0.875rem;",
        "    line-height: 1.4;",
        "    border: 1px solid var(--borda);",
        "    border-radius: calc(var(--raio) / 2);",
        "    background: var(--fundo);",
        "}",
        "",
        ".credito { margin: var(--espaco) 0 0; font-size: 0.875rem; }",
        "",
        "/* Com o jogo aberto, o cartão ocupa a linha inteira da grade. O quadro tem a proporção de uma tela de celular (390×750) e no",
        "   máximo 390 px de largura: um jogo pensado para essa tela cabe inteiro, sem corte. */",
        ".cartao:has(iframe) { grid-column: 1 / -1; }",
        ".cartao iframe { display: block; width: 100%; max-width: 390px; aspect-ratio: 390 / 750; margin-top: var(--espaco); border: 2px solid var(--borda); }",
        "",
        "/* O aviso só ocupa espaço quando os dados têm erro (quem edita projetos.js vê o que arrumar). */",
        "#avisos:not(:empty) {",
        "    margin-bottom: var(--espaco);",
        "    padding: var(--espaco);",
        "    border: 2px dashed var(--foco);",
        "    border-radius: var(--raio);",
        "    background: var(--superficie);",
        "}",
        "footer { padding: var(--espaco) 0 2rem; color: var(--texto-suave); }",
        "",
        "/* TELAS GRANDES: o título e o menu dividem a primeira linha do cabeçalho. */",
        "@media (min-width: 48rem) {",
        "    body { padding: 0 2rem; }",
        "",
        "    header {",
        "        display: grid;",
        "        grid-template-columns: 1fr auto;",
        "        grid-template-areas: \"titulo menu\" \"frase frase\";",
        "        align-items: center;",
        "    }",
        "",
        "    h1 { grid-area: titulo; font-size: 2.75rem; }",
        "    header p { grid-area: frase; }",
        "    nav { grid-area: menu; }",
        "}",
        "",
        "/* MOVIMENTO: nada anima sozinho; só a troca de cor de um botão leva 0,15 s, e quem pediu menos movimento não vê nem isso. */",
        "button { transition: background-color 0.15s; }",
        "button:hover { background: var(--fundo); }",
        "",
        "@media (prefers-reduced-motion: reduce) {",
        "    * { transition: none !important; animation: none !important; }",
        "}",
        "",
        "/* TECLA H: contorno tracejado nos marcos e o nível ao lado de cada título (forma e texto, não só cor). */",
        ".ver-estrutura [data-marco] { position: relative; outline: 3px dashed var(--foco); outline-offset: 4px; }",
        "",
        ".ver-estrutura [data-marco]::before {",
        "    content: attr(data-marco);",
        "    position: absolute;",
        "    top: -1.5rem;",
        "    right: 0;",
        "    padding: 0 0.25rem;",
        "    font: bold 0.875rem monospace;",
        "    color: var(--foco);",
        "    background: var(--fundo);",
        "}",
        "",
        ".ver-estrutura [data-nivel]::after { content: \" [\" attr(data-nivel) \"]\"; font: bold 0.875rem monospace; color: var(--foco); }",
        "#botao-ver { margin-top: var(--espaco); }",
        "",
        "/* IMPRESSÃO (Ctrl+P): A4, sem menu nem botões, fundo branco, texto preto. Só o endereço de um link externo (http) é escrito",
        "   ao lado dele: um caminho relativo não serve no papel, e o e-mail já aparece como texto. */",
        "@page { size: A4; margin: 1.5cm; }",
        "",
        "@media print {",
        "    :root { color-scheme: light !important; }",
        "    nav, button, iframe, details, .pular, #aviso-estrutura { display: none !important; }",
        "    [data-marco] { outline: none !important; }",
        "    [data-marco]::before, [data-nivel]::after { content: none !important; }",
        "    body { max-width: none; padding: 0; font-size: 11pt; color: #000; background: #fff; }",
        "    a { color: #000; }",
        "    a[href^=\"http\"]::after { content: \" (\" attr(href) \")\"; font-size: 0.8em; word-break: break-all; }",
        "    .credito a::after { content: none; }   /* o endereço do curso sai uma vez só, no rodapé */",
        "    .projetos, .habilidades { display: block; }",
        "    .cartao, .habilidades li { margin-bottom: var(--espaco); border-color: #000; break-inside: avoid; }",
        "    .miniatura { max-width: 12rem; }",
        "}",
        ""
    ].join("\n");
    // ESPELHO:fim
    </script>

        rodarAcabamento("05-acabamento", ESPELHO_DO_INDEX, ESPELHO_DO_CSS);
