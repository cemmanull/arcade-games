<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Reflexo, passo 5: texturas</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        pre  { font-size: 14px; white-space: pre-wrap; }
        canvas { display: none; }
    </style>
</head>

<body>
    <h1>Teste — Reflexo, passo 5: texturas</h1>
    <pre id="resultado"></pre>

    <!-- O esqueleto do passo: o script dele procura estes ids e os botões [data-acao]. -->
    <div id="palco">
        <canvas id="visao" width="320" height="200"></canvas>
        <canvas id="jogo" width="384" height="288" hidden></canvas>
    </div>
    <p id="leitura"></p>
    <div id="controles">
        <button type="button" data-acao="girarEsquerda">girarEsquerda</button>
        <button type="button" data-acao="frente">frente</button>
        <button type="button" data-acao="girarDireita">girarDireita</button>
        <button type="button" data-acao="esquerda">esquerda</button>
        <button type="button" data-acao="tras">tras</button>
        <button type="button" data-acao="direita">direita</button>
    </div>

    <!-- Ordem importa: o apoio troca o relógio e o sorteio ANTES do jogo carregar. -->
    <script src="../apoio.js"></script>

    <!-- A janela do teste é falsa e mutável (1280×720): o jogo lê innerWidth/innerHeight ao carregar. -->
    <script>
        const janelaFalsa = { largura: 1280, altura: 720 };
        Object.defineProperty(window, "innerWidth", { get: function () { return janelaFalsa.largura; }, configurable: true });
        Object.defineProperty(window, "innerHeight", { get: function () { return janelaFalsa.altura; }, configurable: true });
    </script>

    <!-- Este passo é sobre PIXELS: a imagem (#visao) e as texturas usam o canvas de verdade, e o teste
         lê o buffer e o canvas. Só a planta (#jogo) ignora o desenho. -->
    <script>
        const contextoDaPlanta = new Proxy({}, {
            get: function (propriedades, nome) { return nome in propriedades ? propriedades[nome] : function () { }; },
            set: function (propriedades, nome, valor) { propriedades[nome] = valor; return true; }
        });
        const obterContextoDeVerdade = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (tipo, opcoes) {
            return this.id === "jogo" ? contextoDaPlanta : obterContextoDeVerdade.call(this, tipo, opcoes);
        };
    </script>
    <script src="../../reflexo/05-texturas/script.js"></script>

    <script>
        const TOLERANCIA = 1e-9;
        const VOLTA_COMPLETA = 2 * Math.PI;
        const SIMBOLOS_SOLIDOS_ESPERADOS = "#%DER";
        const PLANO_ESPERADO = Math.tan(33 * Math.PI / 180);   // campo de visão de 66°

        // A especificação da névoa e do fundo, escrita aqui (GDD, seção 6 e GUIA), não lida do jogo.
        const NIVEIS = 32;
        const DISTANCIA_DA_NEVOA_ESPERADA = 10;
        const NIVEIS_EXTRAS_DA_FACE_Y = 5;
        const NEVOA = [8, 8, 14];
        const HORIZONTE = [10, 10, 18];
        const TETO_ALTO = [4, 4, 9];
        const PISO_BAIXO = [38, 38, 56];

        // ---- ajudantes: sempre pelas portas do jogo (eventos e quadros) ----

        function apertarTecla(tecla) {
            const evento = new KeyboardEvent("keydown", { key: tecla, cancelable: true });
            document.dispatchEvent(evento);
            return evento;
        }

        function soltarTecla(tecla) {
            document.dispatchEvent(new KeyboardEvent("keyup", { key: tecla }));
        }

        function soltarTudo() {
            window.dispatchEvent(new Event("blur"));
        }

        // Põe o jogador numa pose conhecida, sem ações ativas, e roda UM quadro sem entrada
        // (é ele que lança os raios e desenha o buffer).
        function reiniciarEVer(x, y, angulo) {
            soltarTudo();
            jogador.x = x;
            jogador.y = y;
            jogador.angulo = angulo;
            atualizarDirecao();
            avancarQuadro(16);
        }

        function perto(obtido, esperado, tolerancia) {
            return Math.abs(obtido - esperado) <= (tolerancia === undefined ? TOLERANCIA : tolerancia);
        }

        function pertoRelativo(obtido, esperado, tolerancia) {
            return Math.abs(obtido - esperado) <= (tolerancia === undefined ? 1e-9 : tolerancia) * Math.max(1, Math.abs(esperado));
        }

        function constanteK(largura) {
            return largura / (2 * PLANO_ESPERADO);
        }

        function comJanela(largura, altura, funcao) {
            janelaFalsa.largura = largura;
            janelaFalsa.altura = altura;
            try {
                window.dispatchEvent(new Event("resize"));
                funcao();
            } finally {
                janelaFalsa.largura = 1280;
                janelaFalsa.altura = 720;
                window.dispatchEvent(new Event("resize"));
                soltarTudo();
            }
        }

        function corDoHex(hex) {
            return [1, 3, 5].map(function (inicio) { return parseInt(hex.slice(inicio, inicio + 2), 16); });
        }

        function sortearPoseLivre() {
            for (let tentativa = 0; tentativa < 1000; tentativa++) {
                const x = 1 + Math.random() * (COLUNAS - 2);
                const y = 1 + Math.random() * (LINHAS - 2);
                if (!casaSolidaNoTexto(Math.floor(x), Math.floor(y))) {
                    return { x: x, y: y, angulo: Math.random() * VOLTA_COMPLETA };
                }
            }
            throw new Error("não achei pose livre");
        }

        // ---- a verdade independente 1: o texto do mapa e a interseção raio × casa (placas) ----

        function casaSolidaNoTexto(coluna, linha) {
            const simbolo = MAPA_EM_TEXTO[linha] && MAPA_EM_TEXTO[linha][coluna];
            return simbolo === undefined || SIMBOLOS_SOLIDOS_ESPERADOS.includes(simbolo);
        }

        function intervaloNoEixo(origem, direcao, minimo, maximo) {
            if (direcao === 0) {
                return origem >= minimo && origem < maximo ? { entra: -Infinity, sai: Infinity } : null;
            }
            const aoMinimo = (minimo - origem) / direcao;
            const aoMaximo = (maximo - origem) / direcao;
            return { entra: Math.min(aoMinimo, aoMaximo), sai: Math.max(aoMinimo, aoMaximo) };
        }

        function raioDeReferencia(origemX, origemY, direcaoX, direcaoY) {
            let melhor = null;
            for (let linha = 0; linha < MAPA_EM_TEXTO.length; linha++) {
                for (let coluna = 0; coluna < MAPA_EM_TEXTO[linha].length; coluna++) {
                    if (!casaSolidaNoTexto(coluna, linha)) {
                        continue;
                    }
                    const noX = intervaloNoEixo(origemX, direcaoX, coluna, coluna + 1);
                    const noY = intervaloNoEixo(origemY, direcaoY, linha, linha + 1);
                    if (noX === null || noY === null) {
                        continue;
                    }
                    const entra = Math.max(noX.entra, noY.entra);
                    const sai = Math.min(noX.sai, noY.sai);
                    if (!(sai > entra && sai > 0)) {
                        continue;
                    }
                    const distancia = Math.max(entra, 0);
                    if (melhor === null || distancia < melhor.distancia) {
                        melhor = {
                            coluna: coluna, linha: linha, distancia: distancia,
                            lado: noX.entra > noY.entra ? "x" : "y",
                            x: origemX + direcaoX * distancia, y: origemY + direcaoY * distancia
                        };
                    }
                }
            }
            return melhor;
        }

        function desvioDaColuna(coluna, largura) {
            return Math.atan(PLANO_ESPERADO * (2 * (coluna + 0.5) / largura - 1));
        }

        function acertaNaQuina(resultado) {
            return perto(resultado.x, Math.round(resultado.x), 1e-9) && perto(resultado.y, Math.round(resultado.y), 1e-9);
        }

        // Casa, face e distância de TODAS as colunas contra a referência. Devolve null ou o motivo.
        function motivoDeColunasErradas() {
            const largura = larguraDaVisao;
            if (raiosDaTela.length !== largura) {
                return "há " + raiosDaTela.length + " raios para " + largura + " colunas";
            }
            for (let coluna = 0; coluna < largura; coluna++) {
                const resultado = raiosDaTela[coluna];
                if (acertaNaQuina(resultado)) {
                    continue;
                }
                const anguloDoRaio = jogador.angulo + desvioDaColuna(coluna, largura);
                const esperado = raioDeReferencia(jogador.x, jogador.y, Math.cos(anguloDoRaio), Math.sin(anguloDoRaio));
                const nome = "coluna " + coluna + " na pose (" + jogador.x.toFixed(3) + ", " + jogador.y.toFixed(3) + ", " + jogador.angulo.toFixed(3) + ")";
                if (esperado === null || esperado.coluna !== resultado.coluna || esperado.linha !== resultado.linha || esperado.lado !== resultado.lado) {
                    return nome + ": casa/lado (" + resultado.coluna + ", " + resultado.linha + ") " + resultado.lado + " em vez de " + JSON.stringify(esperado);
                }
                if (!pertoRelativo(resultado.distancia * Math.cos(desvioDaColuna(coluna, largura)), resultado.perpendicular, 1e-9)) {
                    return nome + ": perpendicular " + resultado.perpendicular + " não é distância × cos(desvio)";
                }
                if (!pertoRelativo(resultado.altura * resultado.perpendicular, constanteK(largura))) {
                    return nome + ": altura × perpendicular = " + resultado.altura * resultado.perpendicular + " em vez de k";
                }
            }
            return null;
        }

        // ---- a verdade independente 2: u, a posição ao longo da face ----

        // Os dois extremos da face batida, tirados da casa e do ponto de impacto (que está numa linha da grade).
        function extremosDaFace(resultado) {
            if (resultado.lado === "x") {
                const linhaDaGrade = Math.round(resultado.x);
                return [[linhaDaGrade, resultado.linha], [linhaDaGrade, resultado.linha + 1]];
            }
            const linhaDaGrade = Math.round(resultado.y);
            return [[resultado.coluna, linhaDaGrade], [resultado.coluna + 1, linhaDaGrade]];
        }

        // Geometria pura: o extremo da ESQUERDA, visto do olho, é o de menor ângulo (o ângulo cresce para a
        // direita da tela). u é a distância do impacto até esse extremo.
        function uDeReferencia(resultado) {
            const extremos = extremosDaFace(resultado);
            const aX = extremos[0][0] - jogador.x;
            const aY = extremos[0][1] - jogador.y;
            const bX = extremos[1][0] - jogador.x;
            const bY = extremos[1][1] - jogador.y;
            const esquerdo = aX * bY - aY * bX > 0 ? extremos[0] : extremos[1];
            return Math.hypot(resultado.x - esquerdo[0], resultado.y - esquerdo[1]);
        }

        function chaveDaFace(resultado) {
            return resultado.coluna + "," + resultado.linha + resultado.lado + (resultado.lado === "x" ? Math.round(resultado.x) : Math.round(resultado.y));
        }

        // u de todas as colunas contra a referência geométrica. Devolve null ou o motivo.
        function motivoDeUErrado() {
            for (let coluna = 0; coluna < raiosDaTela.length; coluna++) {
                const resultado = raiosDaTela[coluna];
                if (acertaNaQuina(resultado)) {
                    continue;
                }
                const esperado = uDeReferencia(resultado);
                const nome = "coluna " + coluna + " na pose (" + jogador.x.toFixed(3) + ", " + jogador.y.toFixed(3) + ", " + jogador.angulo.toFixed(3) + ") face " + chaveDaFace(resultado);
                if (!(resultado.u >= 0 && resultado.u <= 1)) {
                    return nome + ": u = " + resultado.u + " fora de 0 a 1";
                }
                if (!perto(resultado.u, esperado, 1e-7)) {
                    return nome + ": u = " + resultado.u + " em vez de " + esperado;
                }
            }
            return null;
        }

        // Em cada face contígua, u cresce a cada coluna (da esquerda para a direita da tela). null ou o motivo.
        function motivoDeUNaoCrescer() {
            let paresVistos = 0;
            for (let coluna = 1; coluna < raiosDaTela.length; coluna++) {
                const anterior = raiosDaTela[coluna - 1];
                const atual = raiosDaTela[coluna];
                if (chaveDaFace(anterior) !== chaveDaFace(atual) || acertaNaQuina(anterior) || acertaNaQuina(atual)) {
                    continue;
                }
                paresVistos++;
                if (!(atual.u > anterior.u)) {
                    return "colunas " + (coluna - 1) + " e " + coluna + " da face " + chaveDaFace(atual) + ": u " + anterior.u + " → " + atual.u + " não cresce";
                }
            }
            return paresVistos > 0 ? null : "nenhum par de colunas na mesma face";
        }

        // ---- a verdade independente 3: o buffer de pixels da técnica B, pixel a pixel ----

        function misturarComANevoa(cor, nivel) {
            return cor.map(function (canal, indice) { return Math.round(canal + (NEVOA[indice] - canal) * (nivel / (NIVEIS - 1))); });
        }

        function nivelDeReferencia(perpendicular, lado) {
            return Math.min(NIVEIS - 1, Math.floor(perpendicular / DISTANCIA_DA_NEVOA_ESPERADA * (NIVEIS - 1)) + (lado === "y" ? NIVEIS_EXTRAS_DA_FACE_Y : 0));
        }

        function corDoTexel(simbolo, linhaDaTextura, colunaDaTextura, nivel) {
            const letra = TEXTURAS_EM_TEXTO[simbolo][linhaDaTextura][colunaDaTextura];
            return misturarComANevoa(corDoHex(PALETA_DAS_TEXTURAS[letra]), nivel);
        }

        // Escreve na imagem esperada o pixel (linha, coluna) com a cor [r, g, b].
        function pintar(bytes, largura, linha, coluna, cor) {
            const inicio = (linha * largura + coluna) * 4;
            bytes[inicio] = cor[0];
            bytes[inicio + 1] = cor[1];
            bytes[inicio + 2] = cor[2];
            bytes[inicio + 3] = 255;
        }

        // Teto e piso; depois, para cada coluna, cada pixel cujo CENTRO cai dentro da parede.
        function imagemDeReferencia() {
            const largura = larguraDaVisao;
            const altura = alturaDaVisao;
            const k = constanteK(largura);
            const bytes = new Uint8ClampedArray(largura * altura * 4);
            const colunasAmbiguas = [];
            const pixelsAmbiguos = new Set();   // empates de ponto flutuante (ex.: altura exatamente 118): não dá para decidir

            for (let linha = 0; linha < altura; linha++) {
                const distanciaDoHorizonte = Math.abs(linha + 0.5 - altura / 2) / (altura / 2);
                const extremo = linha < altura / 2 ? TETO_ALTO : PISO_BAIXO;
                const cor = HORIZONTE.map(function (canal, indice) { return Math.round(canal + (extremo[indice] - canal) * distanciaDoHorizonte); });
                for (let coluna = 0; coluna < largura; coluna++) {
                    pintar(bytes, largura, linha, coluna, cor);
                }
            }

            for (let coluna = 0; coluna < largura; coluna++) {
                const resultado = raiosDaTela[coluna];
                const simbolo = MAPA_EM_TEXTO[resultado.linha][resultado.coluna];
                const alturaDaParede = k / resultado.perpendicular;
                const nivel = nivelDeReferencia(resultado.perpendicular, resultado.lado);
                const posicao = uDeReferencia(resultado) * TAMANHO_DA_TEXTURA_ESPERADO;
                if (Math.abs(posicao - Math.round(posicao)) < 1e-6) {
                    colunasAmbiguas.push(coluna);   // u cai quase em cima da divisa de dois texels: não dá para decidir
                }
                const colunaDaTextura = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicao));
                const topoReal = (altura - alturaDaParede) / 2;

                for (let linha = 0; linha < altura; linha++) {
                    const centro = linha + 0.5;
                    const posicaoNaTextura = (centro - topoReal) / alturaDaParede * TAMANHO_DA_TEXTURA_ESPERADO;
                    if (Math.abs(centro - topoReal) < 1e-9 || Math.abs(centro - topoReal - alturaDaParede) < 1e-9
                        || Math.abs(posicaoNaTextura - Math.round(posicaoNaTextura)) < 1e-9) {
                        pixelsAmbiguos.add(linha * largura + coluna);
                    }
                    if (centro < topoReal || centro >= topoReal + alturaDaParede) {
                        continue;
                    }
                    const linhaDaTextura = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicaoNaTextura));
                    pintar(bytes, largura, linha, coluna, corDoTexel(simbolo, linhaDaTextura, colunaDaTextura, nivel));
                }
            }
            return { bytes: bytes, colunasAmbiguas: colunasAmbiguas, pixelsAmbiguos: pixelsAmbiguos };
        }

        const TAMANHO_DA_TEXTURA_ESPERADO = 16;
        const LIMIAR_DE_COR = 12;
        const MINIMO_DE_CONCORDANCIA = 0.97;

        // Compara o buffer do jogo com a referência. Colunas ambíguas são ignoradas. null ou o motivo.
        function motivoDeBufferErrado() {
            const largura = larguraDaVisao;
            const altura = alturaDaVisao;
            const referencia = imagemDeReferencia();
            const ignoradas = new Set(referencia.colunasAmbiguas);
            const nome = "pose (" + jogador.x.toFixed(3) + ", " + jogador.y.toFixed(3) + ", " + jogador.angulo.toFixed(3) + ") " + largura + "×" + altura;

            if (imagem.width !== largura || imagem.height !== altura || pixels.length !== largura * altura) {
                return nome + ": buffer " + imagem.width + "×" + imagem.height + " (" + pixels.length + " pixels)";
            }
            const bytesDoJogo = imagem.data;
            for (let linha = 0; linha < altura; linha++) {
                for (let coluna = 0; coluna < largura; coluna++) {
                    if (ignoradas.has(coluna) || referencia.pixelsAmbiguos.has(linha * largura + coluna)) {
                        continue;
                    }
                    const inicio = (linha * largura + coluna) * 4;
                    for (let canal = 0; canal < 4; canal++) {
                        if (bytesDoJogo[inicio + canal] !== referencia.bytes[inicio + canal]) {
                            return nome + ": pixel (coluna " + coluna + ", linha " + linha + ") tem [" + Array.from(bytesDoJogo.slice(inicio, inicio + 4)) + "] em vez de ["
                                + Array.from(referencia.bytes.slice(inicio, inicio + 4)) + "] (face " + chaveDaFace(raiosDaTela[coluna]) + ", u " + raiosDaTela[coluna].u.toFixed(4) + ")";
                        }
                    }
                }
            }
            return null;
        }

        // O canvas (depois do putImageData) mostra o mesmo que o buffer. null ou o motivo.
        function motivoDeCanvasDiferenteDoBuffer() {
            const doCanvas = pincelVisao.getImageData(0, 0, larguraDaVisao, alturaDaVisao).data;
            for (let indice = 0; indice < doCanvas.length; indice++) {
                if (doCanvas[indice] !== imagem.data[indice]) {
                    return "byte " + indice + ": canvas " + doCanvas[indice] + ", buffer " + imagem.data[indice];
                }
            }
            return null;
        }

        function todosOsPixelsOpacos() {
            const bytes = imagem.data;
            for (let indice = 3; indice < bytes.length; indice += 4) {
                if (bytes[indice] !== 255) {
                    return false;
                }
            }
            return true;
        }

        // ---- casos ----

        testar("estado inicial: texturas prontas, buffer do tamanho da imagem", function () {
            conferirIgual("nenhuma ação ativa ao abrir", acoesAtivas.size, 0);
            conferirIgual("a depuração começa desligada", depuracaoLigada, false);
            conferirIgual("o J virou chão", mapa[1][1], ".");
            conferirIgual("com a janela falsa de 1280×720 a imagem é 320 de largura", larguraDaVisao, 320);
            conferirIgual("e 200 de altura", alturaDaVisao, 200);
            conferirIgual("o buffer tem 320 × 200 pixels", pixels.length, 320 * 200);
            conferirIgual("o ImageData tem 4 bytes por pixel", imagem.data.length, 320 * 200 * 4);
            conferirIgual("o fundo (teto e piso) tem o mesmo tamanho", fundo.length, 320 * 200);
            conferirIgual("o raio do olhar existe", typeof raio, "object");
            conferirIgual("a imagem começa visível", visao.hidden, false);
            conferirIgual("e a planta escondida", tela.hidden, true);
            // Um "resize" do próprio Chrome pode chegar entre o script do jogo e este (ele refaz os raios no
            // quadro seguinte); por isso a contagem é conferida depois do primeiro quadro, não antes.
            avancarQuadro(16);
            conferirIgual("um raio por coluna depois do primeiro quadro", raiosDaTela.length, 320);

            const simbolos = Object.keys(TEXTURAS_EM_TEXTO).sort().join("");
            conferirIgual("as cinco texturas do mapa: tijolo, pedra, porta, emissor e receptor", simbolos, "#%DER");
            Object.keys(texturasSombreadas).forEach(function (simbolo) {
                conferir("textura " + simbolo + ": 32 níveis de névoa, cada um com 256 pixels",
                    texturasSombreadas[simbolo].length === NIVEIS && texturasSombreadas[simbolo].every(function (nivel) { return nivel.length === 256; }));
                conferir("textura " + simbolo + ": canvas 16×16 para a técnica A", canvasesDasTexturas[simbolo].width === 16 && canvasesDasTexturas[simbolo].height === 16);
            });
            conferirIgual("32 estilos de névoa para a técnica A", estilosDaNevoa.length, NIVEIS);
            conferirIgual("o último estilo é a névoa opaca", estilosDaNevoa[31], "rgba(8, 8, 14, 1)");
            conferirIgual("o primeiro é transparente", estilosDaNevoa[0], "rgba(8, 8, 14, 0)");
        });

        testar("constantes do campo de visão", function () {
            conferir("o campo de visão é 66°", perto(CAMPO_DE_VISAO, 66 * Math.PI / 180));
            conferir("PLANO = tan(33°)", perto(PLANO, PLANO_ESPERADO));
        });

        testar("névoa nas texturas: nível 0 é a cor pura, 31 é a cor da névoa, e nada clareia", function () {
            conferirIgual("o tijolo (0, 0) é a letra a = #964632 no nível 0", Array.from(bytesDoTexel("#", 0, 0, 0)).join(","), "150,70,50,255");

            let primeiroProblema = null;
            Object.keys(texturasSombreadas).forEach(function (simbolo) {
                for (let texel = 0; texel < 256 && primeiroProblema === null; texel++) {
                    const letra = TEXTURAS_EM_TEXTO[simbolo][Math.floor(texel / 16)][texel % 16];
                    const pura = corDoHex(PALETA_DAS_TEXTURAS[letra]);
                    const nivelZero = Array.from(bytesDoTexel(simbolo, 0, texel, 0));
                    const nivelUltimo = Array.from(bytesDoTexel(simbolo, 0, texel, 31));
                    if (nivelZero.join(",") !== pura.concat(255).join(",")) {
                        primeiroProblema = simbolo + " texel " + texel + ": nível 0 = " + nivelZero + " em vez de " + pura;
                    }
                    if (nivelUltimo.join(",") !== NEVOA.concat(255).join(",")) {
                        primeiroProblema = simbolo + " texel " + texel + ": nível 31 = " + nivelUltimo + " em vez da névoa " + NEVOA;
                    }
                }
            });
            conferir("em todos os 5 × 256 texels: o nível 0 é a cor da paleta e o 31 é exatamente a cor da névoa (8, 8, 14)", primeiroProblema === null, primeiroProblema);

            let primeiraClareada = null;
            Object.keys(texturasSombreadas).forEach(function (simbolo) {
                for (let texel = 0; texel < 256 && primeiraClareada === null; texel++) {
                    let brilhoAnterior = Infinity;
                    let distanciaAnterior = Infinity;
                    for (let nivel = 0; nivel < NIVEIS && primeiraClareada === null; nivel++) {
                        const cor = Array.from(bytesDoTexel(simbolo, 0, texel, nivel));
                        const brilho = 0.2126 * cor[0] + 0.7152 * cor[1] + 0.0722 * cor[2];
                        const distanciaDaNevoa = Math.max(Math.abs(cor[0] - NEVOA[0]), Math.abs(cor[1] - NEVOA[1]), Math.abs(cor[2] - NEVOA[2]));
                        if (cor[3] !== 255) {
                            primeiraClareada = simbolo + " texel " + texel + " nível " + nivel + ": alfa " + cor[3];
                        } else if (brilho > brilhoAnterior + 1e-9 || distanciaDaNevoa > distanciaAnterior) {
                            primeiraClareada = simbolo + " texel " + texel + " nível " + nivel + ": " + cor + " clareou (brilho " + brilho + " contra " + brilhoAnterior + ")";
                        }
                        brilhoAnterior = brilho;
                        distanciaAnterior = distanciaDaNevoa;
                    }
                }
            });
            conferir("subir o nível nunca clareia um texel (brilho nem distância à névoa) e o alfa fica 255", primeiraClareada === null, primeiraClareada);
        });

        // Os 4 bytes (R, G, B, A) de um texel já sombreado, lidos pelo jeito do jogo: Uint32 → bytes.
        function bytesDoTexel(simbolo, _ignorado, texel, nivel) {
            const um = Uint32Array.of(texturasSombreadas[simbolo][nivel][texel]);
            return new Uint8Array(um.buffer);
        }

                        primeiraViolacao = "quadro " + quadro + " coluna " + coluna + ": perpendicular " + resultado.perpendicular + " altura " + resultado.altura + " u " + resultado.u;
                    }
                    if (coluna % 40 === 0) {
                        facesBatidas.add(chaveDaFace(resultado));
                    }
                }
                if (primeiraViolacao === null && !todosOsPixelsOpacos()) {
                    primeiraViolacao = "quadro " + quadro + ": há pixel transparente no buffer (NaN no cálculo de uma linha?)";
                }
                if (primeiraViolacao === null && !(Number.isFinite(medicao.a) && Number.isFinite(medicao.b) && medicao.a >= 0 && medicao.b >= 0)) {
                    primeiraViolacao = "quadro " + quadro + ": medição " + JSON.stringify(medicao);
                }
                if (primeiraViolacao === null && quadro % 40 === 0) {
                    quadrosComReferencia++;
                    // com a planta à mostra o buffer não é redesenhado: só os raios valem
                    const motivo = motivoDeColunasErradas() || motivoDeUErrado() || (depuracaoLigada ? null : motivoDeBufferErrado());
                    if (motivo !== null) {
                        primeiraViolacao = "quadro " + quadro + ": " + motivo;
                    }
                }
                if (primeiraViolacao === null && depuracaoLigada && /NaN|Infinity|undefined/.test(document.getElementById("leitura").textContent)) {
                    primeiraViolacao = "quadro " + quadro + ": leitura com NaN: " + document.getElementById("leitura").textContent;
                }
                if (ligarPlanta) {
                    apertarTecla("h");
                }
            }

            conferir("em " + QUADROS + " quadros: um raio por coluna, u em 0 a 1, buffer opaco, medição finita, " + quadrosComReferencia + " quadros inteiros contra a referência",
                primeiraViolacao === null, primeiraViolacao);
            conferir("o robô andou (" + caminho.toFixed(0) + " casas), mediu (" + medicoes + "×), redimensionou (" + redimensionamentos + "×) e viu muitas faces (" + facesBatidas.size + ")",
                caminho > 12 && medicoes >= 1 && redimensionamentos >= 1 && facesBatidas.size >= 15);
            soltarTudo();
            if (depuracaoLigada) {
                apertarTecla("h");
            }
            janelaFalsa.largura = 1280;
            janelaFalsa.altura = 720;
            window.dispatchEvent(new Event("resize"));
        });

        // ---- segundo grupo: o relógio de verdade (o apoio trocou performance.now por um falso) ----
        // O jogo lê performance.now() a cada medição, então basta devolver o relógio real antes do M.
        // NÃO se afirma B < A: depende da máquina.
        testar("medição com o relógio de verdade: números finitos e maiores que 0", function () {
            const relogioDoApoio = performance.now;
            performance.now = Performance.prototype.now.bind(performance);
            try {
                reiniciarEVer(7.5, 9.5, Math.PI / 2);
                apertarTecla("m");
                soltarTecla("m");
                conferir("A: finito e > 0 (" + medicao.a + " ms)", Number.isFinite(medicao.a) && medicao.a > 0);
                conferir("B: finito e > 0 (" + medicao.b + " ms)", Number.isFinite(medicao.b) && medicao.b > 0);
                conferirIgual("e vê a imagem de 320×200", medicao.largura + "×" + medicao.altura, "320×200");

                apertarTecla("h");
                avancarQuadro(16);
                const linhas = document.getElementById("leitura").textContent.split("\n");
                conferir("com números reais, nenhuma linha da leitura passa de 40 letras", linhas.every(function (linha) { return linha.length <= 40; }), linhas.join(" | "));
                conferir("e sem NaN nem Infinity", !/NaN|Infinity/.test(linhas.join("\n")));
                apertarTecla("h");
                avancarQuadro(16);

                const primeira = medicao;
                apertarTecla("m");
                soltarTecla("m");
                conferir("medir de novo dá outra medição, também > 0", medicao !== primeira && medicao.a > 0 && medicao.b > 0);
            } finally {
                performance.now = relogioDoApoio;
                soltarTudo();
            }
        });

        finalizar();
    </script>
