<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Reflexo, passo 6: objetos</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        pre  { font-size: 14px; white-space: pre-wrap; }
        canvas { display: none; }
    </style>
</head>

<body>
    <h1>Teste — Reflexo, passo 6: objetos</h1>
    <pre id="resultado"></pre>

    <!-- O esqueleto do passo (o mesmo do index.html). Uma cópia viva vai para #aplicacao, escondida, para as
         afirmações; outra, com o style.css de verdade, vai para os iframes (rolagem e alvos de toque). -->
    <template id="esqueleto">
        <h1>Reflexo</h1>
        <div id="palco">
            <canvas id="visao" width="320" height="200"></canvas>
            <canvas id="jogo" width="384" height="288" hidden></canvas>
        </div>
        <p id="leitura"></p>
        <div id="controles">
            <button type="button" data-acao="girarEsquerda">⟲</button>
            <button type="button" data-acao="frente">▲</button>
            <button type="button" data-acao="girarDireita">⟳</button>
            <button type="button" data-acao="esquerda">◀&#xFE0E;</button>
            <button type="button" data-acao="tras">▼</button>
            <button type="button" data-acao="direita">▶&#xFE0E;</button>
            <button type="button" data-comando="planta" aria-pressed="false">Planta (H)</button>
        </div>
        <p id="ajuda">W S ou ↑ ↓: andar · A D: passo lateral · ← →: girar<br>H: planta (● linha vertical cruzada · ■ horizontal · círculo sombra · losango cristal)</p>
    </template>
    <div id="aplicacao" hidden></div>

    <!-- Ordem importa: o apoio troca o relógio e o sorteio ANTES do jogo carregar. -->
    <script src="../apoio.js"></script>

    <!-- A janela do teste é falsa e mutável (1280×720): o jogo lê innerWidth/innerHeight ao carregar. -->
    <script>
        const janelaFalsa = { largura: 1280, altura: 720 };
        Object.defineProperty(window, "innerWidth", { get: function () { return janelaFalsa.largura; }, configurable: true });
        Object.defineProperty(window, "innerHeight", { get: function () { return janelaFalsa.altura; }, configurable: true });
        document.getElementById("aplicacao").appendChild(document.getElementById("esqueleto").content.cloneNode(true));
    </script>

    <!-- Este passo é sobre PIXELS: a imagem (#visao) usa o canvas de verdade e o teste lê o buffer e o canvas.
         Só a planta (#jogo) ignora o desenho. -->
    <script>
        const contextoDaPlanta = new Proxy({}, {
            get: function (propriedades, nome) { return nome in propriedades ? propriedades[nome] : function () { }; },
            set: function (propriedades, nome, valor) { propriedades[nome] = valor; return true; }
        });
        const obterContextoDeVerdade = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function (tipo, opcoes) {
            return this.id === "jogo" ? contextoDaPlanta : obterContextoDeVerdade.call(this, tipo, opcoes);
        };
    </script>
    <script src="../../reflexo/06-objetos/script.js"></script>

    <script>
        const TOLERANCIA = 1e-9;
        const VOLTA_COMPLETA = 2 * Math.PI;
        const SIMBOLOS_SOLIDOS_ESPERADOS = "#%DER";
        const PLANO_ESPERADO = Math.tan(33 * Math.PI / 180);   // campo de visão de 66°

        // A especificação da névoa, do fundo e dos sprites, escrita aqui, não lida do jogo.
        const NIVEIS = 32;
        const DISTANCIA_DA_NEVOA_ESPERADA = 10;
        const NIVEIS_EXTRAS_DA_FACE_Y = 5;
        // A cor da névoa e a do horizonte vêm do PASSO (uma cópia só); o que o teste afirma é a regra: são a mesma.
        const NEVOA = COR_DA_NEVOA;
        const HORIZONTE = COR_DO_HORIZONTE;
        const TETO_ALTO = [4, 4, 9];
        const PISO_BAIXO = [38, 38, 56];
        const TAMANHO_DA_TEXTURA_ESPERADO = 16;

        // ---- ajudantes: sempre pelas portas do jogo (eventos e quadros) ----

        function apertarTecla(tecla) {
            const evento = new KeyboardEvent("keydown", { key: tecla, cancelable: true });
            document.dispatchEvent(evento);
            return evento;
        }

        function soltarTecla(tecla) {
            document.dispatchEvent(new KeyboardEvent("keyup", { key: tecla }));
        }

        function soltarTudo() {
            window.dispatchEvent(new Event("blur"));
        }

        // Põe o jogador numa pose conhecida, sem ações ativas, e roda UM quadro sem entrada
        // (é ele que lança os raios, projeta os objetos e desenha o buffer).
        function reiniciarEVer(x, y, angulo) {
            soltarTudo();
            jogador.x = x;
            jogador.y = y;
            jogador.angulo = angulo;
            atualizarDirecao();
            avancarQuadro(16);
        }

        function perto(obtido, esperado, tolerancia) {
            return Math.abs(obtido - esperado) <= (tolerancia === undefined ? TOLERANCIA : tolerancia);
        }

        function pertoRelativo(obtido, esperado, tolerancia) {
            return Math.abs(obtido - esperado) <= (tolerancia === undefined ? 1e-9 : tolerancia) * Math.max(1, Math.abs(esperado));
        }

        function constanteK(largura) {
            return largura / (2 * PLANO_ESPERADO);
        }

        function comJanela(largura, altura, funcao) {
            janelaFalsa.largura = largura;
            janelaFalsa.altura = altura;
            try {
                window.dispatchEvent(new Event("resize"));
                funcao();
            } finally {
                janelaFalsa.largura = 1280;
                janelaFalsa.altura = 720;
                window.dispatchEvent(new Event("resize"));
                soltarTudo();
            }
        }

        // Troca a lista de objetos do jogo (um array const: muda-se o conteúdo) e devolve a original ao sair.
        function comObjetos(lista, funcao) {
            const original = OBJETOS.slice();
            OBJETOS.length = 0;
            lista.forEach(function (objeto) { OBJETOS.push(objeto); });
            try {
                funcao();
            } finally {
                OBJETOS.length = 0;
                original.forEach(function (objeto) { OBJETOS.push(objeto); });
            }
        }

        function corDoHex(hex) {
            return [1, 3, 5].map(function (inicio) { return parseInt(hex.slice(inicio, inicio + 2), 16); });
        }

        function sortearPoseLivre() {
            for (let tentativa = 0; tentativa < 1000; tentativa++) {
                const x = 1 + Math.random() * (COLUNAS - 2);
                const y = 1 + Math.random() * (LINHAS - 2);
                if (!casaSolidaNoTexto(Math.floor(x), Math.floor(y))) {
                    return { x: x, y: y, angulo: Math.random() * VOLTA_COMPLETA };
                }
            }
            throw new Error("não achei pose livre");
        }

        function copiaDoBuffer() {
            return Uint32Array.from(pixels);
        }

        function primeiraColunaDiferente(umBuffer, outroBuffer) {
            for (let indice = 0; indice < umBuffer.length; indice++) {
                if (umBuffer[indice] !== outroBuffer[indice]) {
                    return indice % larguraDaVisao;
                }
            }
            return -1;
        }

        function colunasQueDiferem(umBuffer, outroBuffer) {
            const colunas = new Set();
            for (let indice = 0; indice < umBuffer.length; indice++) {
                if (umBuffer[indice] !== outroBuffer[indice]) {
                    colunas.add(indice % larguraDaVisao);
                }
            }
            return colunas;
        }

        // ---- a verdade independente 1: o texto do mapa e a interseção raio × casa (placas) ----

        function casaSolidaNoTexto(coluna, linha) {
            const simbolo = MAPA_EM_TEXTO[linha] && MAPA_EM_TEXTO[linha][coluna];
            return simbolo === undefined || SIMBOLOS_SOLIDOS_ESPERADOS.includes(simbolo);
        }

        function intervaloNoEixo(origem, direcao, minimo, maximo) {
            if (direcao === 0) {
                return origem >= minimo && origem < maximo ? { entra: -Infinity, sai: Infinity } : null;
            }
            const aoMinimo = (minimo - origem) / direcao;
            const aoMaximo = (maximo - origem) / direcao;
            return { entra: Math.min(aoMinimo, aoMaximo), sai: Math.max(aoMinimo, aoMaximo) };
        }

        function raioDeReferencia(origemX, origemY, direcaoX, direcaoY) {
            let melhor = null;
            for (let linha = 0; linha < MAPA_EM_TEXTO.length; linha++) {
                for (let coluna = 0; coluna < MAPA_EM_TEXTO[linha].length; coluna++) {
                    if (!casaSolidaNoTexto(coluna, linha)) {
                        continue;
                    }
                    const noX = intervaloNoEixo(origemX, direcaoX, coluna, coluna + 1);
                    const noY = intervaloNoEixo(origemY, direcaoY, linha, linha + 1);
                    if (noX === null || noY === null) {
                        continue;
                    }
                    const entra = Math.max(noX.entra, noY.entra);
                    const sai = Math.min(noX.sai, noY.sai);
                    if (!(sai > entra && sai > 0)) {
                        continue;
                    }
                    const distancia = Math.max(entra, 0);
                    if (melhor === null || distancia < melhor.distancia) {
                        melhor = {
                            coluna: coluna, linha: linha, distancia: distancia,
                            lado: noX.entra > noY.entra ? "x" : "y",
                            x: origemX + direcaoX * distancia, y: origemY + direcaoY * distancia
                        };
                    }
                }
            }
            return melhor;
        }

        function desvioDaColuna(coluna, largura) {
            return Math.atan(PLANO_ESPERADO * (2 * (coluna + 0.5) / largura - 1));
        }

        // A distância perpendicular da parede em CADA coluna da pose atual, pela referência (o z-buffer certo).
        function paredesDeReferencia() {
            const largura = larguraDaVisao;
            return Array.from({ length: largura }, function (_, coluna) {
                const desvio = desvioDaColuna(coluna, largura);
                const resultado = raioDeReferencia(jogador.x, jogador.y, Math.cos(jogador.angulo + desvio), Math.sin(jogador.angulo + desvio));
                return resultado.distancia * Math.cos(desvio);
            });
        }

        // ---- a verdade independente 2: u, a posição ao longo da face (como no passo 5) ----

        function acertaNaQuina(resultado) {
            return perto(resultado.x, Math.round(resultado.x), 1e-9) && perto(resultado.y, Math.round(resultado.y), 1e-9);
        }

        function extremosDaFace(resultado) {
            if (resultado.lado === "x") {
                const linhaDaGrade = Math.round(resultado.x);
                return [[linhaDaGrade, resultado.linha], [linhaDaGrade, resultado.linha + 1]];
            }
            const linhaDaGrade = Math.round(resultado.y);
            return [[resultado.coluna, linhaDaGrade], [resultado.coluna + 1, linhaDaGrade]];
        }

        function uDeReferencia(resultado) {
            const extremos = extremosDaFace(resultado);
            const aX = extremos[0][0] - jogador.x;
            const aY = extremos[0][1] - jogador.y;
            const bX = extremos[1][0] - jogador.x;
            const bY = extremos[1][1] - jogador.y;
            const esquerdo = aX * bY - aY * bX > 0 ? extremos[0] : extremos[1];
            return Math.hypot(resultado.x - esquerdo[0], resultado.y - esquerdo[1]);
        }

        // ---- a verdade independente 3: o objeto no espaço da câmera, à mão ----

        // Rotação inversa do olhar: profundidade = quanto à frente, lateral = quanto à direita.
        // Devolve null para o que está atrás do olho ou perto demais; senão, o retângulo na imagem.
        function projecaoDeReferencia(objeto) {
            const vetorX = objeto.x - jogador.x;
            const vetorY = objeto.y - jogador.y;
            const cosseno = Math.cos(jogador.angulo);
            const seno = Math.sin(jogador.angulo);
            const profundidade = vetorX * cosseno + vetorY * seno;
            const lateral = -vetorX * seno + vetorY * cosseno;
            if (profundidade < PROFUNDIDADE_MINIMA) {
                return null;
            }

            const tamanho = CATALOGO_DE_SPRITES[objeto.tipo].tamanho;
            const elevacao = CATALOGO_DE_SPRITES[objeto.tipo].elevacao;
            const umaCasa = constanteK(larguraDaVisao) / profundidade;   // altura de uma parede de 1 casa a esta profundidade
            const centro = larguraDaVisao / 2 + lateral * umaCasa;
            const lado = tamanho * umaCasa;
            const base = (alturaDaVisao + umaCasa) / 2 - elevacao * umaCasa;
            return { objeto: objeto, profundidade: profundidade, lateral: lateral, esquerda: centro - lado / 2, direita: centro + lado / 2, topo: base - lado, base: base, lado: lado };
        }

        // As colunas do retângulo em que o sprite está mais perto que a parede (a parede dada por `paredes`).
        function colunasDeReferencia(projecao, paredes) {
            const colunas = [];
            const inicio = Math.max(0, Math.ceil(projecao.esquerda - 0.5));
            const fim = Math.min(larguraDaVisao, Math.ceil(projecao.direita - 0.5));
            for (let coluna = inicio; coluna < fim; coluna++) {
                if (projecao.profundidade < paredes[coluna]) {
                    colunas.push(coluna);
                }
            }
            return colunas;
        }

        function projecoesDeReferencia(paredes) {
            return OBJETOS.map(projecaoDeReferencia)
                .filter(function (projecao) { return projecao !== null; })
                .sort(function (umaProjecao, outra) { return outra.profundidade - umaProjecao.profundidade; })
                .map(function (projecao) { projecao.colunas = colunasDeReferencia(projecao, paredes); return projecao; });
        }

        // ---- a verdade independente 4: a imagem inteira (fundo, paredes e sprites), pixel a pixel ----

        function misturarComANevoa(cor, nivel) {
            return cor.map(function (canal, indice) { return Math.round(canal + (NEVOA[indice] - canal) * (nivel / (NIVEIS - 1))); });
        }

        function nivelDeReferencia(distancia, lado) {
            return Math.min(NIVEIS - 1, Math.floor(distancia / DISTANCIA_DA_NEVOA_ESPERADA * (NIVEIS - 1)) + (lado === "y" ? NIVEIS_EXTRAS_DA_FACE_Y : 0));
        }

        function pintar(bytes, largura, linha, coluna, cor) {
            const inicio = (linha * largura + coluna) * 4;
            bytes[inicio] = cor[0];
            bytes[inicio + 1] = cor[1];
            bytes[inicio + 2] = cor[2];
            bytes[inicio + 3] = 255;
        }

        function imagemDeReferencia(paredes) {
            const largura = larguraDaVisao;
            const altura = alturaDaVisao;
            const k = constanteK(largura);
            const bytes = new Uint8ClampedArray(largura * altura * 4);
            const colunasAmbiguas = new Set();
            const pixelsAmbiguos = new Set();   // empates de ponto flutuante (ex.: altura exatamente 118): não dá para decidir

            for (let linha = 0; linha < altura; linha++) {
                const distanciaDoHorizonte = Math.abs(linha + 0.5 - altura / 2) / (altura / 2);
                const extremo = linha < altura / 2 ? TETO_ALTO : PISO_BAIXO;
                const cor = HORIZONTE.map(function (canal, indice) { return Math.round(canal + (extremo[indice] - canal) * distanciaDoHorizonte); });
                for (let coluna = 0; coluna < largura; coluna++) {
                    pintar(bytes, largura, linha, coluna, cor);
                }
            }

            for (let coluna = 0; coluna < largura; coluna++) {
                const resultado = raiosDaTela[coluna];
                const simbolo = MAPA_EM_TEXTO[resultado.linha][resultado.coluna];
                const alturaDaParede = k / resultado.perpendicular;
                const nivel = nivelDeReferencia(resultado.perpendicular, resultado.lado);
                const posicao = uDeReferencia(resultado) * TAMANHO_DA_TEXTURA_ESPERADO;
                if (Math.abs(posicao - Math.round(posicao)) < 1e-6) {
                    colunasAmbiguas.add(coluna);   // u cai quase em cima da divisa de dois texels
                }
                const colunaDaTextura = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicao));
                const topoReal = (altura - alturaDaParede) / 2;

                for (let linha = 0; linha < altura; linha++) {
                    const centro = linha + 0.5;
                    const posicaoNaTextura = (centro - topoReal) / alturaDaParede * TAMANHO_DA_TEXTURA_ESPERADO;
                    if (Math.abs(centro - topoReal) < 1e-9 || Math.abs(centro - topoReal - alturaDaParede) < 1e-9
                        || Math.abs(posicaoNaTextura - Math.round(posicaoNaTextura)) < 1e-9) {
                        pixelsAmbiguos.add(linha * largura + coluna);
                    }
                    if (centro < topoReal || centro >= topoReal + alturaDaParede) {
                        continue;
                    }
                    const linhaDaTextura = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicaoNaTextura));
                    const letra = TEXTURAS_EM_TEXTO[simbolo][linhaDaTextura][colunaDaTextura];
                    pintar(bytes, largura, linha, coluna, misturarComANevoa(corDoHex(PALETA_DAS_TEXTURAS[letra]), nivel));
                }
            }

            projecoesDeReferencia(paredes).forEach(function (projecao) {
                const arte = CATALOGO_DE_SPRITES[projecao.objeto.tipo].arte;
                const nivel = nivelDeReferencia(projecao.profundidade, "x");
                const primeiraLinha = Math.max(0, Math.ceil(projecao.topo - 0.5));
                const fimDasLinhas = Math.min(altura, Math.ceil(projecao.base - 0.5));
                const ehEmpate = function (valor) { return Math.abs(valor - Math.round(valor)) < 1e-9; };
                projecao.colunas.forEach(function (coluna) {
                    const posicaoNaColuna = (coluna + 0.5 - projecao.esquerda) / projecao.lado * TAMANHO_DA_TEXTURA_ESPERADO;
                    const colunaDaArte = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicaoNaColuna));
                    for (let linha = primeiraLinha; linha < fimDasLinhas; linha++) {
                        const posicaoNaLinha = (linha + 0.5 - projecao.topo) / projecao.lado * TAMANHO_DA_TEXTURA_ESPERADO;
                        if (ehEmpate(posicaoNaColuna) || ehEmpate(posicaoNaLinha)) {
                            pixelsAmbiguos.add(linha * largura + coluna);
                        }
                        const linhaDaArte = Math.min(TAMANHO_DA_TEXTURA_ESPERADO - 1, Math.floor(posicaoNaLinha));
                        const letra = arte[linhaDaArte][colunaDaArte];
                        if (letra !== ".") {
                            pintar(bytes, largura, linha, coluna, misturarComANevoa(corDoHex(PALETA_DAS_TEXTURAS[letra]), nivel));
                        }
                    }
                });
            });
            return { bytes: bytes, colunasAmbiguas: colunasAmbiguas, pixelsAmbiguos: pixelsAmbiguos };
        }

        // Compara o buffer do jogo com a referência. null ou o motivo.
        function motivoDeBufferErrado() {
            const largura = larguraDaVisao;
            const altura = alturaDaVisao;
            const referencia = imagemDeReferencia(paredesDeReferencia());
            const nome = "pose (" + jogador.x.toFixed(3) + ", " + jogador.y.toFixed(3) + ", " + jogador.angulo.toFixed(3) + ") " + largura + "×" + altura;

            if (imagem.width !== largura || imagem.height !== altura || pixels.length !== largura * altura) {
                return nome + ": buffer " + imagem.width + "×" + imagem.height + " (" + pixels.length + " pixels)";
            }
            for (let linha = 0; linha < altura; linha++) {
                for (let coluna = 0; coluna < largura; coluna++) {
                    if (referencia.colunasAmbiguas.has(coluna) || referencia.pixelsAmbiguos.has(linha * largura + coluna)) {
                        continue;
                    }
                    const inicio = (linha * largura + coluna) * 4;
                    for (let canal = 0; canal < 4; canal++) {
                        if (imagem.data[inicio + canal] !== referencia.bytes[inicio + canal]) {
                            return nome + ": pixel (coluna " + coluna + ", linha " + linha + ") tem [" + Array.from(imagem.data.slice(inicio, inicio + 4)) + "] em vez de ["
                                + Array.from(referencia.bytes.slice(inicio, inicio + 4)) + "]";
                        }
                    }
                }
            }
            return null;
        }

        function todosOsPixelsOpacos() {
            const bytes = imagem.data;
            for (let indice = 3; indice < bytes.length; indice += 4) {
                if (bytes[indice] !== 255) {
                    return false;
                }
            }
            return true;
        }

        // Os campos de um sprite do jogo contra a projeção de referência. null ou o motivo.
        function motivoDeSpriteErrado(sprite, projecao) {
            const campos = ["profundidade", "lateral", "esquerda", "direita", "topo", "base"];
            for (let indice = 0; indice < campos.length; indice++) {
                const campo = campos[indice];
                if (!Number.isFinite(sprite[campo])) {
                    return campo + " = " + sprite[campo];
                }
                if (!pertoRelativo(sprite[campo], projecao[campo], 1e-9)) {
                    return campo + " = " + sprite[campo] + " em vez de " + projecao[campo];
                }
            }
            return null;
        }

        // Todos os sprites do quadro (lista, ordem, campos, colunas) contra a referência. null ou o motivo.
        function motivoDeSpritesErrados(paredes) {
            const esperados = projecoesDeReferencia(paredes);
            const nome = "pose (" + jogador.x.toFixed(3) + ", " + jogador.y.toFixed(3) + ", " + jogador.angulo.toFixed(3) + ")";
            if (spritesDaTela.length !== esperados.length) {
                return nome + ": " + spritesDaTela.length + " sprites na frente do olho em vez de " + esperados.length;
            }
            for (let indice = 0; indice < esperados.length; indice++) {
                const sprite = spritesDaTela[indice];
                const esperado = esperados[indice];
                if (sprite.objeto !== esperado.objeto) {
                    return nome + ": posição " + indice + " da lista é " + sprite.tipo + " (" + sprite.objeto.x + ", " + sprite.objeto.y + ") em vez de " + esperado.objeto.tipo + " (" + esperado.objeto.x + ", " + esperado.objeto.y + ")";
                }
                const campo = motivoDeSpriteErrado(sprite, esperado);
                if (campo !== null) {
                    return nome + ": " + sprite.tipo + " em (" + sprite.objeto.x + ", " + sprite.objeto.y + "): " + campo;
                }
                if (sprite.colunas.join(",") !== esperado.colunas.join(",")) {
                    return nome + ": " + sprite.tipo + " em (" + sprite.objeto.x + ", " + sprite.objeto.y + "): colunas [" + sprite.colunas.slice(0, 8) + "…] (" + sprite.colunas.length + ") em vez de ["
                        + esperado.colunas.slice(0, 8) + "…] (" + esperado.colunas.length + ")";
                }
            }
            return null;
        }

        // ---- casos ----

        testar("estado inicial: artes prontas, z-buffer do tamanho da imagem", function () {
            conferirIgual("nenhuma ação ativa ao abrir", acoesAtivas.size, 0);
            conferirIgual("a depuração começa desligada", depuracaoLigada, false);
            conferirIgual("o J virou chão", mapa[1][1], ".");

            if (texto.split("\n").indexOf(esperado) === -1) {

            if (categorias.aparecem + categorias.foraDoCampo + categorias.tapados !== categorias.naFrente) {

        // ---- iframes: o passo inteiro com o style.css de verdade, num tamanho de tela conhecido ----

        function montarDocumentoDoIframe() {
            return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
                + '<link rel="stylesheet" href="../../reflexo/06-objetos/style.css"></head><body>'
                + document.getElementById("esqueleto").innerHTML
                + '<script>window.requestAnimationFrame = function (funcao) { window.__proximoQuadro = funcao; return 1; };<\/script>'
                + '<script src="../../reflexo/06-objetos/script.js"><\/script></body></html>';
        }

        function abrirNumIframe(largura, altura) {
            return new Promise(function (resolver) {
                const quadro = document.createElement("iframe");
                quadro.style.cssText = "display:block;border:0;width:" + largura + "px;height:" + altura + "px";
                quadro.addEventListener("load", function () { resolver(quadro); });
                quadro.srcdoc = montarDocumentoDoIframe();
                document.body.appendChild(quadro);
            });
        }

        function darQuadro(janela, instante) {
            const funcao = janela.__proximoQuadro;
            janela.__proximoQuadro = null;
            funcao(instante);
        }

        async function testarNoIframe(nome, funcao) {
            try {
                await funcao();
            } catch (erro) {
                quantidadeDeFalhas++;
                escreverLinha("FALHA " + nome + "  -> exceção: " + erro);
            }
        }

        async function conferirSemRolagem(largura, altura) {
            const quadro = await abrirNumIframe(largura, altura);
            try {
                const janela = quadro.contentWindow;
                const documento = janela.document;
                const nome = largura + "×" + altura;
                conferirIgual(nome + ": o iframe tem o tamanho pedido", janela.innerWidth + "×" + janela.innerHeight, nome);
                darQuadro(janela, 16);
                [false, true].forEach(function (comPlanta) {
                    if (comPlanta) {
                        documento.querySelector('[data-comando="planta"]').click();
                        darQuadro(janela, 32);
                    }
                    const estado = nome + (comPlanta ? " com a planta (H)" : "");
                    conferir(estado + ": não rola na vertical (altura do conteúdo " + documento.documentElement.scrollHeight + " ≤ " + janela.innerHeight + ")", documento.documentElement.scrollHeight <= janela.innerHeight);
                    conferir(estado + ": nem na horizontal (" + documento.documentElement.scrollWidth + " ≤ " + janela.innerWidth + ")", documento.documentElement.scrollWidth <= janela.innerWidth);
                });
                const pequenos = Array.from(documento.querySelectorAll("#controles button")).filter(function (botao) {
                    const caixa = botao.getBoundingClientRect();
                    return caixa.width < 48 || caixa.height < 48;
                }).map(function (botao) { return (botao.dataset.acao || botao.dataset.comando) + " " + botao.getBoundingClientRect().width.toFixed(0) + "×" + botao.getBoundingClientRect().height.toFixed(0); });
                conferir(nome + ": todo botão de toque tem pelo menos 48×48 px (GDD 7)", pequenos.length === 0, pequenos.join(", "));
            } finally {
                quadro.remove();
            }
        }

        async function principal() {
            await testarNoIframe("rolagem 390×750", function () { return conferirSemRolagem(390, 750); });
            await testarNoIframe("rolagem 360×640", function () { return conferirSemRolagem(360, 640); });
            await testarNoIframe("rolagem 1280×800", function () { return conferirSemRolagem(1280, 800); });
        }

        principal().finally(finalizar);
    </script>
