<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Proa Acesa, passo 7: a tempestade (jogo)</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        pre  { font-size: 14px; white-space: pre-wrap; }
        #palco { width: 400px; height: 200px; }
        #palco canvas { display: block; width: 100%; height: 100%; }
        [hidden] { display: none !important; }
    </style>

    <script src="../apoio.js"></script>
    <script src="apoio-proa.js"></script>

    <!-- O jogo lê o `prefers-reduced-motion` do sistema na partida. Aqui o sistema NÃO pede menos movimento (o padrão do teste não pode depender da
         máquina que o roda); 07-tempestade-menos-movimento.html cobre o caso em que pede. -->
    <script>
        (function () {
            const original = window.matchMedia.bind(window);
            window.matchMedia = function (consulta) {
                if (/prefers-reduced-motion/.test(consulta)) {
                    return { matches: false, media: consulta, addEventListener: function () { }, removeEventListener: function () { } };
                }
                return original(consulta);
            };
        }());
    </script>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
    </script>
    <script type="module">import * as THREE from "three"; window.THREE = THREE;</script>
    <script src="../../proa-acesa/07-tempestade/regras.js" defer></script>
    <script src="../../proa-acesa/07-tempestade/script.js" defer></script>
</head>

<body>
    <h1>Teste — Proa Acesa, passo 7: a tempestade (jogo)</h1>
    <pre id="resultado"></pre>

    <header>
        <button id="botao-clarao" type="button" aria-pressed="false">Reduzir clarões</button>
    </header>
    <div id="hud">
        <p id="relogio"></p>
        <p id="calor"></p>
        <meter id="medidor" min="0" max="1" low="0.6" high="0.85" optimum="0" aria-label="Calor da lanterna"></meter>
    </div>
    <p id="placar" aria-live="polite"></p>
    <main id="palco"></main>
    <p id="mensagem" aria-live="polite"></p>
    <pre id="depuracao" hidden></pre>
    <div id="controles">
        <button id="botao-esquerda" type="button" aria-label="Virar à esquerda">◀</button>
        <button id="botao-direita" type="button" aria-label="Virar à direita">▶</button>
        <div id="acoes">
            <button id="botao-devagar" type="button" aria-label="Devagar (segure)">Devagar</button>
            <button id="botao-foco" type="button">Foco: largo</button>
        </div>
    </div>
    <p id="aviso" role="alert" hidden></p>

    <script>
        window.addEventListener("load", function () {

            const MARGEM = 1e-9;
            const FILHOS_FIXOS_DA_CENA = 7;   // luz do céu, mar, ilha, barca, porto, chuva, recifes da noite
            const THREE_REAL = window.THREE;
            const renderizadorReal = renderizador.render.bind(renderizador);

            // O teste confere regras, não pixels: só os casos que medem draw calls desenham de verdade.
            renderizador.render = function () { };
            function desenharDeVerdade(ligado) {
                renderizador.render = ligado ? renderizadorReal : function () { };
            }

            // ============================================================
            // Ajudantes
            // ============================================================
            function proximo(obtido, esperado, tolerancia) {
                return Math.abs(obtido - esperado) < (tolerancia === undefined ? 1e-9 : tolerancia);
            }

            function todosFinitos(lista) {
                return lista.every(function (numero) { return Number.isFinite(numero); });
            }

            function sortear(lista) {
                return lista[Math.floor(Math.random() * lista.length)];
            }

            function luminancia(cor) {
                return 0.2126 * cor.r + 0.7152 * cor.g + 0.0722 * cor.b;
            }

            function passar(milissegundos) {
                if (!avancarQuadro(milissegundos)) {
                    throw new Error("o jogo não pediu o próximo quadro (loop parado)");
                }
            }

            function passarSegundos(segundos, milissegundos) {
                const passo = milissegundos === undefined ? 50 : milissegundos;
                for (let i = 0, quadros = Math.round(segundos * 1000 / passo); i < quadros; i++) {
                    passar(passo);
                }
            }

            function tecla(tipo, nome, opcoes) {
                window.dispatchEvent(new KeyboardEvent(tipo, Object.assign({ key: nome }, opcoes)));
            }

            function apertar(nome) {
                tecla("keydown", nome);
            }

            function soltarTecla(nome) {
                tecla("keyup", nome);
            }

            function tocar(botao, detalhe) {
                botao.dispatchEvent(new MouseEvent("click", { detail: detalhe === undefined ? 1 : detalhe, bubbles: true }));
            }

            /* Começa uma noite do jeito que o jogo faz (a regra monta, o script redesenha no próximo quadro) e deixa a barca quieta. */
            function irParaNoite(indice) {
                comecarNoite(indice);
                barcaNoMundo.segundosEncalhada = 1e9;
                passar(50);
            }

            function filhosDaCenaEsperados() {
                return FILHOS_FIXOS_DA_CENA + barcosDePesca.length + barcosAfundando.length;
            }

            function ligarReducao(ligada) {
                if ((botaoClarao.getAttribute("aria-pressed") === "true") !== ligada) {
                    tocar(botaoClarao);
                }
            }

            /* Roda um clarão da noite 2 (1º aos 15 s) em quadros de 16 ms e mede o fundo da cena quadro a quadro. */
            function medirClarao() {
                irParaNoite(1);
                noite.segundos = 14.9;
                const brilhos = [];
                passar(16);
                const base = luminancia(cena.background);
                for (let quadro = 0; quadro < 100; quadro++) {
                    passar(16);
                    brilhos.push(luminancia(cena.background));
                }
                let maiorSalto = 0;
                brilhos.forEach(function (brilho, i) { maiorSalto = Math.max(maiorSalto, Math.abs(brilho - (i === 0 ? base : brilhos[i - 1]))); });
                return { maiorSalto: maiorSalto, pico: Math.max.apply(null, brilhos) - base, base: base, quadrosClaros: brilhos.filter(function (b) { return b - base > 0.001; }).length };
            }


            // ============================================================
            // Casos
            // ============================================================
            testar("o jogo carrega e a cena tem 7 filhos fixos + os barcos (luz, mar, ilha, barca, porto, chuva, recifes)", function () {
                conferir("o three.js carregou, o renderizador existe e não há aviso", typeof THREE !== "undefined" && renderizador !== null && aviso.hidden === true);
                passar(50);
                conferirIgual("7 fixos + 2 barcos da noite 1", cena.children.length, filhosDaCenaEsperados());
                conferir("e os fixos são esses: luz do céu, mar, barca, chuva e o grupo dos recifes",
                    [luzDoCeu, mar, barca, chuva.grupo, grupoDeRecifes].every(function (filho) { return cena.children.indexOf(filho) !== -1; }));
                conferirIgual("cada recife da noite vira um grupo no desenho", grupoDeRecifes.children.length, recifes.length);
            });

            testar("a chuva vem da ficha da noite: 400 / 800 / 1.200 / 1.600 / 2.000 gotas nas noites 1 a 5 (contagem, caixa, queda, caixa que segue a barca, malhas avulsas)", function () {
                for (let indice = 0; indice < 5; indice++) {
                    verifChuvaDaNoite(passar, irParaNoite, indice);
                }
                irParaNoite(0);
            });

            testar("trocar de noite com a chuva avulsa ou nenhuma: o count e as malhas visíveis seguem a ficha da noite nova (e R recomeça com a mesma)", function () {
                irParaNoite(0);
                apertar("c");
                conferirIgual("a tecla C põe a chuva avulsa", chuva.modo, "avulsa");
                [400, 800, 1200, 1600, 2000].forEach(function (esperado, indice) {
                    irParaNoite(indice);
                    conferir("noite " + (indice + 1) + " com a chuva avulsa: " + esperado + " malhas visíveis e o count da instanciada já é " + esperado,
                        chuva.avulsas.children.filter(function (gota) { return gota.visible; }).length === esperado && chuva.instanciada.count === esperado && chuva.instanciada.visible === false);
                });
                apertar("r");
                passar(50);
                conferir("R na noite 5 recomeça com as mesmas 2.000", chuva.avulsas.children.filter(function (gota) { return gota.visible; }).length === 2000 && chuva.instanciada.count === 2000);
                irParaNoite(1);
                apertar("c");
                conferirIgual("C leva a chuva a nenhuma", chuva.modo, "nenhuma");
                irParaNoite(3);
                conferir("noite 4 em nenhuma: nada visível mas o count já é 1.600", chuva.instanciada.visible === false && chuva.avulsas.visible === false && chuva.instanciada.count === 1600);
                apertar("c");
                conferir("de volta à instanciada na noite 4: count 1.600 e visível", chuva.modo === "instanciada" && chuva.instanciada.visible === true && chuva.instanciada.count === 1600 && chuva.avulsas.visible === false);
                irParaNoite(0);
            });

            testar("instanceMatrix.needsUpdate só no modo instanciado (o buffer das instâncias não sobe para a chuva avulsa nem parada)", function () {
                irParaNoite(2);
                verifSubidaDoBufferDaChuva(passar);
                irParaNoite(0);
            });

            testar("draw calls por noite: a chuva instanciada custa 1; as mesmas gotas avulsas (tecla C) custam a contagem da ficha, e os triângulos são 12 por gota", function () {
                [400, 800, 1200, 1600, 2000].forEach(function (gotas, indice) {
                    irParaNoite(indice);
                    passarSegundos(4);   // as brasas dos recifes se acomodam: a cena fica igual de um quadro ao outro
                    function medir(modo) {
                        while (chuva.modo !== modo) {
                            apertar("c");
                        }
                        passar(50);
                        desenharDeVerdade(true);
                        passar(50);
                        desenharDeVerdade(false);
                        return { chamadas: renderizador.info.render.calls, triangulos: renderizador.info.render.triangles };
                    }
                    const instanciada = medir("instanciada");
                    const avulsa = medir("avulsa");
                    const nenhuma = medir("nenhuma");
                    const denovo = medir("instanciada");
                    const rotulo = "noite " + (indice + 1) + " (" + gotas + " gotas): ";
                    conferir(rotulo + "sem chuva há uma base de draw calls (" + nenhuma.chamadas + ")", nenhuma.chamadas > 5);
                    conferir(rotulo + "instanciada = base + 1 (" + instanciada.chamadas + " contra " + nenhuma.chamadas + ")", instanciada.chamadas - nenhuma.chamadas === 1);
                    conferir(rotulo + "avulsa = base + " + gotas + " (" + avulsa.chamadas + " contra " + nenhuma.chamadas + ")", avulsa.chamadas - nenhuma.chamadas === gotas);
                    conferir(rotulo + "a instância poupa count − 1 = " + (gotas - 1) + " chamadas: " + (avulsa.chamadas - instanciada.chamadas), avulsa.chamadas - instanciada.chamadas === gotas - 1);
                    conferir(rotulo + "desenha as MESMAS gotas: os triângulos de uma e da outra são iguais (" + instanciada.triangulos + ") e a chuva acrescenta " + 12 * gotas + " (" + gotas + " × 12)",
                        instanciada.triangulos === avulsa.triangulos && instanciada.triangulos - nenhuma.triangulos === gotas * 12);
                    conferir(rotulo + "voltando ao modo instanciado a conta volta à mesma", denovo.chamadas === instanciada.chamadas && denovo.triangulos === instanciada.triangulos);
                    conferirIgual(rotulo + "a cena continua com 7 fixos + barcos", cena.children.length, filhosDaCenaEsperados());
                });
                conferirIgual("as gotas avulsas são 2.000 malhas que não vão para a cena (moram no grupo da chuva)", chuva.avulsas.children.length, 2000);
                irParaNoite(0);
            });

            testar("\"reduzir clarões\": botão com aria-pressed e texto, por clique (que o teclado, o toque e o leitor de tela geram)", function () {
                irParaNoite(0);
                ligarReducao(false);
                conferir("é um <button type=\"button\"> focável, com o texto \"Reduzir clarões\" por nome (sem aria-label) e começa desligado (o sistema não pede menos movimento)",
                    botaoClarao.tagName === "BUTTON" && botaoClarao.type === "button" && botaoClarao.hasAttribute("aria-label") === false && botaoClarao.disabled === false &&
                    botaoClarao.tabIndex >= 0 && botaoClarao.getAttribute("aria-pressed") === "false" && reduzirClaroes === false && botaoClarao.textContent === "Reduzir clarões");
                botaoClarao.focus();
                conferir("recebe o foco do teclado", document.activeElement === botaoClarao);

                tocar(botaoClarao, 0);   // Enter, Espaço e leitor de tela chegam como click com detail 0
                conferir("click detail 0 (teclado / leitor de tela): liga — aria-pressed true, regra ligada, texto \"Reduzir clarões ✓\"",
                    botaoClarao.getAttribute("aria-pressed") === "true" && reduzirClaroes === true && botaoClarao.textContent === "Reduzir clarões ✓" && botaoClarao.hasAttribute("aria-label") === false);
                tocar(botaoClarao, 1);
                conferir("click detail 1 (mouse): desliga — aria-pressed false e o texto volta a \"Reduzir clarões\"", botaoClarao.getAttribute("aria-pressed") === "false" && reduzirClaroes === false && botaoClarao.textContent === "Reduzir clarões");

                // um toque de dedo = pointerdown + pointerup + click: muda UMA vez
                botaoClarao.dispatchEvent(new PointerEvent("pointerdown", { pointerType: "touch", pointerId: 3, bubbles: true }));
                botaoClarao.dispatchEvent(new PointerEvent("pointerup", { pointerType: "touch", pointerId: 3, bubbles: true }));
                conferirIgual("os eventos de ponteiro sozinhos não mudam nada", reduzirClaroes, false);
                tocar(botaoClarao, 1);
                conferirIgual("o click do toque liga UMA vez (não duas)", reduzirClaroes, true);
                tocar(botaoClarao, 1);

                // a barra de espaço no botão é do botão: não troca o foco da lanterna por baixo
                if (lanternaDaBarca.foco !== "largo") {
                    tocar(botaoFoco);
                }
                const focoAntes = lanternaDaBarca.foco;
                conferir("o botão Foco diz o foco no TEXTO (\"Foco: largo\"), sem aria-pressed nem aria-label", botaoFoco.textContent === "Foco: largo" && botaoFoco.hasAttribute("aria-pressed") === false && botaoFoco.hasAttribute("aria-label") === false);
                botaoClarao.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true }));
                conferirIgual("Espaço com o foco NO botão não troca o foco da lanterna", lanternaDaBarca.foco, focoAntes);
                const espacoNaJanela = new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true });
                window.dispatchEvent(espacoNaJanela);
                conferir("Espaço solto na tela troca o foco da lanterna e o botão Foco passa a dizer \"Foco: estreito\" (sem aria-pressed)",
                    lanternaDaBarca.foco !== focoAntes && espacoNaJanela.defaultPrevented === true &&
                    botaoFoco.textContent === "Foco: estreito" && botaoFoco.hasAttribute("aria-pressed") === false);
                tocar(botaoFoco);
                conferir("o botão Foco também troca (e volta a dizer \"Foco: largo\")", lanternaDaBarca.foco === focoAntes && botaoFoco.textContent === "Foco: largo");
            });

            testar("o relâmpago em quadros de 16 ms: com reduzir clarões o maior salto de luminância do fundo fica pequeno; sem, é enorme", function () {
                ligarReducao(false);
                const seco = medirClarao();
                ligarReducao(true);
                const suave = medirClarao();
                ligarReducao(false);

                const claraoTotal = luminancia(new THREE_REAL.Color(0xcfe3ff)) - seco.base;
                conferir("clarão seco: o maior salto entre dois quadros é " + seco.maiorSalto.toFixed(3) + " (> 0,3; a cor do clarão tem luminância " + (claraoTotal + seco.base).toFixed(2) + ")",
                    seco.maiorSalto > 0.3);
                conferir("clarão suave: o maior salto entre dois quadros é " + suave.maiorSalto.toFixed(4) + " (< 0,05)", suave.maiorSalto < 0.05);
                conferir("e o pico sobe no máximo 25% do clarão cheio (" + suave.pico.toFixed(3) + " ≤ " + (0.25 * claraoTotal).toFixed(3) + ")", suave.pico <= 0.25 * claraoTotal + 1e-6 && suave.pico > 0.15 * claraoTotal);
                conferir("o clarão suave aparece de verdade (" + suave.quadrosClaros + " quadros mais claros) e dura bem mais que o seco (" + seco.quadrosClaros + ")",
                    suave.quadrosClaros > seco.quadrosClaros * 3 && seco.quadrosClaros >= 10 && seco.quadrosClaros < 25);
                conferir("sem a opção o salto é pelo menos 10 vezes o do modo suave", seco.maiorSalto > 10 * suave.maiorSalto);
            });

            testar("calor no jogo: número (%) e ícone, medidor, sobrecarga apaga cone e luz sem piscar e mostra \"LANTERNA ESFRIANDO\"", function () {
                irParaNoite(0);
                ligarReducao(false);
                noite.segundos = 10;
                passar(50);
                conferir("HUD: ícone ☼, nome do foco e porcentagem (\"" + calor.textContent + "\")", /^☼ Largo \d+ %$/.test(calor.textContent));
                if (lanternaDaBarca.foco !== "estreito") {
                    tocar(botaoFoco);
                }
                lanternaDaBarca.calor = 0.5;
                passarSegundos(1);   // 20 quadros, encalhada: +0,22/s
                conferir("estreito encalhada por 1 s: calor 0,5 → 0,72 e o HUD diz \"" + calor.textContent + "\"", proximo(lanternaDaBarca.calor, 0.72, 1e-6) && calor.textContent === "☼ Estreito 72 %" && proximo(medidor.value, 0.72, 1e-6));

                lanternaDaBarca.calor = 0.99;
                passar(50);
                conferir("calor 1: a lanterna apaga — cone invisível, SpotLight em 0 e a mensagem \"LANTERNA ESFRIANDO 4 s\"",
                    lanternaDaBarca.segundosApagada > 0 && cone.visible === false && luzDoFeixe.intensity === 0 && mensagem.textContent === "LANTERNA ESFRIANDO 4 s" && calor.textContent === "☼ Estreito 100 %",
                    "mensagem " + mensagem.textContent + ", segundos " + lanternaDaBarca.segundosApagada);
                let piscou = false, mensagens = new Set();
                for (let quadro = 0; quadro < 64; quadro++) {   // 3,2 s
                    passar(50);
                    piscou = piscou || cone.visible || luzDoFeixe.intensity !== 0;
                    mensagens.add(mensagem.textContent);
                }
                conferir("durante a sobrecarga a luz NÃO pisca (cone sempre apagado) e a contagem desce: " + Array.from(mensagens).join(" | "), !piscou && mensagens.has("LANTERNA ESFRIANDO 2 s") && mensagens.has("LANTERNA ESFRIANDO 1 s"));
                conferir("o aviso mora numa região aria-live=\"polite\"", mensagem.getAttribute("aria-live") === "polite");
                passarSegundos(1.5);
                conferir("passados os 4 s: luz de volta, a mensagem some e o calor recomeçou de 0,4 (0,4 + 0,22/s encalhada × 0,7 s ≈ 0,55: \"" + calor.textContent + "\")",
                    cone.visible === true && luzDoFeixe.intensity === 120 && lanternaDaBarca.segundosApagada === 0 && mensagem.textContent === "" &&
                    proximo(lanternaDaBarca.calor, 0.4 + 0.22 * 0.7, 0.03));
                if (lanternaDaBarca.foco === "estreito") {
                    tocar(botaoFoco);
                }
            });

            testar("o amanhecer no jogo: o fundo vai da noite à manhã nos últimos 15 s, a névoa cai e a cor da névoa é a do fundo", function () {
                irParaNoite(0);
                ligarReducao(false);
                passar(50);
                const luzDaNoite = luminancia(new THREE_REAL.Color(0x07111c)), luzDaManha = luminancia(new THREE_REAL.Color(0xf3c98b));
                noite.segundos = 104;
                passar(50);
                conferir("antes da aurora o fundo é o da noite", proximo(luminancia(cena.background), luzDaNoite, 1e-6));
                const densidadeNoite = cena.fog.density;
                const serie = [];
                const densidades = [];
                let fogCombina = true;
                while (noite.segundos < 119.5) {
                    passar(50);
                    serie.push(luminancia(cena.background));
                    densidades.push(cena.fog.density);
                    fogCombina = fogCombina && proximo(cena.fog.color.r, cena.background.r, 1e-9) && proximo(cena.fog.color.b, cena.background.b, 1e-9);
                }
                conferir("o fundo só clareia ao longo dos últimos 15 s (" + serie.length + " quadros)", serie.every(function (valor, i) { return i === 0 || valor >= serie[i - 1] - 1e-12; }));
                conferir("e chega perto da manhã: " + serie[serie.length - 1].toFixed(3) + " de " + luzDaManha.toFixed(3), serie[serie.length - 1] > 0.9 * luzDaManha && serie[serie.length - 1] < luzDaManha + 1e-9);
                conferir("a densidade da névoa só cai (" + densidadeNoite.toFixed(4) + " → " + densidades[densidades.length - 1].toFixed(4) + ") e a cor da névoa é sempre a do fundo",
                    densidades.every(function (valor, i) { return i === 0 || valor <= densidades[i - 1] + 1e-12; }) && densidades[densidades.length - 1] < densidadeNoite && fogCombina);
                conferir("o mar também clareia (cor da manhã)", luminancia(mar.material.color) > luminancia(new THREE_REAL.Color(0x14344f)));
            });

            testar("a noite pelo HUD: relógio, placar, mensagem de vitória / sem meta / derrota, próxima noite e R recomeça", function () {
                irParaNoite(0);
                ligarReducao(false);
                passar(50);
                conferirIgual("relógio no começo", relogio.textContent, "Noite 1 · 2:00");
                conferirIgual("placar no começo", placar.textContent, "Salvos 0/2 · Naufrágios 0/3 · Na fila 2");
                conferirIgual("mensagem de boas-vindas (4 primeiros segundos)", mensagem.textContent, "Noite 1: Calmaria. Leve 2 barcos ao porto.");
                noite.segundos = 60.5;
                passar(50);
                conferirIgual("a 60,55 s o relógio diz 1:00", relogio.textContent, "Noite 1 · 1:00");

                noite.salvos = 2;
                noite.segundos = 119.95;
                passar(50);
                conferirIgual("meta batida ao amanhecer: vitória", noite.resultado, "vitoria");
                conferirIgual("mensagem de vitória", mensagem.textContent, "Amanheceu: 2 de 2 salvos. Próxima: noite 2.");
                passarSegundos(4.1);
                conferir("4 s depois a noite 2 aparece no relógio (2:30) e o desenho dos recifes foi refeito (12 grupos)", relogio.textContent === "Noite 2 · 2:30" && grupoDeRecifes.children.length === 12);
                conferirIgual("a cena não vaza: 7 fixos + barcos", cena.children.length, filhosDaCenaEsperados());

                barcaNoMundo.segundosEncalhada = 1e9;
                noite.salvos = 1;
                noite.segundos = 149.95;
                passar(50);
                conferirIgual("meta não batida: mensagem", mensagem.textContent, "Amanheceu sem a meta (1 de 2). A noite recomeça.");
                passarSegundos(4.1);
                conferirIgual("e a MESMA noite recomeça", relogio.textContent, "Noite 2 · 2:30");

                barcaNoMundo.segundosEncalhada = 1e9;
                naufragios = 3;
                passar(50);
                conferirIgual("3 naufrágios: mensagem de derrota", mensagem.textContent, "Três naufrágios. O jogo recomeça na noite 1.");
                passarSegundos(4.1);
                conferir("e o jogo volta à noite 1 com os contadores zerados", relogio.textContent === "Noite 1 · 2:00" && naufragios === 0 && salvos === 0);

                irParaNoite(4);
                noite.salvos = 4;
                noite.segundos = 179.95;
                passar(50);
                conferirIgual("vencer a noite 5", mensagem.textContent, "Amanheceu: 4 de 4 salvos. Você venceu as cinco noites!");
                passarSegundos(4.1);

                const geracaoAntes = noite.geracao;
                apertar("r");
                passar(50);
                conferir("R recomeça a noite atual: nova geração, relógio zerado, cena sem vazar malhas de barco",
                    noite.geracao === geracaoAntes + 1 && noite.segundos < 0.1 && cena.children.length === filhosDaCenaEsperados());
            });

            testar("deriva no jogo: a barca desliza para +x na velocidade da ficha enquanto navega", function () {
                irParaNoite(2);   // Ventania: 0,6 m/s
                barcaNoMundo.segundosEncalhada = 0;
                barcaNoMundo.x = 14;
                barcaNoMundo.z = 42;
                barcaNoMundo.proa = 0;
                passarSegundos(2);
                conferir("em 2 s a barca anda 10 m para −z e 1,2 m para +x (obtido (" + barcaNoMundo.x.toFixed(2) + ", " + barcaNoMundo.z.toFixed(2) + "))",
                    proximo(barcaNoMundo.z, 32, 1e-6) && proximo(barcaNoMundo.x, 15.2, 1e-6) && proximo(barca.position.x, barcaNoMundo.x, 1e-9));
            });

            testar("Espaço depois de um clique do mouse ou do dedo (detail ≥ 1) é da lanterna; Tab + Espaço / Enter (detail 0) continua sendo do botão", function () {
                irParaNoite(0);
                ligarReducao(false);
                if (lanternaDaBarca.foco !== "largo") {
                    tocar(botaoFoco);
                }
                verifEspacoDepoisDoClique();
                if (lanternaDaBarca.foco !== "largo") {
                    tocar(botaoFoco);
                }
                ligarReducao(false);
            });

            testar("o modo vale para o clarão inteiro (`noite.relampagoReduzido` grava a opção no começo de cada clarão): opção trocada a cada quadro durante os clarões, nunca um salto de 0 a 1 num clarão reduzido", function () {
                verifModoTravadoPorClarao();
                irParaNoite(0);
                ligarReducao(false);
            });

            testar("o comboio nasce no 1º candidato aprovado (48 giros × recuos, o anel a 10 e 20 m, a PARTIDA por último) e, sem lugar vivo, não nasce nada; a PARTIDA é livre nas cinco noites", function () {
                verifNascimentoDoComboio();
                irParaNoite(0);
            });

            testar("a câmera fica no ponto da fórmula (meio entre 14 m à frente e o 3º barco, escala até ×3 conforme a tela)", function () {
                irParaNoite(4);
                verifCameraNoPontoDaFormula();
                irParaNoite(0);
            });

            testar("o enquadramento ao longo do tempo (noite 5, retas e voltas em U): barca, 14 m à frente e os 3 primeiros barcos dentro do quadro (|NDC| ≤ 0,97) em TODOS os quadros, em 1280×800 e 390×750", function () {
                const estiloAntes = palco.style.cssText;
                [[1280, 800], [390, 750]].forEach(function (tamanho) {
                    palco.style.width = tamanho[0] + "px";
                    palco.style.height = tamanho[1] + "px";
                    ajustarTamanho();
                    irParaNoite(4);
                    const pedras = recifes.splice(0);   // sem pedras a pilotagem é só do enquadramento: a fila não naufraga
                    barcaNoMundo.segundosEncalhada = 0;
                    semearSorteio(20261028);
                    chuva.modo = "nenhuma";   // o enquadramento não depende da chuva; mover 2.000 gotas por quadro era 85% do tempo deste grupo
                    const medidas = verifPilotarMedindoOEnquadramento(passar, 3400, 50);
                    chuva.modo = "instanciada";
                    verifRestaurarRecifes(pedras);
                    conferir(tamanho[0] + "×" + tamanho[1] + ": nenhum quadro com algum dos 5 pontos fora (" + verifTextoDasMedidas(medidas) + ")",
                        medidas.algum === 0 && medidas.quadros === 3400);
                    conferir(tamanho[0] + "×" + tamanho[1] + ": o percurso exercitou a câmera de verdade (≥ 15 voltas em U, ≥ 8 retas longas, o 3º barco a ≥ 40 m da barca) e a noite 5 seguiu viva",
                        medidas.voltas >= 15 && medidas.retas >= 8 && medidas.maiorDistanciaDoTerceiro >= 40 && noite.indice === 4 && noite.resultado === "" && barcosDePesca.length >= 3,
                        "voltas " + medidas.voltas + ", retas " + medidas.retas + ", 3º barco a " + medidas.maiorDistanciaDoTerceiro.toFixed(0) + " m, noite " + noite.indice + ", resultado " + noite.resultado + ", barcos " + barcosDePesca.length);
                });
                palco.style.cssText = estiloAntes;
                ajustarTamanho();
                irParaNoite(0);
            });

            testar("robô semeado: entradas aleatórias (leme, foco, H, C, R, botões, dedos); a cena e o HUD nunca vazam nem viram NaN (2 sementes × 2500 quadros)", function () {
                const teclas = ["a", "d", "s", "q", "e", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "h", "H", "c", "r", "Shift", "constructor"];
                const duracoes = [0, 1, 16, 16, 33, 50, 50, 120, 1000];
                [3, 20261026].forEach(function (semente) {
                    semearSorteio(semente);
                    const violacoes = {};
                    function registrar(categoria, mensagemDaViolacao) {
                        if (!(categoria in violacoes)) { violacoes[categoria] = mensagemDaViolacao; }
                    }
                    irParaNoite(0);
                    barcaNoMundo.segundosEncalhada = 0;
                    for (let quadro = 0; quadro < 2500; quadro++) {
                        const quantos = Math.floor(Math.random() * 3);
                        for (let i = 0; i < quantos; i++) {
                            const tipo = Math.floor(Math.random() * 5);
                            if (tipo === 0) { apertar(sortear(teclas)); }
                            else if (tipo === 1) { soltarTecla(sortear(teclas)); }
                            else if (tipo === 2) { tocar(sortear([botaoFoco, botaoClarao]), sortear([0, 1])); }
                            else if (tipo === 3) { window.dispatchEvent(new Event("blur")); }
                            else { document.getElementById("botao-esquerda").dispatchEvent(new PointerEvent(sortear(["pointerdown", "pointerup", "pointerleave"]), { pointerId: 1, pointerType: "touch" })); }
                        }
                        passar(sortear(duracoes));
                        if (cena.children.length !== filhosDaCenaEsperados()) { registrar("a cena não vaza malhas", "filhos " + cena.children.length + " × " + filhosDaCenaEsperados()); }
                        if (!todosFinitos([barca.position.x, barca.position.z, camera.position.x, camera.position.y, camera.position.z, cena.background.r, cena.fog.density, lanternaDaBarca.calor, medidor.value])) {
                            registrar("NaN", "barca, câmera, fundo, névoa ou calor");
                        }
                        if (lanternaDaBarca.calor < 0 || lanternaDaBarca.calor > 1) { registrar("calor entre 0 e 1", "calor " + lanternaDaBarca.calor); }
                        if (chuva.instanciada.count !== noite.ficha.chuva) { registrar("o count da chuva é o da ficha da noite", "count " + chuva.instanciada.count + " × " + noite.ficha.chuva); }
                        if (barcosRemovidos.length !== 0) { registrar("removidos esvaziados no quadro", barcosRemovidos.length + " sobraram"); }
                        if (grupoDeRecifes.children.length !== recifes.length) { registrar("o desenho dos recifes é o da noite", grupoDeRecifes.children.length + " × " + recifes.length); }
                        if (/NaN|undefined/.test(relogio.textContent + placar.textContent + calor.textContent + mensagem.textContent)) { registrar("HUD sem NaN", relogio.textContent + placar.textContent + calor.textContent); }
                    }
                    const categorias = Object.keys(violacoes);
                    conferir("semente " + semente + ": nenhuma regra quebrada em nenhum quadro", categorias.length === 0,
                        categorias.map(function (categoria) { return categoria + " (" + violacoes[categoria] + ")"; }).join("; "));
                });
                ligarReducao(false);
                if (depurando) { apertar("h"); }
            });

            // LIMITAÇÃO CONHECIDA, de propósito (GDD / passo 8): neste passo o grupo de recifes velho só SAI da cena, sem dispose(); a memória da GPU
            // cresce a cada noite. Nenhuma afirmação acima ou abaixo depende disso; quem mede e conserta é 08-depuracao.html.

            finalizar();
        });
    </script>
