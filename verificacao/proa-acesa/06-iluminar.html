<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Proa Acesa, passo 6: iluminar</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        pre  { font-size: 14px; white-space: pre-wrap; }
        #palco { width: 400px; height: 200px; }
        #palco canvas { display: block; width: 100%; height: 100%; }
        #aviso[hidden] { display: none; }
    </style>

    <script src="../apoio.js"></script>
    <script src="apoio-proa.js"></script>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
    </script>
    <script type="module">import * as THREE from "three"; window.THREE = THREE;</script>
    <script src="../../proa-acesa/06-iluminar/regras.js" defer></script>
    <script src="../../proa-acesa/06-iluminar/script.js" defer></script>
</head>

<body>
    <h1>Teste — Proa Acesa, passo 6: iluminar</h1>
    <pre id="resultado"></pre>

    <p id="placar" aria-live="polite"></p>
    <main id="palco"></main>
    <div id="controles">
        <button id="botao-esquerda" type="button" aria-label="Virar à esquerda">◀</button>
        <button id="botao-direita" type="button" aria-label="Virar à direita">▶</button>
        <button id="botao-devagar" type="button" aria-label="Devagar (segure)">Devagar</button>
    </div>
    <p id="aviso" role="alert" hidden></p>

    <script>
        window.addEventListener("load", function () {

            const TOLERANCIA = 1e-6;
            const TETO_DO_QUADRO = 0.05;
            const MARGEM = 1e-9;
            const GRAU = Math.PI / 180;

            // Números do GDD §4.2/§4.3, escritos aqui de propósito (não lidos de regras.js): se alguém
            // alargar o foco (16° → 20°) ou o alcance, a tabela-verdade reprova.
            const ALCANCE = 24;
            const MEIO_ANGULO = 16 * GRAU;
            const SEGUNDOS_DE_BRASA = 3;
            const QUANTIDADE_DE_RECIFES = 13;
            const QUANTIDADE_DE_COLUNAS = 3;
            const FILHOS_FIXOS_DA_CENA = 6;      // luz do céu, mar, ilha, barca, recifes, porto
            const BARCOS_POR_COMBOIO = 4;

            const BOTOES = [document.getElementById("botao-esquerda"), document.getElementById("botao-direita"), document.getElementById("botao-devagar")];
            const TECLAS_DO_ROBO = ["a", "d", "s", "ArrowLeft", "ArrowRight", "q", "e", "ArrowUp", "ArrowDown", "A", "Q", "h", "H", " ", "Shift", "Enter", "constructor", "__proto__"];
            const DURACOES_DO_ROBO = [0, 1, 8, 16, 16, 33, 50, 50, 50, 120, 1000, -50, 5000];

            const THREE_REAL = window.THREE;

            let violacoes = {};
            let tempoEsperado = 0;
            let contandoRaios = true;
            let raiosLancados = 0;
            const estatisticas = { quadros: 0, quadrosComRaio: 0, quadrosComRecifeIluminado: 0, quadrosComRecifeTapado: 0, quadrosComBrasaApagando: 0 };

            // O teste confere regras, não pixels: desenhar milhares de quadros por software seria lento.
            renderizador.render = function () { };

            // Espião no raio: quantas vezes o jogo pergunta "tem coluna no caminho?".
            const lancarRaioOriginal = raycaster.intersectObjects;
            raycaster.intersectObjects = function () {
                if (contandoRaios) {
                    raiosLancados++;
                }
                return lancarRaioOriginal.apply(this, arguments);
            };


            // ============================================================
            // Ajudantes
            // ============================================================
            function proximo(obtido, esperado, tolerancia) {
                return Math.abs(obtido - esperado) < (tolerancia === undefined ? TOLERANCIA : tolerancia);
            }

            function normalizar(angulo) {
                return Math.atan2(Math.sin(angulo), Math.cos(angulo));
            }

            function registrar(categoria, mensagem) {
                if (!(categoria in violacoes)) {
                    violacoes[categoria] = mensagem;
                }
            }

            function todosFinitos(lista) {
                return lista.every(function (numero) { return Number.isFinite(numero); });
            }

            function sortear(lista) {
                return lista[Math.floor(Math.random() * lista.length)];
            }

            function zerarBrasas() {
                recifes.forEach(function (recife) {
                    recife.brasa = 0;
                    recife.iluminado = false;
                });
            }

            function fotografar() {
                return { brasas: recifes.map(function (recife) { return recife.brasa; }) };
            }

            function passar(milissegundos) {
                const antes = fotografar();
                const raiosAntes = raiosLancados;
                if (!avancarQuadro(milissegundos)) {
                    throw new Error("o jogo não pediu o próximo quadro (loop parado)");
                }
                const raiosDoQuadro = raiosLancados - raiosAntes;
                const duracao = Math.max(0, Math.min(milissegundos / 1000, TETO_DO_QUADRO));
                tempoEsperado += duracao;
                vigiar(antes, duracao, raiosDoQuadro);
            }

            function passarSegundos(segundos, milissegundos) {
                const passo = milissegundos === undefined ? 50 : milissegundos;
                const quadros = Math.round(segundos * 1000 / passo);
                for (let i = 0; i < quadros; i++) {
                    passar(passo);
                }
            }

            const origemDoTeste = new THREE_REAL.Vector3();

            /*
              Em TODO quadro, recalcula por fora o que o jogo decidiu: quem está no cone, quem a coluna tapa,
              quanto resta de brasa, o que a malha mostra, e quantos raios foram lançados.
            */
            function vigiar(antes, duracao, raiosDoQuadro) {
                estatisticas.quadros++;
                if (!todosFinitos([barcaNoMundo.x, barcaNoMundo.z, barcaNoMundo.proa, guinada.angulo, arfagem.angulo, camera.position.x, camera.position.y,
                    camera.position.z, barca.position.x, barca.position.z, cena.background.r, cone.material.opacity])) {
                    registrar("NaN", "algum número da barca, da câmera ou da lanterna virou NaN ou infinito");
                }

                lanterna.getWorldPosition(origemDoTeste);
                const direcao = barcaNoMundo.proa + guinada.angulo;
                let recifesNoCone = 0;

                recifes.forEach(function (recife, indice) {
                    const noCone = recifeNoCone(origemDoTeste, direcao, recife);
                    if (noCone) {
                        recifesNoCone++;
                    }
                    contandoRaios = false;
                    const tapado = noCone && estaTapado(origemDoTeste, recife);
                    contandoRaios = true;

                    if (recife.iluminado !== (noCone && !tapado)) {
                        registrar("iluminado = no cone E não tapado", "recife " + indice + ": iluminado " + recife.iluminado + ", noCone " + noCone + ", tapado " + tapado);
                    }
                    if (!todosFinitos([recife.brasa]) || recife.brasa < 0 || recife.brasa > SEGUNDOS_DE_BRASA) {
                        registrar("brasa entre 0 e 3", "recife " + indice + ": brasa " + recife.brasa);
                    }
                    if (recife.iluminado && recife.brasa !== SEGUNDOS_DE_BRASA) {
                        registrar("recife visto: brasa cheia", "recife " + indice + ": brasa " + recife.brasa);
                    }
                    if (!recife.iluminado && !proximo(recife.brasa, Math.max(0, antes.brasas[indice] - duracao), MARGEM)) {
                        registrar("sem ver, a brasa só esfria (brasa − dt, mínimo 0)", "recife " + indice + ": antes " + antes.brasas[indice] + ", agora " + recife.brasa + ", dt " + duracao);
                    }

                    const pedra = recife.malha.children[0];
                    const espuma = recife.malha.children[1];
                    if (recife.malha.visible !== (recife.brasa > 0 || depurando)) {
                        registrar("recife aparece com brasa > 0 (ou na depuração H)", "recife " + indice + ": visible " + recife.malha.visible + ", brasa " + recife.brasa);
                    }
                    if (espuma.visible !== recife.iluminado || pedra.material.wireframe !== !recife.iluminado) {
                        registrar("visto = pedra cheia com espuma; lembrado = só o contorno", "recife " + indice);
                    }
                    const opacidadeEsperada = recife.iluminado ? 1 : recife.brasa / SEGUNDOS_DE_BRASA;
                    if (!proximo(pedra.material.opacity, opacidadeEsperada, MARGEM)) {
                        registrar("opacidade = brasa ÷ 3 (1 se visto)", "recife " + indice + ": opacidade " + pedra.material.opacity + ", esperado " + opacidadeEsperada);
                    }

                    if (recife.iluminado) {
                        estatisticas.quadrosComRecifeIluminado++;
                    }
                    if (noCone && tapado) {
                        estatisticas.quadrosComRecifeTapado++;
                    }
                    if (!recife.iluminado && recife.brasa > 0) {
                        estatisticas.quadrosComBrasaApagando++;
                    }
                });

                if (raiosDoQuadro !== recifesNoCone) {
                    registrar("o raio só é lançado para quem passou no cone", raiosDoQuadro + " raio(s) para " + recifesNoCone + " recife(s) no cone");
                }
                if (raiosDoQuadro > 0) {
                    estatisticas.quadrosComRaio++;
                }
                if (cena.children.length !== FILHOS_FIXOS_DA_CENA + barcosDePesca.length + barcosAfundando.length) {
                    registrar("a cena não vaza malhas", "filhos " + cena.children.length);
                }
            }

            function conferirSemViolacoes(contexto) {
                const categorias = Object.keys(violacoes);
                conferir(contexto + ": nenhuma regra quebrada em nenhum quadro", categorias.length === 0,
                    categorias.map(function (categoria) { return categoria + " (" + violacoes[categoria] + ")"; }).join("; "));
                violacoes = {};
            }

            function tecla(tipo, nome, opcoes) {
                window.dispatchEvent(new KeyboardEvent(tipo, Object.assign({ key: nome }, opcoes)));
            }

            function apertar(nome, opcoes) {
                tecla("keydown", nome, opcoes);
            }

            function soltar(nome) {
                tecla("keyup", nome);
            }

            function eventoDeBotao(botao, tipo, identificador) {
                botao.dispatchEvent(new PointerEvent(tipo, { pointerType: "touch", pointerId: identificador === undefined ? 1 : identificador, bubbles: false }));
            }

            function eventoNoPalco(tipo, fracaoX, fracaoY, tipoDePonteiro) {
                const retangulo = palco.getBoundingClientRect();
                palco.dispatchEvent(new PointerEvent(tipo, {
                    clientX: retangulo.left + fracaoX * retangulo.width,
                    clientY: retangulo.top + fracaoY * retangulo.height,
                    pointerType: tipoDePonteiro || "mouse"
                }));
            }

            function soltarTudo() {
                window.dispatchEvent(new Event("blur"));
                TECLAS_DO_ROBO.forEach(soltar);
                BOTOES.forEach(function (botao) {
                    eventoDeBotao(botao, "pointerleave", 1);
                    botao.dispatchEvent(new Event("blur"));
                });
                eventoNoPalco("pointerleave", 0.5, 0.5, "touch");
            }

            function acalmar() {
                soltarTudo();
                passarSegundos(5);
            }

            /* A barca fica parada (encalhada "para sempre"), de proa para onde se quer: o experimento é só da luz. */
            function posicionarBarcaQuieta(x, z, proa) {
                barcaNoMundo.x = x;
                barcaNoMundo.z = z;
                barcaNoMundo.proa = proa;
                barcaNoMundo.giro = 0;
                barcaNoMundo.segundosEncalhada = 1e9;
            }

            function soltarABarca() {
                barcaNoMundo.segundosEncalhada = 0;
            }

            function noCone(origem, direcao, recife) {
                return recifeNoCone(origem, direcao, recife);
            }

            /* Um recife `raio` de raio, a `distanciaDoCentro` da origem, `grausDoEixo` à esquerda (+) do eixo do feixe. */
            function recifeA(origem, direcao, distanciaDoCentro, grausDoEixo, raio) {
                const rumo = direcao + grausDoEixo * GRAU;
                return { x: origem.x - distanciaDoCentro * Math.sin(rumo), z: origem.z - distanciaDoCentro * Math.cos(rumo), raio: raio };
            }

            function umaColuna(x) {
                return recifes.find(function (recife) { return recife.alta === true && recife.x === x; });
            }

            /* Um recife de mentira para perguntar ao Raycaster; o `malha` próprio nunca é pai de uma coluna. */
            function recifeFalso(x, z, raio) {
                return { x: x, z: z, raio: raio, malha: new THREE_REAL.Group() };
            }

            function ponto(x, y, z) {
                return new THREE_REAL.Vector3(x, y, z);
            }


            // ============================================================
            // Casos
            // ============================================================
            testar("o mundo da luz: 13 recifes (3 colunas altas), colunas são as pedras dos altos, o cone desenhado é o cone da regra", function () {
                conferir("o three.js carregou e não há aviso", typeof THREE !== "undefined" && renderizador !== null && aviso.hidden === true);
                conferirIgual("13 recifes", recifes.length, QUANTIDADE_DE_RECIFES);
                conferirIgual("3 deles são colunas altas", recifes.filter(function (recife) { return recife.alta === true; }).length, QUANTIDADE_DE_COLUNAS);
                conferirIgual("a lista `colunas` tem 3 pedras", colunas.length, QUANTIDADE_DE_COLUNAS);
                conferir("cada coluna é a pedra (primeira filha) do grupo de um recife ALTO",
                    colunas.every(function (coluna) {
                        const dono = recifes.find(function (recife) { return recife.malha === coluna.parent; });
                        return dono !== undefined && dono.alta === true && dono.malha.children[0] === coluna;
                    }));
                conferir("e nenhum recife baixo entra em `colunas`: só as pedras altas tapam a luz",
                    recifes.filter(function (recife) { return recife.alta !== true; }).every(function (recife) { return colunas.indexOf(recife.malha.children[0]) === -1; }));
                conferir("no começo ninguém foi visto: brasa 0 e iluminado falso",
                    recifes.every(function (recife) { return recife.brasa === 0 && recife.iluminado === false; }));

                conferir("o cone desenhado tem a altura do alcance (24 m)", proximo(cone.geometry.parameters.height, ALCANCE, 1e-9));
                conferir("e o raio da boca é 24 · tan 16° (o desenho = a regra)", proximo(cone.geometry.parameters.radius, ALCANCE * Math.tan(MEIO_ANGULO), 1e-9),
                    "raio " + cone.geometry.parameters.radius);
                const luz = feixe.children.find(function (filho) { return filho.isSpotLight === true; });
                conferir("o SpotLight tem meio-ângulo de 16° e alcance de 36 m", luz !== undefined && proximo(luz.angle, MEIO_ANGULO, 1e-9) && proximo(luz.distance, ALCANCE * 1.5, 1e-9));
                conferir("o recife nasce com malha em grupo {pedra, espuma} — a espuma é o anel", recifes.every(function (recife) {
                    return recife.malha.children.length === 2 && recife.malha.children[1].geometry.type === "RingGeometry";
                }));
            });

            testar("recifeNoCone — tabela-verdade (6 direções do feixe × 28 casos)", function () {
                const origem = { x: 3, z: -2 };
                const direcoes = [0, 0.7, -2.5, Math.PI / 2, Math.PI, 7];
                // [nome, distância ao centro, graus à esquerda do eixo, raio, esperado]
                const tabela = [
                    ["de frente", 10, 0, 0.5, true],
                    ["10° à esquerda", 10, 10, 0.5, true],
                    ["10° à direita", 10, -10, 0.5, true],
                    ["15,9° à esquerda (logo dentro do meio-ângulo de 16°)", 10, 15.9, 0.01, true],
                    ["15,9° à direita", 10, -15.9, 0.01, true],
                    ["16,2° à esquerda (logo fora)", 10, 16.2, 0.01, false],
                    ["16,2° à direita (logo fora)", 10, -16.2, 0.01, false],
                    ["20° (o que um foco de 20° veria)", 10, 20, 0.01, false],
                    ["de lado, 90° à esquerda", 10, 90, 0.5, false],
                    ["de lado, 90° à direita", 10, -90, 0.5, false],
                    ["atrás, 180°", 10, 180, 0.5, false],
                    ["quase atrás, 170°", 10, 170, 0.5, false],
                    ["alcance: centro a 24,49 m e raio 0,5 (a borda está a 23,99)", 24.49, 0, 0.5, true],
                    ["alcance: centro a 24,51 m e raio 0,5 (a borda está a 24,01)", 24.51, 0, 0.5, false],
                    ["alcance: raio 3, centro a 26,9 m (borda a 23,9)", 26.9, 0, 3, true],
                    ["alcance: raio 3, centro a 27,1 m (borda a 24,1)", 27.1, 0, 3, false],
                    ["longe demais mesmo de frente: 60 m", 60, 0, 0.5, false],
                    ["raio 3 a 10 m alarga o cone (margem de 17,5°): 30° entra", 10, 30, 3, true],
                    ["raio 3 a 10 m: 36° ainda fica fora", 10, 36, 3, false],
                    ["raio 0,5 a 10 m: 30° fica fora", 10, 30, 0.5, false],
                    ["raio 3 a 10 m, do outro lado: −30° entra", 10, -30, 3, true],
                    ["lanterna em cima do recife (distância 0)", 0, 0, 2, true],
                    ["lanterna dentro do recife, ele 'atrás' (1,5 m, raio 2)", 1.5, 180, 2, true],
                    ["lanterna dentro do recife, ele 'de lado' (1 m, raio 2)", 1, 90, 2, true],
                    ["recife grande colado ATRÁS (2,5 m, raio 2) não é visto", 2.5, 180, 2, false],
                    ["recife grande colado, de frente (2,5 m, raio 2)", 2.5, 0, 2, true],
                    ["perto e à esquerda, 45°, raio 0,3 (3 m)", 3, 45, 0.3, false],
                    ["perto e à frente, 5°, raio 0,3 (3 m)", 3, 5, 0.3, true]
                ];
                direcoes.forEach(function (direcao) {
                    const erros = [];
                    tabela.forEach(function (caso) {
                        const recife = recifeA(origem, direcao, caso[1], caso[2], caso[3]);
                        if (noCone(origem, direcao, recife) !== caso[4]) {
                            erros.push(caso[0] + " (esperado " + caso[4] + ")");
                        }
                    });
                    conferir("feixe apontando para " + direcao.toFixed(2) + " rad: os " + tabela.length + " casos batem", erros.length === 0, erros.join("; "));
                });

                const rotacionado = recifeA(origem, Math.PI / 2, 10, 0, 0.5);
                conferir("feixe virado para −x (proa π/2): o recife em (−7, −2) está no cone", rotacionado.x < origem.x - 9.99 && noCone(origem, Math.PI / 2, rotacionado));
                conferir("e o mesmo recife NÃO está no cone de quem olha para −z", noCone(origem, 0, rotacionado) === false);
                conferir("a direção é um ângulo qualquer: 0 e 2π dão a mesma resposta", [3, 8, 14].every(function (distanciaDoCentro) {
                    const recife = recifeA(origem, 0, distanciaDoCentro, 12, 1);
                    return noCone(origem, 0, recife) === noCone(origem, 2 * Math.PI, recife) && noCone(origem, 0, recife) === noCone(origem, -2 * Math.PI, recife);
                }));
            });

            testar("recifeNoCone × oráculo por AMOSTRAGEM do disco (20.000 sorteios semeados, geometria exata: disco ∩ leque)", function () {
                // A regra é geométrica: o disco encosta no leque (setor de 16° e 24 m). O oráculo é independente: o disco encosta no leque se
                // (a) a lanterna está dentro dele, ou (b) algum ponto da CIRCUNFERÊNCIA dele está dentro do leque (se o leque não está todo dentro do
                // disco, ele cruza a circunferência). Cada ponto é testado por ângulo (atan2) e distância, sem produto escalar.
                // A circunferência tem 720 amostras: o erro de amostragem é a flecha r·(1 − cos(π/720)) ≤ 6e-5 m. Faixa de tolerância: 1 mm.
                // O oráculo roda com o raio + 1 mm e com o raio − 1 mm; se os dois concordam o veredito é firme e a regra TEM de concordar;
                // se discordam, o caso está dentro da faixa de 1 mm e não é cobrado.
                const AMOSTRAS = 720;
                const TOLERANCIA_EM_METROS = 0.001;
                const cossenos = [], senos = [];
                for (let k = 0; k < AMOSTRAS; k++) {
                    cossenos.push(Math.cos(2 * Math.PI * k / AMOSTRAS));
                    senos.push(Math.sin(2 * Math.PI * k / AMOSTRAS));
                }

                function oraculo(origem, direcao, centro, raio) {
                    if (Math.hypot(centro.x - origem.x, centro.z - origem.z) <= raio) {
                        return true;
                    }
                    for (let k = 0; k < AMOSTRAS; k++) {
                        const dx = centro.x + raio * cossenos[k] - origem.x;
                        const dz = centro.z + raio * senos[k] - origem.z;
                        if (Math.hypot(dx, dz) <= ALCANCE && Math.abs(normalizar(Math.atan2(-dx, -dz) - direcao)) <= MEIO_ANGULO) {
                            return true;
                        }
                    }
                    return false;
                }

                semearSorteio(20261026);
                let divergencias = 0, firmes = 0, naFaixa = 0, dentro = 0, perto = 0;
                let primeiraDivergencia = "";

                for (let n = 0; n < 20000; n++) {
                    const origem = { x: Math.random() * 60 - 30, z: Math.random() * 60 - 30 };
                    const direcao = (Math.random() * 2 - 1) * 4 * Math.PI;
                    const raio = 0.3 + Math.random() * 2.7;
                    const sorteioPerto = n % 2 === 0;   // metade dos casos nasce em volta do leque, onde as bordas decidem
                    const rumo = sorteioPerto ? direcao + (Math.random() * 2 - 1) * 45 * GRAU : Math.random() * 2 * Math.PI;
                    const distanciaAoCentro = sorteioPerto ? Math.random() * (ALCANCE + 6) : Math.random() * 56;
                    const recife = { x: origem.x - distanciaAoCentro * Math.sin(rumo), z: origem.z - distanciaAoCentro * Math.cos(rumo), raio: raio };

                    const generoso = oraculo(origem, direcao, recife, raio + TOLERANCIA_EM_METROS);
                    const apertado = oraculo(origem, direcao, recife, raio - TOLERANCIA_EM_METROS);
                    if (generoso !== apertado) {
                        naFaixa++;
                        continue;
                    }
                    firmes++;
                    dentro += generoso ? 1 : 0;
                    perto += sorteioPerto ? 1 : 0;
                    if (noCone(origem, direcao, recife) !== generoso) {
                        divergencias++;
                        if (primeiraDivergencia === "") {
                            primeiraDivergencia = "origem " + JSON.stringify(origem) + ", direção " + direcao + ", recife " + JSON.stringify(recife) + ", esperado " + generoso;
                        }
                    }
                }
                conferir("20.000 sorteios: a regra e o oráculo discordam em " + divergencias + " (de " + firmes + " firmes; " + naFaixa + " na faixa de 1 mm, não cobrados)",
                    divergencias === 0, primeiraDivergencia);
                conferir("a faixa de tolerância é estreita: menos de 1% dos sorteios (" + naFaixa + ")", naFaixa < 200);

                let poses = 0, invalidas = 0, primeira = "";
                for (let x = -79; x <= 79; x += 2) {
                    for (let z = -79; z <= 79; z += 2) {
                        if (obstaculos.some(function (o) { return Math.hypot(x - o.x, z - o.z) < o.raio + 1.2; })) {
                            continue;
                        }
                        for (let rumo = 0; rumo < 8; rumo++) {

                            barcaNoMundo.z = z;
                            barcaNoMundo.proa = rumo * Math.PI / 4;
                            criarComboio();
                            poses++;
                            const novos = barcosDePesca.splice(0);
                            barcosDePesca.push.apply(barcosDePesca, guardados);
                            novos.forEach(function (barco) {
                                const ruim = Math.abs(barco.x) > 79 + MARGEM || Math.abs(barco.z) > 79 + MARGEM || Math.hypot(barco.x - porto.x, barco.z - porto.z) < porto.raio + 1 - MARGEM ||

                                }
                            });
                        }
                    }
                }
                conferir("nenhum dos " + poses + " comboios nasceu inválido (" + invalidas + ")", poses > 40000 && invalidas === 0, primeira);
                conferir("a ilha bate: dentro de 5,5 + 1,2 m é tocada, fora não, e vale para a barca e para o barco",
                    recifeTocadoPor({ x: ilha.x + 6.69, z: ilha.z }) === ilha && recifeTocadoPor({ x: ilha.x + 6.71, z: ilha.z }) === null);
                posicionarBarcaQuieta(8, 14, 0);
                soltarABarca();
            });

            testar("a ilha vem dos dados: mover `ilha` em regras.js move a ilha desenhada e o colisor juntos (sem sujar os oclusores da luz)", function () {
                verifIlhaVemDosDados();
                conferir("e a ilha de verdade continua onde a regra a pôs (−5, −12)", ilha.x === -5 && ilha.z === -12 && cena.children.some(function (filho) { return filho.position.x === -5 && filho.position.z === -12 && filho.children.length === 4; }));
            });

            testar("o comboio nasce em lugar válido, girando e recuando (12 giros de 30° × recuos de 0, 7, 14 e 21 m) e, cercado, na PARTIDA; a PARTIDA é livre", function () {
                verifNascimentoDoComboio();
                posicionarBarcaQuieta(8, 14, 0);
                verifNascerEm({ x: 8, z: 14, proa: 0 });
                passar(50);
                soltarABarca();
            });

            testar("a câmera fica no ponto da fórmula (meio entre 14 m à frente e o 3º barco, escala até ×3 conforme a tela)", function () {
                posicionarBarcaQuieta(8, 14, 0);
                passar(50);
                verifCameraNoPontoDaFormula();
                soltarABarca();
            });

            testar("o enquadramento ao longo do tempo (retas e voltas em U, 7200 quadros de 50 ms): barca, 14 m à frente e os 3 primeiros barcos ficam no quadro (|NDC| ≤ 0,97) em ≥ 99% dos quadros, em 1280×800 e 390×750", function () {
                const estiloAntes = palco.style.cssText;
                [[1280, 800], [390, 750]].forEach(function (tamanho) {
                    palco.style.width = tamanho[0] + "px";
                    palco.style.height = tamanho[1] + "px";
                    ajustarTamanho();
                    acalmar();
                    soltarABarca();
                    barcaNoMundo.x = 8;
                    barcaNoMundo.z = 14;
                    barcaNoMundo.proa = 0;
                    verifNascerEm({ x: 8, z: 14, proa: 0 });
                    passar(50);
                    seguirComACamera(1);
                    const pedras = recifes.splice(0);   // sem pedras a pilotagem é só do enquadramento: a fila não naufraga
                    semearSorteio(20261028);
                    const medidas = verifPilotarMedindoOEnquadramento(passar, 7200, 50);
                    verifRestaurarRecifes(pedras);
                    const limite = Math.floor(0.01 * medidas.quadros);
                    conferir(tamanho[0] + "×" + tamanho[1] + ": cada ponto fora do quadro em no máximo 1% dos quadros (" + verifTextoDasMedidas(medidas) + ")",
                        medidas.quadros === 7200 && ["barca", "frente", "primeiro", "segundo", "terceiro", "algum"].every(function (ponto) { return medidas[ponto] <= limite; }),
                        "limite " + limite + " quadros");
                    conferir(tamanho[0] + "×" + tamanho[1] + ": o percurso exercitou a câmera de verdade (≥ 30 voltas em U, ≥ 10 retas longas e o 3º barco a ≥ 40 m da barca)",
                        medidas.voltas >= 30 && medidas.retas >= 10 && medidas.maiorDistanciaDoTerceiro >= 40,
                        "voltas " + medidas.voltas + ", retas " + medidas.retas + ", 3º barco a " + medidas.maiorDistanciaDoTerceiro.toFixed(0) + " m");
                });
                palco.style.cssText = estiloAntes;
                ajustarTamanho();
                acalmar();
            });

            testar("robô semeado: piloto e entradas aleatórias; brasa, cone e raios conferidos por fora em 3 sementes × 4000 quadros", function () {
                const sementes = [11, 20261026, 987654321];
                const quadrosPorSemente = 4000;
                let eventosEnviados = 0;

                function umEventoAleatorio() {
                    const tipo = Math.floor(Math.random() * 7);
                    eventosEnviados++;
                    if (tipo === 0) {
                        apertar(sortear(TECLAS_DO_ROBO), { repeat: Math.random() < 0.15, ctrlKey: Math.random() < 0.05 });
                    } else if (tipo === 1) {
                        soltar(sortear(TECLAS_DO_ROBO));
                    } else if (tipo === 2) {
                        eventoDeBotao(sortear(BOTOES), sortear(["pointerdown", "pointerdown", "pointerup", "pointerleave", "pointercancel"]), sortear([1, 2]));
                    } else if (tipo === 3) {
                        eventoNoPalco(sortear(["pointermove", "pointermove", "pointerdown", "pointerup", "pointerleave", "pointercancel"]),
                            Math.random() * 4 - 1.5, Math.random() * 4 - 1.5, sortear(["mouse", "touch"]));
                    } else if (tipo === 4) {
                        window.dispatchEvent(new Event(sortear(["blur", "keydown", "keyup"])));
                    } else if (tipo === 5) {
                        BOTOES[Math.floor(Math.random() * 3)].dispatchEvent(new KeyboardEvent(sortear(["keydown", "keyup"]),
                            { key: sortear(["Enter", " ", "Tab"]), bubbles: true, cancelable: true }));
                    } else {
                        eventosEnviados--;
                    }
                }

                sementes.forEach(function (semente) {
                    acalmar();
                    violacoes = {};
                    semearSorteio(semente);
                    zerarBrasas();
                    barcaNoMundo.x = 8;
                    barcaNoMundo.z = 14;
                    barcaNoMundo.proa = 0;
                    barcaNoMundo.giro = 0;
                    barcaNoMundo.segundosEncalhada = 0;
                    let destino = porto;
                    let teclaDoPiloto = null;

                    for (let quadro = 0; quadro < quadrosPorSemente; quadro++) {
                        if (quadro % 250 === 0) {
                            destino = sortear(recifes.concat([porto, { x: Math.random() * 100 - 50, z: Math.random() * 100 - 50 }]));
                        }
                        const erroDeRumo = normalizar(Math.atan2(-(destino.x - barcaNoMundo.x), -(destino.z - barcaNoMundo.z)) - barcaNoMundo.proa);
                        const desejada = Math.abs(erroDeRumo) < 0.05 ? null : erroDeRumo > 0 ? "ArrowLeft" : "ArrowRight";
                        if (teclaDoPiloto !== null && teclaDoPiloto !== desejada) {
                            soltar(teclaDoPiloto);
                        }
                        teclaDoPiloto = desejada;
                        if (teclaDoPiloto !== null) {
                            apertar(teclaDoPiloto);
                        }

                        const quantos = Math.floor(Math.random() * 4);
                        for (let i = 0; i < quantos; i++) {
                            umEventoAleatorio();
                        }
                        passar(sortear(DURACOES_DO_ROBO));
                    }
                    conferirSemViolacoes("robô, semente " + semente + " (" + quadrosPorSemente + " quadros)");
                });

                conferir("o robô realmente mexeu: mais de 10.000 eventos enviados", eventosEnviados > 10000, eventosEnviados + " eventos");
                conferir("e a luz foi exercitada de verdade: houve quadros com raio (" + estatisticas.quadrosComRaio + "), com recife iluminado (" +
                    estatisticas.quadrosComRecifeIluminado + "), com recife tapado por coluna (" + estatisticas.quadrosComRecifeTapado + ") e com brasa apagando (" +
                    estatisticas.quadrosComBrasaApagando + ")",
                    estatisticas.quadrosComRaio > 100 && estatisticas.quadrosComRecifeIluminado > 100 && estatisticas.quadrosComRecifeTapado > 5 && estatisticas.quadrosComBrasaApagando > 100);
                acalmar();
                conferir("no fim a cena tem exatamente 6 filhos fixos + os barcos das listas", cena.children.length === FILHOS_FIXOS_DA_CENA + barcosDePesca.length + barcosAfundando.length);
                conferir("e as listas vivas têm no máximo 4 barcos", barcosDePesca.length + barcosAfundando.length <= BARCOS_POR_COMBOIO);
                conferirSemViolacoes("depois do robô");
            });

            finalizar();
        });
    </script>
