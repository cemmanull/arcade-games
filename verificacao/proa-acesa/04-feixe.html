<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Proa Acesa, passo 4: o feixe</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        pre  { font-size: 14px; white-space: pre-wrap; }
        #palco { width: 400px; height: 200px; }
        #palco canvas { display: block; width: 100%; height: 100%; }
        #painel[hidden], #aviso[hidden] { display: none; }
    </style>

    <script src="../apoio.js"></script>

    <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
    </script>
    <script type="module">import * as THREE from "three"; window.THREE = THREE;</script>
    <script src="../../proa-acesa/04-feixe/script.js" defer></script>
</head>

<body>
    <h1>Teste — Proa Acesa, passo 4: o feixe</h1>
    <pre id="resultado"></pre>

    <main id="palco"></main>
    <p id="painel" hidden></p>
    <div id="controles">
        <button id="botao-esquerda" type="button" aria-label="Virar à esquerda">◀</button>
        <button id="botao-direita" type="button" aria-label="Virar à direita">▶</button>
    </div>
    <p id="aviso" role="alert" hidden></p>

    <script>
        window.addEventListener("load", function () {

            const TOLERANCIA = 1e-5;
            const TETO_DO_QUADRO = 0.05;
            const GRAU = Math.PI / 180;

            // Os limites do GDD §3/§4.2 e do passo, escritos aqui de propósito (não lidos do script):
            // se alguém afrouxar uma constante do jogo, o teste reprova.
            const LIMITE_DA_GUINADA = 75 * GRAU;
            const ARFAGEM_MINIMA = -20 * GRAU;
            const ARFAGEM_MAXIMA = 60 * GRAU;
            const REPOUSO_DA_ARFAGEM = -0.12;
            const GIRO_MAXIMO_DA_BARCA = 1.4;
            const ACELERACAO_DO_GIRO = 4;
            const VELOCIDADE_MAXIMA_DA_MIRA = 2.5;
            const GIRO_LOCAL_MAXIMO_DA_GUINADA = VELOCIDADE_MAXIMA_DA_MIRA + GIRO_MAXIMO_DA_BARCA;   // a barca gira por baixo da lanterna
            const ACELERACAO_DA_MIRA = 8;
            const TAXA_DO_ALVO = 2;                 // rad/s: Q/E giram o alvo; soltos, ele desce na mesma taxa
            const DURACAO_DO_PONTEIRO = 2;          // s: mexer ou arrastar assume a mira por 2 s (GDD §3)
            const VELOCIDADE_DA_BARCA = 5;
            const SUAVIDADE_DA_CAMERA = 5;          // 1/s
            const FOLGA_DA_CAMERA_EM_METROS = 5;    // atraso máximo aceitável da câmera (a reta estabiliza em 1 m)
            const PASSO_DA_GRADE = 90 / 64;         // um quadradinho do mar, em metros
            const DURACAO_DO_ENTARDECER = 40;
            const ILHA = { x: -5, z: -12, raio: 5.5 };   // o chão do farol; a barca tem 3,2 m de comprimento
            const MEIO_COMPRIMENTO_DA_BARCA = 1.6;
            const MARGEM = 1e-9;

            const CEU_DE_TARDE = 0xf3c98b;
            const CEU_DE_NOITE = 0x07111c;
            const MAR_DE_TARDE = 0x3d7ea6;
            const MAR_DE_NOITE = 0x14344f;

            const BOTAO_ESQUERDA = document.getElementById("botao-esquerda");
            const BOTAO_DIREITA = document.getElementById("botao-direita");

            const TECLAS_DO_JOGO = ["a", "d", "ArrowLeft", "ArrowRight", "q", "e", "ArrowUp", "ArrowDown"];
            const TECLAS_DO_ROBO = TECLAS_DO_JOGO.concat(["A", "D", "Q", "E", "h", "H", " ", "Shift", "Escape", "Enter", "constructor", "__proto__"]);
            const DURACOES_DO_ROBO = [0, 1, 8, 16, 16, 16, 33, 50, 50, 120, 1000, -50, 5000];

            let tempoEsperado = 0;
            let violacoes = {};
            let maiorAtrasoDaCamera = 0;
            let menorDistanciaDaIlha = Infinity;
            let medindoAIlha = false;

            // O teste confere regras, não pixels: desenhar milhares de quadros por software seria lento.
            renderizador.render = function () { };


            // ============================================================
            // Espiões: o jogo não pode criar Color/Vector3 a cada quadro, e o céu só se repinta enquanto muda
            // ============================================================
            // `window.THREE` é um módulo (somente leitura): trocamos a referência GLOBAL por uma cópia com dois
            // construtores contadores. O jogo procura `THREE` pelo nome a cada uso; o teste usa THREE_REAL.
            const THREE_REAL = window.THREE;
            const construcoes = { Color: 0, Vector3: 0 };

            function espiarConstrutor(construtor, nome) {
                return new Proxy(construtor, {
                    construct: function (alvo, argumentos, novoAlvo) {
                        construcoes[nome]++;
                        return Reflect.construct(alvo, argumentos, novoAlvo);
                    }
                });
            }

            window.THREE = Object.assign({}, THREE_REAL, {
                Color: espiarConstrutor(THREE_REAL.Color, "Color"),
                Vector3: espiarConstrutor(THREE_REAL.Vector3, "Vector3")
            });

            let pinturasDoCeu = 0;
            const pintarFundoOriginal = cena.background.set;
            cena.background.set = function () {
                pinturasDoCeu++;
                return pintarFundoOriginal.apply(this, arguments);
            };


            // ============================================================
            // Ajudantes: relógio, eventos, medidas
            // ============================================================
            function proximo(obtido, esperado, tolerancia) {
                return Math.abs(obtido - esperado) < (tolerancia === undefined ? TOLERANCIA : tolerancia);
            }

            function normalizar(angulo) {
                return Math.atan2(Math.sin(angulo), Math.cos(angulo));
            }

            function registrar(categoria, mensagem) {
                if (!(categoria in violacoes)) {
                    violacoes[categoria] = mensagem;
                }
            }

            function todosFinitos(lista) {
                for (let i = 0; i < lista.length; i++) {
                    if (!Number.isFinite(lista[i])) {
                        return false;
                    }
                }
                return true;
            }

            function fotografar() {
                return {
                    giro: giroDaBarca,
                    proa: proa,
                    guinada: guinada.angulo,
                    guinadaVelocidade: guinada.velocidade,
                    arfagem: arfagem.angulo,
                    arfagemVelocidade: arfagem.velocidade,
                    x: barca.position.x,
                    z: barca.position.z,
                    tempoTotal: tempoTotal,
                    pinturasDoCeu: pinturasDoCeu
                };
            }

            function direcaoDoFeixeNoMundo() {
                // getWorldDirection devolve o +z; a luz sai pelo −z, por isso o negate.
                return feixe.getWorldDirection(new THREE_REAL.Vector3()).negate();
            }

            /* Direção esperada: proa + guinada em volta de y, depois arfagem em volta de x (positiva = para cima). */
            function direcaoEsperada() {
                const giro = proa + guinada.angulo;
                return {
                    x: -Math.cos(arfagem.angulo) * Math.sin(giro),
                    y: Math.sin(arfagem.angulo),
                    z: -Math.cos(arfagem.angulo) * Math.cos(giro)
                };
            }

            function alturaEsperada(x, z, tempo) {
                return 0.5 * (Math.sin(0.6 * x + 1.3 * tempo) + Math.sin(0.5 * z + 0.9 * tempo)) / 2;
            }

            /* Entrega um quadro e confere, em TODO quadro, as regras que valem sempre. */
            function passar(milissegundos) {
                const antes = fotografar();
                const construidosAntes = construcoes.Color + construcoes.Vector3;
                const rodou = avancarQuadro(milissegundos);
                if (!rodou) {
                    throw new Error("o jogo não pediu o próximo quadro (loop parado)");
                }
                if (construcoes.Color + construcoes.Vector3 !== construidosAntes) {
                    registrar("nenhum new THREE.Color/Vector3 por quadro",
                        "Color " + construcoes.Color + ", Vector3 " + construcoes.Vector3);
                }
                const duracao = Math.max(0, Math.min(milissegundos / 1000, TETO_DO_QUADRO));
                tempoEsperado += duracao;
                vigiar(antes, duracao);
            }

            function vigiar(antes, duracao) {
                const direcao = direcaoDoFeixeNoMundo();
                const esperada = direcaoEsperada();

                if (!todosFinitos([giroDaBarca, proa, guinada.angulo, guinada.velocidade, arfagem.angulo, arfagem.velocidade,
                    barca.position.x, barca.position.y, barca.position.z, camera.position.x, camera.position.y, camera.position.z,
                    direcao.x, direcao.y, direcao.z, cena.background.r, cena.fog.density, luzDoCeu.intensity, cone.material.opacity])) {
                    registrar("NaN", "algum número virou NaN ou infinito");
                }

                if (Math.abs(guinada.angulo) > LIMITE_DA_GUINADA + MARGEM || Math.abs(lanterna.rotation.y) > LIMITE_DA_GUINADA + MARGEM) {
                    registrar("guinada em ±75°", "guinada " + guinada.angulo);
                }
                if (arfagem.angulo < ARFAGEM_MINIMA - MARGEM || arfagem.angulo > ARFAGEM_MAXIMA + MARGEM ||
                    feixe.rotation.x < ARFAGEM_MINIMA - MARGEM || feixe.rotation.x > ARFAGEM_MAXIMA + MARGEM) {
                    registrar("arfagem entre −20° e +60°", "arfagem " + arfagem.angulo);
                }

                const guinadaNoMundo = normalizar(Math.atan2(-direcao.x, -direcao.z) - proa);
                const elevacaoNoMundo = Math.asin(Math.max(-1, Math.min(1, direcao.y)));
                if (Math.abs(guinadaNoMundo) > LIMITE_DA_GUINADA + 1e-6 ||
                    elevacaoNoMundo < ARFAGEM_MINIMA - 1e-6 || elevacaoNoMundo > ARFAGEM_MAXIMA + 1e-6) {
                    registrar("feixe a ±75° da proa e −20°…+60° de altura no mundo", "guinada no mundo " + guinadaNoMundo + ", y " + direcao.y);
                }

                if (!proximo(direcao.x, esperada.x, 1e-6) || !proximo(direcao.y, esperada.y, 1e-6) || !proximo(direcao.z, esperada.z, 1e-6)) {
                    registrar("direção no mundo = proa + guinada",
                        "obtido (" + direcao.x + ", " + direcao.y + ", " + direcao.z + "), esperado (" + esperada.x + ", " + esperada.y + ", " + esperada.z + ")");
                }

                if (Math.abs(giroDaBarca) > GIRO_MAXIMO_DA_BARCA + MARGEM) {
                    registrar("giro da barca ≤ 1,4 rad/s", "giro " + giroDaBarca);
                }
                if (Math.abs(giroDaBarca - antes.giro) > ACELERACAO_DO_GIRO * duracao + MARGEM) {
                    registrar("aceleração da barca ≤ 4 rad/s²", "mudou " + (giroDaBarca - antes.giro) + " em " + duracao + " s");
                }
                if (Math.abs(normalizar(proa - antes.proa)) > GIRO_MAXIMO_DA_BARCA * duracao + MARGEM) {
                    registrar("proa não gira mais que 1,4 rad/s", "girou " + normalizar(proa - antes.proa) + " em " + duracao + " s");
                }
                // a frente da barca é (−sen proa, −cos proa), a 5 m/s
                if (!proximo(barca.position.x - antes.x, -Math.sin(proa) * VELOCIDADE_DA_BARCA * duracao, 1e-6) ||
                    !proximo(barca.position.z - antes.z, -Math.cos(proa) * VELOCIDADE_DA_BARCA * duracao, 1e-6)) {
                    registrar("a barca anda 5 m/s para a proa", "andou (" + (barca.position.x - antes.x) + ", " + (barca.position.z - antes.z) + ") com proa " + proa);
                }
                if (!proximo(barca.rotation.y, proa, MARGEM)) {
                    registrar("a barca mostra a proa", "rotation.y " + barca.rotation.y + ", proa " + proa);
                }

                // A lanterna fica para trás da proa: no MUNDO ela só anda com a mira (≤ 2,5 rad/s); no LOCAL, a mira mais o giro da barca.
                const mudancaDaLanternaNoMundo = Math.abs(normalizar((proa + guinada.angulo) - (antes.proa + antes.guinada)));
                if (mudancaDaLanternaNoMundo > VELOCIDADE_MAXIMA_DA_MIRA * duracao + MARGEM) {
                    registrar("lanterna no mundo anda ≤ 2,5 rad/s", "andou " + mudancaDaLanternaNoMundo + " em " + duracao + " s");
                }
                if (Math.abs(guinada.angulo - antes.guinada) > GIRO_LOCAL_MAXIMO_DA_GUINADA * duracao + MARGEM) {
                    registrar("guinada local anda ≤ (2,5 + 1,4) rad/s", "andou " + (guinada.angulo - antes.guinada) + " em " + duracao + " s");
                }
                if (Math.abs(arfagem.angulo - antes.arfagem) > VELOCIDADE_MAXIMA_DA_MIRA * duracao + MARGEM) {
                    registrar("arfagem anda ≤ 2,5 rad/s", "andou " + (arfagem.angulo - antes.arfagem) + " em " + duracao + " s");
                }

                [["guinada", guinada, antes.guinadaVelocidade], ["arfagem", arfagem, antes.arfagemVelocidade]]
                    .forEach(function (eixo) {
                        const nome = eixo[0];
                        if (Math.abs(eixo[1].velocidade) > VELOCIDADE_MAXIMA_DA_MIRA + MARGEM) {
                            registrar("lanterna ≤ 2,5 rad/s", nome + " velocidade " + eixo[1].velocidade);
                        }
                        if (Math.abs(eixo[1].velocidade - eixo[2]) > ACELERACAO_DA_MIRA * duracao + MARGEM) {
                            registrar("lanterna ≤ 8 rad/s²", nome + " mudou " + (eixo[1].velocidade - eixo[2]) + " em " + duracao + " s");
                        }
                    });

                if (!proximo(lanterna.rotation.y, guinada.angulo, MARGEM) || !proximo(feixe.rotation.x, arfagem.angulo, MARGEM)) {
                    registrar("a malha mostra o estado", "lanterna.y " + lanterna.rotation.y + ", feixe.x " + feixe.rotation.x);
                }

                const idealX = barca.position.x + 8 * Math.sin(proa);
                const idealY = barca.position.y + 5;
                const idealZ = barca.position.z + 8 * Math.cos(proa);
                const atraso = Math.hypot(camera.position.x - idealX, camera.position.y - idealY, camera.position.z - idealZ);
                maiorAtrasoDaCamera = Math.max(maiorAtrasoDaCamera, atraso);
                if (atraso > FOLGA_DA_CAMERA_EM_METROS) {
                    registrar("câmera perto do ponto ideal", "atraso de " + atraso.toFixed(2) + " m");
                }

                // O mar anda em degraus da grade: múltiplo de 90/64 por eixo, a no máximo meio degrau da barca, na altura 0.
                [["x", mar.position.x, barca.position.x], ["z", mar.position.z, barca.position.z]].forEach(function (eixo) {
                    const emDegraus = eixo[1] / PASSO_DA_GRADE;
                    if (Math.abs(emDegraus - Math.round(emDegraus)) > MARGEM) {
                        registrar("o mar anda em múltiplos da grade", "mar." + eixo[0] + " = " + eixo[1] + " (" + emDegraus + " degraus)");
                    }
                    if (Math.abs(eixo[1] - eixo[2]) > PASSO_DA_GRADE / 2 + MARGEM) {
                        registrar("o mar fica a ≤ meio degrau da barca", "mar." + eixo[0] + " " + eixo[1] + ", barca " + eixo[2]);
                    }
                });
                if (mar.position.y !== 0) {
                    registrar("o mar fica na altura 0", "mar.y = " + mar.position.y);
                }

                if (!proximo(tempoTotal, tempoEsperado, 1e-6)) {
                    registrar("o relógio do jogo", "tempoTotal " + tempoTotal + ", esperado " + tempoEsperado);
                }

                const pinturas = pinturasDoCeu - antes.pinturasDoCeu;
                if (antes.tempoTotal >= DURACAO_DO_ENTARDECER && pinturas > 0) {
                    registrar("com a noite fechada o céu não é repintado", pinturas + " pintura(s) depois de " + antes.tempoTotal + " s");
                }
                if (antes.tempoTotal < DURACAO_DO_ENTARDECER && duracao > 0 && pinturas === 0) {
                    registrar("durante o entardecer o céu é repintado", "nenhuma pintura em t = " + antes.tempoTotal);
                }

                if (medindoAIlha) {
                    menorDistanciaDaIlha = Math.min(menorDistanciaDaIlha, Math.hypot(barca.position.x - ILHA.x, barca.position.z - ILHA.z));
                }
            }

            function passarSegundos(segundos, milissegundos) {
                const passo = milissegundos === undefined ? 50 : milissegundos;
                const quadros = Math.round(segundos * 1000 / passo);
                for (let i = 0; i < quadros; i++) {
                    passar(passo);
                }
            }

            function passarAte(segundos) {
                passarSegundos(segundos - tempoEsperado);
            }

            function tecla(tipo, nome, opcoes) {
                window.dispatchEvent(new KeyboardEvent(tipo, Object.assign({ key: nome }, opcoes)));
            }

            function apertar(nome, opcoes) {
                tecla("keydown", nome, opcoes);
            }

            function soltar(nome) {
                tecla("keyup", nome);
            }

            function eventoDeBotao(botao, tipo) {
                botao.dispatchEvent(new PointerEvent(tipo, { pointerType: "touch", bubbles: false }));
            }

            /* Teclado NO botão (foco): é assim que Enter e Espaço chegam ao botão. Devolve o evento, para ver o preventDefault. */
            function teclaNoBotao(botao, tipo, nome, opcoes) {
                const evento = new KeyboardEvent(tipo, Object.assign({ key: nome, bubbles: true, cancelable: true }, opcoes));
                botao.dispatchEvent(evento);
                return evento;
            }

            /* fx e fy são frações do palco: (0, 0) = canto de cima à esquerda; valores fora de 0..1 caem fora do palco. */
            function eventoNoPalco(tipo, fracaoX, fracaoY, tipoDePonteiro) {
                const retangulo = palco.getBoundingClientRect();
                palco.dispatchEvent(new PointerEvent(tipo, {
                    clientX: retangulo.left + fracaoX * retangulo.width,
                    clientY: retangulo.top + fracaoY * retangulo.height,
                    pointerType: tipoDePonteiro || "mouse"
                }));
            }

            /* Um mouse de verdade não fica parado: renova o comando a cada 0,5 s (a mira dura 2 s). */
            function mirarComMouse(fracaoX, fracaoY, segundos) {
                const rodadas = Math.round(segundos / 0.5);
                for (let i = 0; i < rodadas; i++) {
                    eventoNoPalco("pointermove", fracaoX, fracaoY);
                    passarSegundos(0.5);
                }
            }

            function soltarTudo() {
                window.dispatchEvent(new Event("blur"));
                TECLAS_DO_ROBO.forEach(soltar);
                [BOTAO_ESQUERDA, BOTAO_DIREITA].forEach(function (botao) { eventoDeBotao(botao, "pointerleave"); });
                eventoNoPalco("pointerleave", 0.5, 0.5, "touch");
            }

            /* Solta tudo e espera barca e lanterna voltarem ao repouso. */
            function acalmar() {
                soltarTudo();
                passarSegundos(5);
            }

            function conferirSemViolacoes(contexto) {
                const categorias = Object.keys(violacoes);
                conferir(contexto + ": nenhuma regra quebrada em nenhum quadro", categorias.length === 0,
                    categorias.map(function (categoria) { return categoria + " (" + violacoes[categoria] + ")"; }).join("; "));
                violacoes = {};
            }

            function proximoDeGraus(radianos, graus) {
                return proximo(radianos, graus * GRAU, 1e-3);
            }

            /* Substitui setTimeout enquanto `funcao` roda e devolve os temporizadores que o jogo pediu (sem esperar de verdade). */
            function capturarTemporizadores(funcao) {
                const original = window.setTimeout;
                const pedidos = [];
                window.setTimeout = function (chamada, milissegundos) {
                    pedidos.push({ chamada: chamada, milissegundos: milissegundos });
                    return 0;
                };
                try {
                    funcao();
                } finally {
                    window.setTimeout = original;
                }
                return pedidos;
            }

            /* Atraso da câmera na reta, no plano horizontal, em relação ao ponto ideal atrás da barca. */
            function atrasoHorizontalDaCamera() {
                const idealX = barca.position.x + 8 * Math.sin(proa);
                const idealZ = barca.position.z + 8 * Math.cos(proa);
                return Math.hypot(camera.position.x - idealX, camera.position.z - idealZ);
            }


            // ============================================================
            // Entardecer (mesma tabela do passo 3) e mar em coordenadas do mundo
            // ============================================================
            function corMisturada(corInicial, corFinal, t) {
                const inicio = new THREE_REAL.Color(corInicial);
                const fim = new THREE_REAL.Color(corFinal);
                return {
                    r: inicio.r + (fim.r - inicio.r) * t,
                    g: inicio.g + (fim.g - inicio.g) * t,
                    b: inicio.b + (fim.b - inicio.b) * t
                };
            }

            function corIgual(cor, esperada) {
                return proximo(cor.r, esperada.r) && proximo(cor.g, esperada.g) && proximo(cor.b, esperada.b);
            }

            function piorErroDoMar() {
                const posicoes = mar.geometry.attributes.position;
                let pior = 0;
                const indices = [0, posicoes.count - 1, Math.floor(posicoes.count / 2)];
                for (let i = 0; i < posicoes.count; i += 97) {
                    indices.push(i);
                }
                indices.forEach(function (i) {
                    const noMundoX = posicoes.getX(i) + mar.position.x;
                    const noMundoZ = posicoes.getZ(i) + mar.position.z;
                    pior = Math.max(pior, Math.abs(posicoes.getY(i) - alturaEsperada(noMundoX, noMundoZ, tempoEsperado)));
                });
                return pior;
            }


            // ============================================================
            // Casos
            // ============================================================
            testar("grafo de cena: barca (proa) → lanterna (guinada) → feixe (arfagem) → cone, SpotLight, alvo", function () {
                conferir("o three.js carregou e o renderizador existe", typeof THREE !== "undefined" && renderizador !== null);
                conferir("a barca é filha da cena", barca.parent === cena);
                conferir("a lanterna é filha da barca", lanterna.parent === barca);
                conferir("o feixe é filho da lanterna", feixe.parent === lanterna);

                const luz = feixe.children.find(function (filho) { return filho.isSpotLight === true; });
                conferir("o SpotLight mora no feixe", luz !== undefined);
                conferir("o alvo do SpotLight mora no feixe", luz !== undefined && feixe.children.includes(luz.target));
                conferir("o cone mora no feixe", feixe.children.includes(cone));

                conferirIgual("a intenção tem leme, guinadaAlvo e arfagemAlvo",
                    Object.keys(intencao).sort().join(","), "arfagemAlvo,guinadaAlvo,leme");
                conferir("começa em repouso: proa 0, guinada 0, arfagem −0,12",
                    proa === 0 && guinada.angulo === 0 && proximo(arfagem.angulo, REPOUSO_DA_ARFAGEM));
                conferir("a câmera nasce no ponto ideal (0, 5, 8) da barca",

                conferir("2,2 s depois: o comando acabou e o alvo desce aos poucos (entre 0 e 37,5° − 0,15 rad), não pula",
                    intencao.guinadaAlvo > 0.05 && intencao.guinadaAlvo < 37.5 * GRAU - 0.15, "alvo = " + intencao.guinadaAlvo);
                passarSegundos(0.8);
                conferirIgual("3 s depois: o alvo voltou à proa (0)", intencao.guinadaAlvo, 0);

            });

            testar("toque: arrastar na metade de cima mira; levantar o dedo mantém a mira até 2 s depois do ÚLTIMO movimento", function () {
                acalmar();
                eventoNoPalco("pointerdown", 0.9, 0.1, "touch");

                conferir("e para o alto (y = 0,1): arfagem alvo = repouso + (60° − repouso) × 0,8",

                eventoNoPalco("pointerleave", 0.1, 0.1, "touch");

                passarSegundos(1);
                conferir("2,5 s depois do último movimento a mira já está descendo", intencao.guinadaAlvo < 60 * GRAU - 0.3, "alvo = " + intencao.guinadaAlvo);
                passarSegundos(1);
                conferirIgual("e 3,5 s depois voltou à proa", intencao.guinadaAlvo, 0);
                acalmar();
                conferirSemViolacoes("toque");

            testar("toque na metade de baixo não mira nem renova; pointercancel desce a 2 rad/s", function () {
                acalmar();
                eventoNoPalco("pointermove", 0.2, 0.8, "touch");

            testar("tecla segurada vence o ponteiro (e o ponteiro não volta sozinho)", function () {

            testar("local × mundo: proa + guinada = direção do feixe (e o painel H diz o mesmo)", function () {
                acalmar();

                soltar("a");
                apertar("q");
                apertar("ArrowUp");
                passarSegundos(1);   // a barca ainda está girando e a lanterna ainda andando: o caso difícil
                const direcao = direcaoDoFeixeNoMundo();
                const esperada = direcaoEsperada();
                conferir("direção do feixe = (−cos a·sen(proa+guinada), sen a, −cos a·cos(proa+guinada))",
                    proximo(direcao.x, esperada.x, 1e-6) && proximo(direcao.y, esperada.y, 1e-6) && proximo(direcao.z, esperada.z, 1e-6),

                conferir("a proa não é zero (o teste exercita uma soma de verdade)", Math.abs(proa) > 0.3 && Math.abs(guinada.angulo) > 0.3,

                conferir("o painel começa escondido", painel.hidden === true);
                apertar("h");
                passar(50);
                conferir("H mostra o painel", painel.hidden === false);
                const texto = painel.textContent;
                const partes = /^proa (-?\d+)° \+ guinada (-?\d+)° = mundo (-?\d+)°$/.exec(texto);
                conferir("formato do painel: \"proa X° + guinada Y° = mundo Z°\"", partes !== null, "texto = " + JSON.stringify(texto));
                if (partes !== null) {
                    const soma = normalizar((Number(partes[1]) + Number(partes[2])) * Math.PI / 180) * 180 / Math.PI;
                    const diferenca = Math.abs(normalizar((Number(partes[3]) * Math.PI / 180) - (soma * Math.PI / 180))) * 180 / Math.PI;
                    conferir("mundo ≡ proa + guinada (mod 360°, arredondando cada termo)", diferenca <= 1.5001, "diferença " + diferenca + "° em " + texto);
                }
                apertar("h");
                conferir("H de novo esconde o painel", painel.hidden === true);
                acalmar();
                conferirSemViolacoes("local × mundo");
            });

            testar("robô semeado: entradas aleatórias em milhares de quadros com dt aleatório", function () {
                acalmar();
                violacoes = {};
                maiorAtrasoDaCamera = 0;
                const sementes = [1, 20261026, 987654321];
                const quadrosPorSemente = 3000;
                let eventosEnviados = 0;

                function sortear(lista) {
                    return lista[Math.floor(Math.random() * lista.length)];
                }

                function umEventoAleatorio() {
                    const tipo = Math.floor(Math.random() * 7);
                    eventosEnviados++;
                    if (tipo === 0) {
                        apertar(sortear(TECLAS_DO_ROBO), { repeat: Math.random() < 0.15, ctrlKey: Math.random() < 0.08 });
                    } else if (tipo === 1) {
                        soltar(sortear(TECLAS_DO_ROBO));
                    } else if (tipo === 2) {
                        eventoDeBotao(sortear([BOTAO_ESQUERDA, BOTAO_DIREITA]),
                            sortear(["pointerdown", "pointerdown", "pointerup", "pointerleave", "pointercancel", "blur"]));
                    } else if (tipo === 3) {
                        eventoNoPalco(sortear(["pointermove", "pointermove", "pointermove", "pointerdown", "pointerup", "pointerleave", "pointercancel"]),
                            Math.random() * 4 - 1.5, Math.random() * 4 - 1.5, sortear(["mouse", "touch"]));
                    } else if (tipo === 4) {
                        window.dispatchEvent(new Event(sortear(["blur", "keydown", "keyup"])));   // blur, ou tecla sem `key`
                    } else if (tipo === 5) {
                        teclaNoBotao(sortear([BOTAO_ESQUERDA, BOTAO_DIREITA]), sortear(["keydown", "keyup"]), sortear(["Enter", " ", "Tab"]),
                            { repeat: Math.random() < 0.2 });
                    } else {
                        eventosEnviados--;
                    }
                }

                sementes.forEach(function (semente) {
                    semearSorteio(semente);
                    for (let quadro = 0; quadro < quadrosPorSemente; quadro++) {
                        const quantos = Math.floor(Math.random() * 5);
                        for (let i = 0; i < quantos; i++) {
                            umEventoAleatorio();
                        }
                        passar(sortear(DURACOES_DO_ROBO));
                    }
                    conferirSemViolacoes("robô, semente " + semente + " (" + quadrosPorSemente + " quadros)");
                });

                conferir("o robô realmente mexeu: mais de 10.000 eventos enviados", eventosEnviados > 10000, eventosEnviados + " eventos");
                conferir("a câmera ficou a no máximo " + maiorAtrasoDaCamera.toFixed(2) + " m do ponto ideal (limite " + FOLGA_DA_CAMERA_EM_METROS + " m)",
                    maiorAtrasoDaCamera <= FOLGA_DA_CAMERA_EM_METROS);
                conferir("o mar ainda segue a fórmula no fim do robô", piorErroDoMar() < TOLERANCIA);

                acalmar();
                conferir("depois de soltar tudo, a barca para de girar", Math.abs(giroDaBarca) < 1e-9);
                conferir("e a lanterna volta ao repouso", proximo(guinada.angulo, 0, 1e-3) && proximo(arfagem.angulo, REPOUSO_DA_ARFAGEM, 1e-3));
                conferirSemViolacoes("depois do robô");
            });

            testar("blur solta teclas e botões; os alvos da mira descem ao repouso em até 0,75 s", function () {
                acalmar();
                apertar("a");
                apertar("q");

                passarSegundos(0.7);   // 0,75 s no total depois do blur
                conferirIgual("0,75 s depois do blur a mira lateral está no alvo 0", intencao.guinadaAlvo, 0);
                conferir("e a mira vertical no repouso", proximo(intencao.arfagemAlvo, REPOUSO_DA_ARFAGEM, MARGEM), "alvo = " + intencao.arfagemAlvo);

                conferirSemViolacoes("blur");
            });

            testar("teclas estranhas e combinações do navegador não agem", function () {
                acalmar();
                const eixosAntes = eixos.map(function (eixo) { return eixo.visible; }).join();
                const painelAntes = painel.hidden;

                window.dispatchEvent(new Event("keydown"));   // evento.key é undefined
                window.dispatchEvent(new Event("keyup"));

                apertar("__proto__");

                passar(50);
                conferir("tecla sem `key`, `constructor`, `__proto__`: nada vira ação",
                    intencao.leme === 0 && intencao.guinadaAlvo === 0 && Object.values(acoes).every(function (ativa) { return ativa !== true; }),
                    JSON.stringify(acoes));

                apertar("a", { ctrlKey: true });
                apertar("d", { metaKey: true });
                apertar("q", { altKey: true });
                passar(50);
                conferir("Ctrl+A, Meta+D e Alt+Q não agem", intencao.leme === 0 && intencao.guinadaAlvo === 0, "leme " + intencao.leme);

                apertar("h", { ctrlKey: true });
                apertar("H", { metaKey: true });
                apertar("h", { altKey: true });
                passar(50);
                conferir("Ctrl/Meta/Alt+H não mexem em eixos nem painel",
                    eixos.map(function (eixo) { return eixo.visible; }).join() === eixosAntes && painel.hidden === painelAntes);

                apertar("a", { repeat: true });
                passar(50);
                conferirIgual("repetição automática sozinha não liga a ação", intencao.leme, 0);
                conferirSemViolacoes("teclas estranhas");

            testar("H com repetição automática não pisca", function () {
                acalmar();
                if (painel.hidden === false) {
                    apertar("h");   // o robô pode ter deixado o painel ligado: começa do desligado
                }
                conferir("ponto de partida: painel e eixos desligados",
                    painel.hidden === true && eixos.every(function (eixo) { return eixo.visible === false; }));
                apertar("h");
                for (let i = 0; i < 12; i++) {
                    apertar("h", { repeat: true });
                }
                passar(50);
                conferir("segurar H deixa os eixos e o painel ligados",
                    eixos.length === 2 && eixos.every(function (eixo) { return eixo.visible === true; }) && painel.hidden === false);
                soltar("h");
                apertar("h");
                conferir("outro aperto de H desliga os dois",
                    eixos.every(function (eixo) { return eixo.visible === false; }) && painel.hidden === true);
                soltar("h");
            });

            testar("o teto do quadro: relógio que volta e quadro gigante", function () {
                acalmar();
                // reta: sem leme, a barca anda 5 m/s para a frente (−sen, −cos)
                const antes = { x: barca.position.x, z: barca.position.z, tempo: tempoTotal, proa: proa };

                passar(-500);
                conferir("quadro para trás: a barca não se mexe", barca.position.x === antes.x && barca.position.z === antes.z,
                    "andou (" + (barca.position.x - antes.x) + ", " + (barca.position.z - antes.z) + ")");
                conferirIgual("quadro para trás: o tempo não anda", tempoTotal, antes.tempo);

                passar(500);   // devolve o relógio falso
                const depoisDoRecuo = { x: barca.position.x, z: barca.position.z };
                passar(60000);
                const andou = Math.hypot(barca.position.x - depoisDoRecuo.x, barca.position.z - depoisDoRecuo.z);
                conferir("quadro de 60 s anda só 50 ms de jogo (0,25 m)", proximo(andou, VELOCIDADE_DA_BARCA * TETO_DO_QUADRO, 1e-6), "andou " + andou + " m");

                apertar("a");
                apertar("q");
                const giroAntes = giroDaBarca;
                const guinadaAntes = guinada.velocidade;
                const alvoAntes = intencao.guinadaAlvo;
                passar(-500);
                conferir("com A e Q seguradas, um quadro para trás não muda os giros nem o alvo da mira",
                    giroDaBarca === giroAntes && guinada.velocidade === guinadaAntes && intencao.guinadaAlvo === alvoAntes,
                    "giro " + giroDaBarca + ", guinada " + guinada.velocidade + ", alvo " + intencao.guinadaAlvo);
                passar(500);
                acalmar();
                apertar("a");
                apertar("q");
                passar(60000);
                conferir("com A e Q seguradas, um quadro de 60 s ganha no máximo 0,2 rad/s (barca) e 0,4 rad/s (lanterna)",
                    giroDaBarca <= ACELERACAO_DO_GIRO * TETO_DO_QUADRO + MARGEM && guinada.velocidade <= ACELERACAO_DA_MIRA * TETO_DO_QUADRO + MARGEM,
                    "giro " + giroDaBarca + ", guinada " + guinada.velocidade);
                conferir("e o alvo da mira ganha só 2 × 0,05 = 0,1 rad", proximo(intencao.guinadaAlvo, TAXA_DO_ALVO * TETO_DO_QUADRO, MARGEM),
                    "alvo = " + intencao.guinadaAlvo);
                acalmar();
                conferirSemViolacoes("dt");
            });

            testar("a câmera segue: na reta o atraso estabiliza perto de 1 m, atrás e acima da barca", function () {
                acalmar();
                passarSegundos(6, 16);
                const atrasoNaReta = atrasoHorizontalDaCamera();
                conferir("atraso em regime ≈ 1 m (velocidade ÷ suavidade)", atrasoNaReta > 0.5 && atrasoNaReta < 1.5, "atraso = " + atrasoNaReta);
                conferir("a câmera está acima da água", camera.position.y > barca.position.y + 3);

                const paraFrente = { x: -Math.sin(proa), z: -Math.cos(proa) };
                const relativoX = camera.position.x - barca.position.x;
                const relativoZ = camera.position.z - barca.position.z;
                conferir("a câmera está atrás da barca (produto escalar com a proa < 0)", relativoX * paraFrente.x + relativoZ * paraFrente.z < -5);
                conferirSemViolacoes("câmera");
            });

            testar("a câmera segue igual a 30, 60 e 144 quadros por segundo (fração = 1 − exp(−k·dt))", function () {
                const atrasos = {};
                [30, 60, 144].forEach(function (quadrosPorSegundo) {
                    acalmar();
                    const intervalo = 1000 / quadrosPorSegundo;
                    passarSegundos(8, intervalo);
                    atrasos[quadrosPorSegundo] = atrasoHorizontalDaCamera();

                    // regime da reta: L = a·d ÷ (1 − a), com a = exp(−k·dt) e d = 5 m/s · dt
                    const dt = intervalo / 1000;
                    const a = Math.exp(-SUAVIDADE_DA_CAMERA * dt);
                    const esperado = a * VELOCIDADE_DA_BARCA * dt / (1 - a);
                    conferir(quadrosPorSegundo + " fps: atraso " + atrasos[quadrosPorSegundo].toFixed(3) + " m = regime teórico " + esperado.toFixed(3) + " m",
                        proximo(atrasos[quadrosPorSegundo], esperado, 0.01));
                });
                const menor = Math.min(atrasos[30], atrasos[60], atrasos[144]);
                const maior = Math.max(atrasos[30], atrasos[60], atrasos[144]);
                conferir("o atraso é praticamente o mesmo nas três taxas (diferença " + (maior - menor).toFixed(3) + " m < 0,12 m) e perto de 1 m",
                    maior - menor < 0.12 && menor > 0.85 && maior < 1.05);
                acalmar();
                conferirSemViolacoes("câmera × taxa de quadros");
            });

            finalizar();
        });
