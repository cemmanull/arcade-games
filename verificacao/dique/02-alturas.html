<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Dique, passo 2: as alturas (algoritmo do pintor)</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        #resultado { font-size: 14px; white-space: pre-wrap; }
    </style>
</head>

<body>
    <h1>Teste — Dique, passo 2: as alturas</h1>
    <pre id="resultado"></pre>

    <!-- O esqueleto do passo: o script dele procura estes ids. O canvas começa com 1×1: quem o dimensiona é o script, a partir do mapa. -->
    <canvas id="jogo" width="1" height="1"></canvas>
    <div id="botoes">
        <button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>
        <button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>
        <button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>
    </div>
    <pre id="leitura" aria-live="off"></pre>

    <script src="../apoio.js"></script>
    <script src="apoio-dique.js"></script>

    <!-- Guarda os console.error (o mapa inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/02-alturas/regras.js"></script>
    <script src="../../dique/02-alturas/script.js"></script>

    <script>
        const TOLERANCIA = 1e-9;
        const FOLGA_DA_SOBREPOSICAO = 1e-6;
        const errosNaCarga = errosDeConsole.slice();
        const ALTURAS_ORIGINAIS = JSON.stringify(alturas);

        // ------------------------------------------------------------
        // Ajudantes de entrada e de estado
        // ------------------------------------------------------------
        function apertarTecla(tecla) {
            const evento = new KeyboardEvent("keydown", { key: tecla, cancelable: true });
            document.dispatchEvent(evento);
            return evento;
        }

        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            const rotacaoOriginal = rotacao;
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(rotacaoOriginal);
            }
        }

        function nomeDaCasa(casa) {
            return casa.x + "," + casa.y;
        }

        // ------------------------------------------------------------
        // A conta do pintor, escrita de novo aqui (sem usar o jogo)
        // ------------------------------------------------------------
        function girarPeloMeuCaminho(x, y, giros) {
            let ponto = [x, y];
            for (let i = 0; i < giros; i++) ponto = [TAMANHO - ponto[1], ponto[0]];
            return ponto;
        }

        function proximidadeIndependente(casa, giros) {
            const girado = girarPeloMeuCaminho(casa.x + 0.5, casa.y + 0.5, giros);
            return girado[0] + girado[1];
        }

        function alturaDaSilhueta(casa) {
            return casa.altura < NIVEL_DA_AGUA ? NIVEL_DA_AGUA : casa.altura;      // a água também é pintada
        }

        // Casco convexo (cadeia monótona de Andrew).
        function cascoConvexo(pontos) {
            const ordenados = pontos.slice().sort(function (a, b) { return a.x - b.x || a.y - b.y; });
            function produtoVetorial(origem, a, b) {
                return (a.x - origem.x) * (b.y - origem.y) - (a.y - origem.y) * (b.x - origem.x);
            }
            const embaixo = [], emcima = [];
            ordenados.forEach(function (ponto) {
                while (embaixo.length > 1 && produtoVetorial(embaixo[embaixo.length - 2], embaixo[embaixo.length - 1], ponto) <= 0) embaixo.pop();
                embaixo.push(ponto);
            });
            ordenados.slice().reverse().forEach(function (ponto) {
                while (emcima.length > 1 && produtoVetorial(emcima[emcima.length - 2], emcima[emcima.length - 1], ponto) <= 0) emcima.pop();
                emcima.push(ponto);
            });
            return embaixo.slice(0, -1).concat(emcima.slice(0, -1));
        }

        function silhuetaDaCasa(casa) {
            return cascoConvexo(cantosDoBloco(casa.x, casa.y, 0).concat(cantosDoBloco(casa.x, casa.y, alturaDaSilhueta(casa))));
        }

        function intervaloNoEixo(poligono, eixo) {
            let minimo = Infinity, maximo = -Infinity;
            poligono.forEach(function (ponto) {
                const distancia = ponto.x * eixo.x + ponto.y * eixo.y;
                minimo = Math.min(minimo, distancia);
                maximo = Math.max(maximo, distancia);
            });
            return [minimo, maximo];
        }

        // Eixo separador: dois polígonos convexos têm ÁREA em comum se, em todo eixo normal a uma aresta,
        // os intervalos se cobrem por mais que a folga. Encostar (aresta ou ponta) não conta.
        function poligonosSeSobrepoem(a, b) {
            return [a, b].every(function (poligono) {
                return poligono.every(function (ponto, i) {
                    const proximo = poligono[(i + 1) % poligono.length];
                    const comprimento = Math.hypot(proximo.x - ponto.x, proximo.y - ponto.y);
                    const eixo = { x: -(proximo.y - ponto.y) / comprimento, y: (proximo.x - ponto.x) / comprimento };
                    const intervaloA = intervaloNoEixo(a, eixo), intervaloB = intervaloNoEixo(b, eixo);
                    return Math.min(intervaloA[1], intervaloB[1]) - Math.max(intervaloA[0], intervaloB[0]) > FOLGA_DA_SOBREPOSICAO;
                });
            });
        }

        // Percorre todos os pares (i antes de j na lista). Num par com sobreposição, o de depois tem de estar
        // estritamente mais perto (x'+y' maior): não há desempate, porque empatados nunca se sobrepõem.
        function conferirOrdemDoPintor(lista, giros) {
            const silhuetas = lista.map(silhuetaDaCasa);
            const proximidades = lista.map(function (casa) { return proximidadeIndependente(casa, giros); });
            let pares = 0;
            const violacoes = [];
            for (let i = 0; i < lista.length; i++) {
                for (let j = i + 1; j < lista.length; j++) {
                    if (!poligonosSeSobrepoem(silhuetas[i], silhuetas[j])) continue;
                    pares++;
                    const maisPerto = proximidades[j] > proximidades[i];
                    if (!maisPerto) violacoes.push(nomeDaCasa(lista[i]) + " (antes) cobre " + nomeDaCasa(lista[j]) + " (depois), que está mais longe");
                }
            }
            return { pares: pares, violacoes: violacoes };
        }

        // Casas com o mesmo x'+y' (a conta da página) não podem ter silhuetas com área em comum: por isso não há desempate.
        function empatesQueSeSobrepoem(lista, giros) {
            const grupos = {};
            lista.forEach(function (casa) {
                const chave = proximidadeIndependente(casa, giros).toFixed(6);
                (grupos[chave] = grupos[chave] || []).push(casa);
            });
            let pares = 0;
            const sobrepostos = [];
            Object.keys(grupos).forEach(function (chave) {
                const grupo = grupos[chave];
                for (let i = 0; i < grupo.length; i++) {
                    for (let j = i + 1; j < grupo.length; j++) {
                        pares++;
                        if (poligonosSeSobrepoem(silhuetaDaCasa(grupo[i]), silhuetaDaCasa(grupo[j]))) sobrepostos.push(nomeDaCasa(grupo[i]) + " com " + nomeDaCasa(grupo[j]));
                    }
                }
            });
            return { pares: pares, sobrepostos: sobrepostos };
        }

        // Sem desempate: no empate de x'+y' a ordem é a do mapa (linha por linha), seja qual for a altura.
        function empatesNaOrdemDoMapa(lista) {
            return lista.every(function (casa, i) {
                if (i === 0 || casa.proximidade !== lista[i - 1].proximidade) return true;
                const anterior = lista[i - 1];
                return anterior.y < casa.y || (anterior.y === casa.y && anterior.x < casa.x);
            });
        }

        function sortearTerreno() {
            alturas.forEach(function (linha) {
                for (let x = 0; x < linha.length; x++) linha[x] = Math.floor(Math.random() * 5);
            });
        }

        function restaurarTerreno() {
            const original = JSON.parse(ALTURAS_ORIGINAIS);
            alturas.forEach(function (linha, y) {
                for (let x = 0; x < linha.length; x++) linha[x] = original[y][x];
            });
            irParaOGiro(0);
        }

        // ------------------------------------------------------------
        // O gravador do quadro: anota o que o jogo manda ao canvas (traços com espessura, cor e tracejado; preenchimentos)
        // e, por espiões em desenharCaixa e desenharAgua, quando cada casa e cada água são pintadas.
        // ------------------------------------------------------------
        const COR_DO_CURSOR = "#ffe14d";
        const COR_DO_CONTORNO = "rgba(0, 0, 0, 0.5)";

        function alfaDaCor(cor) {
            const partes = /^rgba\(.*,\s*([\d.]+)\)$/.exec(cor);
            return partes ? Number(partes[1]) : 1;
        }

        function gravarQuadros(quantidade) {
            const registro = [];
            let caminho = [];
            let dentroDe = null;
            const prototipo = CanvasRenderingContext2D.prototype;
            const caixaVerdadeira = desenharCaixa, aguaVerdadeira = desenharAgua;
            pincel.beginPath = function () { caminho = []; prototipo.beginPath.call(pincel); };
            pincel.moveTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.moveTo.call(pincel, x, y); };
            pincel.lineTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.lineTo.call(pincel, x, y); };
            pincel.stroke = function () {
                registro.push({ tipo: "traco", pontos: caminho.slice(), largura: pincel.lineWidth, cor: pincel.strokeStyle, tracejado: pincel.getLineDash().length > 0, dentroDe: dentroDe });
                prototipo.stroke.call(pincel);
            };
            pincel.fill = function () {
                registro.push({ tipo: "preenchimento", pontos: caminho.slice(), cor: pincel.fillStyle, dentroDe: dentroDe });
                prototipo.fill.call(pincel);
            };
            pincel.strokeText = function (texto, x, y) {
                registro.push({ tipo: "texto-contorno", texto: String(texto), x: x, y: y, largura: pincel.lineWidth, cor: pincel.strokeStyle });
                prototipo.strokeText.call(pincel, texto, x, y);
            };
            pincel.fillText = function (texto, x, y) {
                registro.push({ tipo: "texto-cheio", texto: String(texto), x: x, y: y, cor: pincel.fillStyle });
                prototipo.fillText.call(pincel, texto, x, y);
            };
            desenharCaixa = function (x, y, de, ate, estilo) {
                registro.push({ tipo: "caixa", x: x, y: y, de: de, ate: ate, contorno: estilo.contorno });
                dentroDe = "caixa";
                try { return caixaVerdadeira(x, y, de, ate, estilo); } finally { dentroDe = null; }
            };
            desenharAgua = function (casa) {
                registro.push({ tipo: "agua", x: casa.x, y: casa.y, altura: casa.altura });
                dentroDe = "agua";
                try { return aguaVerdadeira(casa); } finally { dentroDe = null; }
            };
            try {
                for (let i = 0; i < quantidade; i++) if (!avancarQuadro(16)) throw new Error("o laço do jogo parou de pedir quadros");
            } finally {
                desenharCaixa = caixaVerdadeira;
                desenharAgua = aguaVerdadeira;
                ["beginPath", "moveTo", "lineTo", "stroke", "fill", "strokeText", "fillText"].forEach(function (nome) { delete pincel[nome]; });
            }
            return registro;
        }

        // A conta do que o jogo deveria pintar, escrita aqui: as casas alagadas e as bordas onde a água encontra terra ou o fim do mapa.
        function casasAlagadasDoMapa() {
            const casas = [];
            alturas.forEach(function (linha, y) { linha.forEach(function (altura, x) { if (altura < NIVEL_DA_AGUA) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        function vizinhasNoMundo(casa) {
            return [[1, 0], [-1, 0], [0, 1], [0, -1]].map(function (passo) { return { x: casa.x + passo[0], y: casa.y + passo[1], passo: passo }; });
        }

        function ehTerraOuFora(vizinha) {
            const dentro = vizinha.x >= 0 && vizinha.y >= 0 && vizinha.x < TAMANHO && vizinha.y < TAMANHO;
            return !dentro || alturas[vizinha.y][vizinha.x] >= NIVEL_DA_AGUA;
        }

        function chaveDePonto(ponto) {
            return (Math.round(ponto.x * 1000) / 1000) + ";" + (Math.round(ponto.y * 1000) / 1000);
        }

        function bordasBrancasEsperadas() {
            const chaves = [];
            casasAlagadasDoMapa().forEach(function (casa) {
                vizinhasNoMundo(casa).filter(ehTerraOuFora).forEach(function (vizinha) {
                    chaves.push(chaveDePonto(mundoParaTela(casa.x + 0.5 + vizinha.passo[0] / 2, casa.y + 0.5 + vizinha.passo[1] / 2, NIVEL_DA_AGUA)));
                });
            });
            return chaves.sort();
        }

        function cantosEsperadosDoTopo(casa, altura) {
            return [[0, 0], [1, 0], [1, 1], [0, 1]].map(function (canto) { return chaveDePonto(mundoParaTela(casa.x + canto[0], casa.y + canto[1], altura)); }).sort();
        }

        function fichasDoQuadro(registro) {          // C = caixa, A = água, K = cursor sólido, k = cursor tracejado
            const fichas = [];
            registro.forEach(function (operacao) {
                if (operacao.tipo === "caixa") fichas.push("C " + operacao.x + "," + operacao.y);
                else if (operacao.tipo === "agua") fichas.push("A " + operacao.x + "," + operacao.y);
                else if (operacao.tipo === "traco" && operacao.cor === COR_DO_CURSOR) fichas.push(operacao.tracejado ? "k" : "K");
            });
            return fichas;
        }

        function fichasEsperadas(escondido) {
            const fichas = [];
            listaDeDesenho.forEach(function (casa) {
                fichas.push((casa.altura < NIVEL_DA_AGUA ? "A " : "C ") + casa.x + "," + casa.y);      // a casa alagada pinta leito e água, não caixa
                if (casa.x === cursor.x && casa.y === cursor.y) fichas.push("K");
            });
            if (escondido) fichas.push("k");
            return fichas;
        }

        // Quem esconde, pela minha conta: alguma casa mais à frente (x'+y' maior) cuja silhueta (casco do chão e do topo) contém o centro do topo.
        function pontoNoPoligonoConvexo(poligono, ponto) {
            let positivo = false, negativo = false;
            poligono.forEach(function (canto, i) {
                const proximo = poligono[(i + 1) % poligono.length];
                const lado = (proximo.x - canto.x) * (ponto.y - canto.y) - (proximo.y - canto.y) * (ponto.x - canto.x);
                if (lado > 1e-9) positivo = true;
                if (lado < -1e-9) negativo = true;
            });
            return !(positivo && negativo);
        }

        function escondedoresPelaMinhaConta(x, y, giros) {
            const centro = girarPeloMeuCaminho(x + 0.5, y + 0.5, giros);
            const topo = mundoParaTela(x + 0.5, y + 0.5, alturaDaSilhueta({ altura: alturas[y][x] }));
            const proximidade = centro[0] + centro[1];
            const escondedores = [];
            alturas.forEach(function (linha, yy) {
                linha.forEach(function (altura, xx) {
                    const outra = { x: xx, y: yy, altura: altura };
                    if (proximidadeIndependente(outra, giros) <= proximidade + 1e-9) return;
                    if (pontoNoPoligonoConvexo(silhuetaDaCasa(outra), topo)) escondedores.push(nomeDaCasa(outra));
                });
            });
            return escondedores;
        }

        function montarListaComOutroGiro(giro) {
            const giroAtual = rotacao;
            rotacao = giro;
            const lista = montarListaDeDesenho();
            rotacao = giroAtual;
            return lista;
        }

        function contarCasasAlagadas() {
            let total = 0;
            alturas.forEach(function (linha) { linha.forEach(function (altura) { if (altura < NIVEL_DA_AGUA) total++; }); });
            return total;
        }

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("o mapa e as camadas em texto", function () {
            conferirIgual("10 linhas de altura", ALTURAS_EM_TEXTO.length, 10);
            conferirIgual("TAMANHO deduzido do texto", TAMANHO, ALTURAS_EM_TEXTO.length);
            conferir("alturas: quadrado e só ~ 0-4", ALTURAS_EM_TEXTO.every(function (linha) { return /^[~0-4]{10}$/.test(linha); }));
            conferir("objetos: quadrado e só C P .", OBJETOS_EM_TEXTO.length === TAMANHO && OBJETOS_EM_TEXTO.every(function (linha) { return /^[CP.]{10}$/.test(linha); }));
            conferirIgual("4 casas e 1 cais", OBJETOS_EM_TEXTO.join("").split("").filter(function (s) { return s !== "."; }).sort().join(""), "CCCCP");
            let objetosNoMar = 0;
            OBJETOS_EM_TEXTO.forEach(function (linha, y) {
                linha.split("").forEach(function (objeto, x) { if (objeto !== "." && ALTURAS_EM_TEXTO[y][x] === "~") objetosNoMar++; });
            });
            conferirIgual("nenhum objeto no mar", objetosNoMar, 0);
            conferirIgual("alturas numéricas: ~ vira 0, dígito vira o número", alturas.map(function (linha) { return linha.join(""); }).join("|"),
                ALTURAS_EM_TEXTO.map(function (linha) { return linha.replace(/~/g, "0"); }).join("|"));
            conferir("toda altura é number", alturas.every(function (linha) { return linha.every(function (n) { return typeof n === "number"; }); }));
            conferirIgual("o nível da água é 1 (passo 2)", NIVEL_DA_AGUA, 1);
            conferirIgual("um degrau sobe 12 px", ALTURA_DO_DEGRAU, 12);
            conferirIgual("estado inicial: sem giro", rotacao, 0);
        });

        testar("a matriz e a inversa (herdadas do passo 1)", function () {
            conferir("det ≠ 0", DETERMINANTE !== 0);
            conferir("det = L²/4", Math.abs(DETERMINANTE - LARGURA_DO_BLOCO * LARGURA_DO_BLOCO / 4) < TOLERANCIA);
            const produto = [0, 1].map(function (linha) {
                return [0, 1].map(function (coluna) { return MATRIZ[linha][0] * INVERSA[0][coluna] + MATRIZ[linha][1] * INVERSA[1][coluna]; });
            });
            conferir("MATRIZ · INVERSA = I",
                Math.abs(produto[0][0] - 1) < TOLERANCIA && Math.abs(produto[1][1] - 1) < TOLERANCIA
                && Math.abs(produto[0][1]) < TOLERANCIA && Math.abs(produto[1][0]) < TOLERANCIA, JSON.stringify(produto));
        });

        testar("ida e volta com altura, nos 4 giros (1.000 pontos cada)", function () {
            semearSorteio(31337);
            rodarNosQuatroGiros(function (giro) {
                let pior = 0;
                for (let i = 0; i < 1000; i++) {
                    const x = Math.random() * TAMANHO, y = Math.random() * TAMANHO, z = Math.random() * 4;
                    const naTela = mundoParaTela(x, y, z);
                    const devolta = telaParaMundo(naTela.x, naTela.y, z);
                    pior = Math.max(pior, Math.abs(devolta.x - x), Math.abs(devolta.y - y));
                }
                conferir("mundo → tela → mundo, giro " + giro * 90 + "°: erro " + pior.toExponential(2), pior < TOLERANCIA);

                let piorTela = 0;
                for (let i = 0; i < 1000; i++) {
                    const sx = Math.random() * 400, sy = Math.random() * 300, z = Math.floor(Math.random() * 5);
                    const noMundo = telaParaMundo(sx, sy, z);
                    const devolta = mundoParaTela(noMundo.x, noMundo.y, z);
                    piorTela = Math.max(piorTela, Math.abs(devolta.x - sx), Math.abs(devolta.y - sy));
                }
                conferir("tela → mundo → tela, giro " + giro * 90 + "°: erro " + piorTela.toExponential(2), piorTela < TOLERANCIA);
            });
        });

        testar("a altura sobe o ponto na tela, sem mexer no x", function () {
            irParaOGiro(0);
            const chao = mundoParaTela(3, 4, 0), alto = mundoParaTela(3, 4, 2);
            conferirIgual("z = 2 sobe 24 px", chao.y - alto.y, 2 * ALTURA_DO_DEGRAU);
            conferirIgual("e não desloca o x", alto.x, chao.x);
            conferirIgual("sem z é o mesmo que z = 0", JSON.stringify(mundoParaTela(3, 4)), JSON.stringify(chao));
            conferirIgual("projetar(u, v) sem z = z 0", JSON.stringify(projetar(3, 4)), JSON.stringify(projetar(3, 4, 0)));
            conferirIgual("o canto (0, 0) cai na ORIGEM", JSON.stringify(mundoParaTela(0, 0)), JSON.stringify({ x: ORIGEM.x, y: ORIGEM.y }));
            conferirIgual("a ORIGEM deixa 4 degraus + 12 px acima", ORIGEM.y, 4 * ALTURA_DO_DEGRAU + 12);
        });

        testar("a ilha com blocos de 4 e a água cabe na tela de 384×252, nos 4 giros", function () {
            rodarNosQuatroGiros(function (giro) {
                let esquerda = Infinity, direita = -Infinity, cima = Infinity, baixo = -Infinity;
                for (let y = 0; y < TAMANHO; y++) {
                    for (let x = 0; x < TAMANHO; x++) {
                        [0, 4].forEach(function (altura) {
                            cantosDoBloco(x, y, altura).forEach(function (canto) {
                                esquerda = Math.min(esquerda, canto.x); direita = Math.max(direita, canto.x);
                                cima = Math.min(cima, canto.y); baixo = Math.max(baixo, canto.y);
                            });
                        });
                    }
                }
                conferir("giro " + giro * 90 + "°: x de " + esquerda + " a " + direita + " cabe em 390 px", esquerda >= 0 && direita <= 390);
                conferir("giro " + giro * 90 + "°: x cabe no canvas de " + tela.width, esquerda >= 0 && direita <= tela.width);
                conferir("giro " + giro * 90 + "°: y de " + cima + " a " + baixo + " cabe no canvas de " + tela.height, cima >= 0 && baixo <= tela.height);
            });
        });

        testar("a lista de desenho: completa, sem repetição, ordenada", function () {
            rodarNosQuatroGiros(function (giro) {
                const nome = "giro " + giro * 90 + "°: ";
                conferirIgual(nome + "uma entrada por casa (100)", listaDeDesenho.length, TAMANHO * TAMANHO);

        // Confere a água de UM quadro gravado contra a conta feita aqui (casas, topo, bordas).
        function conferirAguaDoQuadro(registro, nome) {
            const alagadas = casasAlagadasDoMapa();
            const chamadas = registro.filter(function (operacao) { return operacao.tipo === "agua"; });
            conferirIgual(nome + ": uma chamada de desenharAgua por casa mais baixa que o nível", chamadas.length, alagadas.length);
            conferirIgual(nome + ": e são exatamente essas casas", chamadas.map(nomeDaCasa).sort().join("|"), alagadas.map(nomeDaCasa).sort().join("|"));
            conferir(nome + ": nenhuma casa de altura ≥ nível recebe água", chamadas.every(function (chamada) { return chamada.altura < NIVEL_DA_AGUA && alturas[chamada.y][chamada.x] < NIVEL_DA_AGUA; }));

            const porCasa = {};
            let atual = null;
            registro.forEach(function (operacao) {
                if (operacao.tipo === "agua") { atual = nomeDaCasa(operacao); porCasa[atual] = { preenchimentos: [], tracos: [] }; return; }
                if (operacao.dentroDe !== "agua") return;
                if (operacao.tipo === "preenchimento") porCasa[atual].preenchimentos.push(operacao);
                if (operacao.tipo === "traco") porCasa[atual].tracos.push(operacao);
            });

            const semUmTopo = [], topoErrado = [], opaca = [], tracoNaoBranco = [], tracoFino = [], tracoQueNaoEAresta = [];
            const bordasPintadas = [];
            alagadas.forEach(function (casa) {
                const feito = porCasa[nomeDaCasa(casa)];
                if (!feito || feito.preenchimentos.length !== 1) { semUmTopo.push(nomeDaCasa(casa)); return; }
                const topo = feito.preenchimentos[0];
                const alturaDaAgua = alturaVisivel(alturas[casa.y][casa.x]);
                if (topo.pontos.map(chaveDePonto).sort().join("|") !== cantosEsperadosDoTopo(casa, alturaDaAgua).join("|")) topoErrado.push(nomeDaCasa(casa));
                if (!(alfaDaCor(topo.cor) < 1) || Math.abs(alfaDaCor(topo.cor) - alfaDaCor(estiloDaAgua(casa).topo)) > 0.011) opaca.push(nomeDaCasa(casa));
                feito.tracos.filter(function (traco) { return alfaDaCor(traco.cor) > 0; }).forEach(function (traco) {
                    if (traco.cor.indexOf("255, 255, 255") === -1) tracoNaoBranco.push(nomeDaCasa(casa) + " " + traco.cor);
                    if (traco.largura !== 1) tracoFino.push(nomeDaCasa(casa) + " " + traco.largura);
                    if (traco.pontos.length !== 2) tracoQueNaoEAresta.push(nomeDaCasa(casa) + " com " + traco.pontos.length + " pontos");
                    bordasPintadas.push(chaveDePonto({ x: (traco.pontos[0].x + traco.pontos[1].x) / 2, y: (traco.pontos[0].y + traco.pontos[1].y) / 2 }));
                });
            });
            conferirIgual(nome + ": cada casa alagada tem UM preenchimento (o topo, sem laterais)", semUmTopo.join(" "), "");
            conferirIgual(nome + ": o topo é o losango da casa à altura da superfície (alturaVisivel)", topoErrado.join(" "), "");
            conferirIgual(nome + ": o topo é translúcido e usa estiloDaAgua", opaca.join(" "), "");
            conferirIgual(nome + ": todo traço visível da água é branco", tracoNaoBranco.join(" | "), "");
            conferirIgual(nome + ": e tem 1 px", tracoFino.join(" | "), "");
            conferirIgual(nome + ": e é uma aresta (2 pontos), nunca o losango inteiro", tracoQueNaoEAresta.join(" | "), "");
            const esperadas = bordasBrancasEsperadas();
            conferirIgual(nome + ": o número de arestas brancas é o de fronteiras água/terra ou água/fim do mapa", bordasPintadas.length, esperadas.length);
            conferirIgual(nome + ": e cada aresta branca está sobre uma dessas fronteiras (nenhuma entre duas águas)", bordasPintadas.sort().join("|"), esperadas.join("|"));
            conferir(nome + ": sem traço visível da água fora das chamadas de desenharAgua que não seja a aresta", registro.filter(function (operacao) {
                return operacao.tipo === "traco" && operacao.dentroDe === "agua" && alfaDaCor(operacao.cor) > 0;
            }).length === esperadas.length);
            return esperadas.length;
        }

                const janela = quadroReduzido.contentWindow;     // os let/const do script ficam fora de window: lê-se por eval
                conferirIgual("o script do passo carregou no quadro", typeof janela.atualizar, "function");
                conferirIgual("o jogo leu prefers-reduced-motion: reduce", janela.eval("movimentoReduzido"), true);
                conferirIgual("o loop do quadro começou", typeof janela.proximoQuadro, "function");

                let relogio = 0;
                for (let i = 0; i < 120; i++) {
                    const funcao = janela.proximoQuadro;
                    janela.proximoQuadro = null;
                    relogio += 16;
                    funcao(relogio);
                }
                conferirIgual("depois de 120 quadros a fase da onda continua em 0", janela.eval("faseDaOnda"), 0);
                janela.atualizar(1);
                conferirIgual("e atualizar(1) também não mexe", janela.eval("faseDaOnda"), 0);

                const alfas = [{ x: 0, y: 0 }, { x: 3, y: 7 }, { x: 9, y: 4 }].map(function (casa) {
                    return /, ([\d.]+)\)$/.exec(janela.estiloDaAgua(casa).topo)[1];
                });
                conferirIgual("o brilho da água é fixo (0,55) em qualquer casa", alfas.join(","), "0.55,0.55,0.55");
                conferirIgual("o loop segue vivo", typeof janela.proximoQuadro, "function");
                conferirIgual("nenhum erro não tratado", janela.errosNaoTratados.join(" | "), "");
                conferirIgual("nenhum console.error", janela.errosDeConsole.join(" | "), "");
            });
            umQuadroTerminou();
        });
        quadroReduzido.srcdoc = montarPaginaComMovimentoReduzido();
        document.body.appendChild(quadroReduzido);

        // Mapa inválido na CARGA: uma página nova em que a camada de objetos chega com uma linha a menos. O espião em
        // Array.prototype.every corta a camada na hora em que verificarMapa a lê pela primeira vez.
        function montarPaginaComMapaCurto() {
            const fecharScript = "<" + "/script>";
            return "<!DOCTYPE html><html><body>"
                + '<canvas id="jogo" width="1" height="1"></canvas><div id="botoes"></div><pre id="leitura"></pre>'
                + "<script>"
                + "window.errosNaoTratados = []; window.proximoQuadro = null; window.errosDeConsole = [];"
                + "console.error = function () { window.errosDeConsole.push(Array.prototype.join.call(arguments, ' ')); };"
                + "window.addEventListener('error', function (evento) { window.errosNaoTratados.push(evento.message); });"
                + "window.requestAnimationFrame = function (funcao) { window.proximoQuadro = funcao; return 1; };"
                + "performance.now = function () { return 0; };"
                + "var everyOriginal = Array.prototype.every, jaCortou = false;"
                + "Array.prototype.every = function () {"
                + "  if (!jaCortou && this.length === 2 && Array.isArray(this[0]) && Array.isArray(this[1])) { jaCortou = true; this[1].pop(); }"
                + "  return everyOriginal.apply(this, arguments);"
                + "};"
                + fecharScript
                + '<script src="../../dique/02-alturas/regras.js">' + fecharScript
                + '<script src="../../dique/02-alturas/script.js">' + fecharScript
                + "</body></html>";
        }

        const quadroDoMapaCurto = document.createElement("iframe");
        quadroDoMapaCurto.style.display = "none";
        quadroDoMapaCurto.addEventListener("load", function () {
            testar("mapa inválido na carga: um aviso, MAPA_VALIDO falso, nenhum laço de quadros", function () {
                const janela = quadroDoMapaCurto.contentWindow;
                conferirIgual("o espião cortou a camada de objetos (9 linhas)", janela.eval("OBJETOS_EM_TEXTO.length"), 9);
                conferirIgual("o script do passo carregou até o fim", typeof janela.atualizar, "function");
                conferirIgual("MAPA_VALIDO é falso", janela.eval("MAPA_VALIDO"), false);
                conferirIgual("exatamente um console.error", janela.errosDeConsole.length, 1);
                conferir("e ele diz que o mapa é inválido", /Mapa inválido/.test(janela.errosDeConsole[0] || ""), janela.errosDeConsole[0]);
                conferirIgual("nenhum erro não tratado (nada de TypeError ao ler a camada curta)", janela.errosNaoTratados.join(" | "), "");
                conferirIgual("a lista de desenho não foi montada", janela.eval("listaDeDesenho.length"), 0);
                conferirIgual("o laço de quadros nunca começou", janela.proximoQuadro, null);
            });
            umQuadroTerminou();
        });
        quadroDoMapaCurto.srcdoc = montarPaginaComMapaCurto();
        document.body.appendChild(quadroDoMapaCurto);

        setTimeout(function () {
            if (!jaFinalizou) {
                conferir("os quadros de teste (movimento reduzido e mapa curto) carregaram", false);
                terminarUmaVez();
            }
        }, 5000);
    </script>
