<body>

    <!-- O esqueleto do passo (o miolo do <body> do index.html): o script dele procura estes ids.
         Na página o canvas começa com 1×1: quem o dimensiona é o script. -->
    <script>
        // ESPELHO:inicio dique/07-dias/index.html corpo
        const MARCACAO_DO_PASSO = '<h1>Dique <small id="dia"></small></h1>'
            + '<canvas id="jogo" width="384" height="252">Seu navegador não suporta canvas.</canvas>'
            + '<p id="painel"></p>'
            + '<p id="objetivo"></p>'
            + '<p id="tabua" title="Tábua de marés: n = nível da água, passos × casas por passo (com chuva, já somadas as 2 da chuva), + blocos que chegam, ☂ chuva; [colchetes] marcam a maré de agora"></p>'
            + '<div id="ferramentas">'
            + '<button type="button" data-acao="escolherErguer" data-ferramenta="erguer" aria-pressed="true" aria-label="Ferramenta Erguer: sobe a casa um degrau e gasta um bloco (1)">Erguer</button>'
            + '<button type="button" data-acao="escolherCavar" data-ferramenta="cavar" aria-pressed="false" aria-label="Ferramenta Cavar: desce a casa um degrau e devolve um bloco (2)">Cavar</button>'
            + '<button type="button" data-acao="aplicar" aria-label="Aplicar a ferramenta na casa marcada (Enter ou Espaço)">Aplicar</button>'
            + '<button type="button" data-acao="desfazer" aria-label="Desfazer a última jogada (Z)">Desfazer</button>'
            + '<button type="button" data-acao="avancar" aria-label="Liberar a maré; depois que ela passa, chamar a próxima ficha; no fim de um dia vencido, abrir o próximo dia (M)">Maré</button>'
            + '<button type="button" data-acao="reiniciar" aria-label="Recomeçar o dia (N)">Refazer</button>'
            + '</div>'
            + '<div id="botoes">'
            + '<button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>'
            + '<button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>'
            + '<button type="button" data-acao="afastar" aria-label="Longe: afastar o mapa (−)">Longe</button>'
            + '<button type="button" data-acao="aproximar" aria-label="Perto: aproximar o mapa (+)">Perto</button>'
            + '<button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>'
            + '</div>'
            + '<div id="setas">'
            + '<button type="button" data-acao="cursorParaEsquerda" aria-label="Mover o cursor para a esquerda (seta)">←</button>'
            + '<button type="button" data-acao="cursorParaCima" aria-label="Mover o cursor para cima (seta)">↑</button>'
            + '<button type="button" data-acao="cursorParaBaixo" aria-label="Mover o cursor para baixo (seta)">↓</button>'
            + '<button type="button" data-acao="cursorParaDireita" aria-label="Mover o cursor para a direita (seta)">→</button>'
            + '</div>'
            + '<p id="aviso" role="status"></p>'
            + '<pre id="leitura" aria-live="off"></pre>';
        // ESPELHO:fim
        document.body.insertAdjacentHTML("beforeend", MARCACAO_DO_PASSO.replace('width="384" height="252"', 'width="1" height="1"'));
    </script>

    <!-- Guarda os console.error (um dia inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/07-dias/regras.js"></script>
    <script src="../../dique/07-dias/script.js"></script>

    <script>
        const errosNaCarga = errosDeConsole.slice();
        const DIAS_ORIGINAIS = JSON.stringify(DIAS);
        const SETAS_DA_TELA = [["cursorParaEsquerda", -1, 0], ["cursorParaCima", 0, -1], ["cursorParaBaixo", 0, 1], ["cursorParaDireita", 1, 0]];

        // Os números do GDD e do GUIA, escritos aqui de propósito (não lidos do jogo).
        const PARES_ESPERADOS = [1, 2, 2, 3, 2, 3, 3, 4, 3, 5];
        const FICHAS_ESPERADAS = [1, 1, 1, 1, 2, 2, 1, 2, 1, 2];
        const ESTADOS_DO_GUIA = [34, 1911, 62, 3383, 10916, 8022, 5170, 7437, 3355, 6234];
        const CASAS_CHAVE_DO_DIA_10 = ["2,5", "4,4", "4,7"];
        const PLANOS_DE_5_JOGADAS_DO_DIA_10 = 55;
        const TETO_DO_GUIA = 2000000, LIMITE_DO_GUIA = 6;
        const CASA_CHAVE_ESCONDIDA = { x: 2, y: 5 };
        const NOMES_DAS_VARIAVEIS_DO_ROBO = ["diaCarregado", "alturasEmTexto", "objetosEmTexto", "alturasIniciais", "alturas", "casasDoMar", "casasComCasa", "casasDeNascente", "tabuaDeMares", "metaDoDia"];

        /* Um plano que vence cada dia, achado FORA do jogo (uma busca própria em node que lista os planos do tamanho do par) e jogado aqui pelo teclado.
           PLANOS[dia][ficha] = jogadas da maré: [ferramenta, x, y]. O dia 5 e o 6 guardam os blocos da 1ª ficha para a 2ª. */
        const PLANOS_DOS_DIAS = [
            [[["erguer", 3, 6]]],
            [[["erguer", 2, 4], ["erguer", 5, 6]]],
            [[["cavar", 2, 2], ["erguer", 5, 6]]],
            [[["cavar", 2, 2], ["erguer", 4, 3], ["erguer", 5, 7]]],
            [[], [["erguer", 7, 3], ["erguer", 3, 7]]],
            [[], [["erguer", 3, 7], ["erguer", 4, 7], ["erguer", 5, 7]]],
            [[["cavar", 1, 2], ["erguer", 8, 5], ["erguer", 3, 7]]],
            [[["erguer", 3, 4], ["erguer", 4, 7]], [["erguer", 3, 4], ["erguer", 4, 7]]],
            [[["cavar", 1, 2], ["cavar", 5, 2], ["erguer", 3, 4]]],
            [[["cavar", 5, 3], ["erguer", 2, 5]], [["erguer", 4, 4], ["erguer", 2, 5], ["erguer", 4, 7]]],
        ];

        // ------------------------------------------------------------
        // Ajudantes de entrada, de estado e de conta
        // ------------------------------------------------------------
        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(0);
            }
        }

        function definirCamera(zoom, desvioX, desvioY) {
            camera.zoom = zoom;
            camera.desvioX = desvioX;
            camera.desvioY = desvioY;
            limitarCamera();
        }

        function apertarTecla(tecla, modificadores) {
            const evento = new KeyboardEvent("keydown", Object.assign({ key: tecla, cancelable: true, bubbles: true }, modificadores || {}));
            document.dispatchEvent(evento);
            return evento;
        }

        function quadros(vezes) {
            for (let i = 0; i < vezes; i++) avancarQuadro(16);
        }

        function avancarAte(condicao, limiteDeQuadros) {  // quadros até a condição valer; -1 se passar do limite
            let passados = 0;
            while (!condicao() && passados < limiteDeQuadros) { avancarQuadro(16); passados++; }
            return condicao() ? passados : -1;
        }

        function esperarAMare() {                         // até a maré passar (contar na baixa-mar) ou o dia acabar
            return avancarAte(function () { return fase === "fim" || (fase === "contar" && faseDaMare === "baixa"); }, 3000);
        }

        function prepararDia(indice) {                    // o que o Refazer não limpa (giro, câmera, cursor, H, ferramenta) e, por último, o dia
            depuracaoLigada = false;
            escolherFerramenta("erguer");
            rotacao = 0;
            definirCamera(1, 0, 0);
            cursor = { x: 4, y: 4 };
            marcada = false;
            ponteiro = null;
            dedo = null;
            giroDaRoda = 0;
            iniciarDia(indice);
        }

        function sorteio(limite) {
            return Math.floor(Math.random() * limite);
        }

        function copiaDoDia(indice) {
            return JSON.parse(JSON.stringify(DIAS[indice]));
        }

        function trocarSimbolo(texto, posicao, simbolo) {
            return texto.slice(0, posicao) + simbolo + texto.slice(posicao + 1);
        }

        function alturasDoTexto(dia) {                    // o mapa de alturas pela minha leitura do texto
            return dia.mapa.map(function (linha) { return linha[0].split("").map(function (simbolo) { return simbolo === "~" ? 0 : Number(simbolo); }); });
        }

        function casasDoTexto(dia, objeto) {
            const casas = [];
            dia.mapa.forEach(function (linha, y) { linha[1].split("").forEach(function (simbolo, x) { if (simbolo === objeto) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        function marEmTexto(dia) {
            return dia.mapa.map(function (linha) { return linha[0].split("").map(function (simbolo) { return simbolo === "~"; }); });
        }

        function somaDoTerreno(terreno) {
            return terreno.reduce(function (soma, linha) { return soma + linha.reduce(function (parcial, altura) { return parcial + altura; }, 0); }, 0);
        }

        function fotoDoEstado() {
            return JSON.stringify({ alturas: alturas, blocos: estadoAtual.blocos });
        }

        function capturarErros(executar) {                // os console.error esperados saem da lista geral e voltam como resultado
            const antes = errosDeConsole.length;
            executar();
            return errosDeConsole.splice(antes);
        }

        // O robô sobrescreve estas dez variáveis; o teste as guarda e devolve por conta própria.
        function lerAsVariaveisDoRobo() {
            return [diaCarregado, alturasEmTexto, objetosEmTexto, alturasIniciais, alturas, casasDoMar, casasComCasa, casasDeNascente, tabuaDeMares, metaDoDia];
        }

        function porAsVariaveisDoRobo(valores) {
            [diaCarregado, alturasEmTexto, objetosEmTexto, alturasIniciais, alturas, casasDoMar, casasComCasa, casasDeNascente, tabuaDeMares, metaDoDia] = valores;
        }

        function comODiaCarregado(dia, executar) {        // põe o dia nas regras só para a busca da página e devolve o jogo como estava
            const guardadas = lerAsVariaveisDoRobo();
            try {
                carregarDia(dia);
                return executar();
            } finally {
                porAsVariaveisDoRobo(guardadas);
            }
        }

        function variaveisIguaisPorReferencia(antes, depois) {
            return NOMES_DAS_VARIAVEIS_DO_ROBO.filter(function (nome, i) { return antes[i] !== depois[i]; });
        }

        const desenharVerdadeiro = desenhar;
        desenhar = function () { };                       // o desenho de 100 casas por quadro não ajuda os casos de regra; quem lê o texto chama desenharVerdadeiro()

        /* Um dia fechado por um anel de cais (P, altura 2) com `brechas` casas moldáveis de altura 1 no anel; dentro, 4 casas (C). Cada brecha pede 1 bloco,
           e a água (nível 2, volume de sobra) alaga tudo por qualquer brecha aberta. Par verdadeiro = brechas (se há blocos); acima do limite do robô, sem solução. */
        function diaDoAnel(brechas, blocos, par) {
            const alturasDaIlha = Array.from({ length: TAMANHO }, function () { return new Array(TAMANHO).fill("~"); });
            const objetosDaIlha = Array.from({ length: TAMANHO }, function () { return new Array(TAMANHO).fill("."); });
            for (let y = 2; y <= 5; y++) {
                for (let x = 2; x <= 5; x++) {
                    const noAnel = x === 2 || x === 5 || y === 2 || y === 5;
                    alturasDaIlha[y][x] = noAnel ? "2" : "1";
                    objetosDaIlha[y][x] = noAnel ? "P" : "C";
                }
            }
            const lugaresDeBrecha = [[3, 2], [4, 2], [3, 5], [4, 5], [2, 3], [2, 4], [5, 3], [5, 4]];     // sem os cantos: um canto aberto não deixa a água entrar
            lugaresDeBrecha.slice(0, brechas).forEach(function (lugar) {
                alturasDaIlha[lugar[1]][lugar[0]] = "1";
                objetosDaIlha[lugar[1]][lugar[0]] = ".";
            });
            return {
                mapa: alturasDaIlha.map(function (linha, y) { return [linha.join(""), objetosDaIlha[y].join("")]; }),
                tabua: [{ nivel: 2, passos: 1, volume: 60, chuva: false, blocos: blocos }],
                meta: 3, par: par, dica: "anel de teste",
            };
        }

        let relatoriosDosDias = null;
        function relatorios() {                           // o robô nos 10 dias, uma vez só
            if (relatoriosDosDias === null) relatoriosDosDias = DIAS.map(function (dia) { return certificarDia(dia); });
            return relatoriosDosDias;
        }

        function resumoDoRelatorio(relatorio) {
            return JSON.stringify(relatorio);
        }

        // ------------------------------------------------------------
        // Jogar um plano pelo teclado (as mesmas funções que o toque chama), ficha a ficha
        // ------------------------------------------------------------
        function jogadasDaFicha(jogadas) {                // cavar primeiro: o estoque nunca fica negativo no meio da maré
            return jogadas.filter(function (jogada) { return jogada[0] === "cavar"; }).concat(jogadas.filter(function (jogada) { return jogada[0] === "erguer"; }));
        }

        /* O dia de agora (já em "ler", ficha 0). `pularJogada` = índice (na lista inteira do plano) de uma jogada a omitir; com ele, jogadas recusadas são esperadas. */
        function jogarOPlano(plano, pularJogada) {
            const problemas = [], recusadas = [];
            let numero = 0;
            plano.forEach(function (jogadasDaMare, ficha) {
                if (fase !== "ler" || indiceDaMare !== ficha) problemas.push("ficha " + (ficha + 1) + ": começo em " + fase + "/" + indiceDaMare);
                const ordenadas = jogadasDaFicha(jogadasDaMare);
                ordenadas.forEach(function (jogada) {
                    const esteNumero = numero++;
                    if (esteNumero === pularJogada) return;
                    cursor = { x: jogada[1], y: jogada[2] };
                    apertarTecla(jogada[0] === "erguer" ? "1" : "2");
                    const antes = jogadas;
                    apertarTecla("Enter");
                    if (jogadas === antes) (pularJogada === undefined ? problemas : recusadas).push("a jogada " + jogada + " foi recusada: " + aviso.textContent);
                });
                apertarTecla("m");
                if (esperarAMare() < 0) problemas.push("ficha " + (ficha + 1) + ": a maré não terminou");
                if (ficha < plano.length - 1) {
                    if (fase !== "contar") problemas.push("ficha " + (ficha + 1) + ": esperava contar, veio " + fase);
                    apertarTecla("m");
                }
            });
            return { problemas: problemas, recusadas: recusadas };
        }

        function casasSalvasPelaMinhaConta(dia) {         // as casas do texto que nenhuma maré alagou, pela matriz `perdidas` do jogo
            return casasDoTexto(dia, "C").filter(function (casa) { return !perdidas[casa.y][casa.x]; }).length;
        }

        // ------------------------------------------------------------
        // A foto do jogo inteiro (para provar que o robô não o mexe) e a partida no meio
        // ------------------------------------------------------------
        const PIXELS_DA_AMOSTRA = [];
        for (let y = 10.5; y < ALTURA_DA_VISTA; y += 40) for (let x = 10.5; x < LARGURA_DA_VISTA; x += 48) PIXELS_DA_AMOSTRA.push({ x: x, y: y });

        function fotoDoJogo() {
            return JSON.stringify({
                indiceDoDia: indiceDoDia, diaCarregado: diaCarregado === null ? null : DIAS.indexOf(diaCarregado), alturasEmTexto: alturasEmTexto, objetosEmTexto: objetosEmTexto, alturasIniciais: alturasIniciais,
                alturas: alturas, blocos: estadoAtual.blocos, jogadas: jogadas, historico: historico.length, fase: fase, faseDaMare: faseDaMare, indiceDaMare: indiceDaMare, passoDaMare: passoDaMare,
                perdidas: perdidas, agua: agua, listaDeDesenho: listaDeDesenho, previsao: previsao, alcance: alcance, camera: camera, rotacao: rotacao, cursor: cursor, ferramenta: ferramenta,
                casasDoMar: casasDoMar, casasComCasa: casasComCasa, casasDeNascente: casasDeNascente, tabuaDeMares: tabuaDeMares, metaDoDia: metaDoDia,
                pixels: PIXELS_DA_AMOSTRA.map(function (pixel) { const acerto = casaSobOPixel(pixel); return acerto && [acerto.x, acerto.y, acerto.face]; }),
            });
        }

        function montarPartidaNoMeio() {                  // dia 5, 3 jogadas, vista girada, zoom e rolagem mexidos
            prepararDia(4);
            quadros(10);
            [["1", 7, 3], ["2", 6, 3], ["1", 5, 5]].forEach(function (jogada) {
                cursor = { x: jogada[1], y: jogada[2] };
                apertarTecla(jogada[0]);
                apertarTecla("Enter");
            });
            apertarTecla("r");
            apertarTecla("+");
            apertarTecla("d");
            quadros(5);
        }

        function terminarAMare() {                        // o que a partida faz depois, para ver se o robô deixou algo torto
            apertarTecla("m");
            const quadrosGastos = esperarAMare();
            desenharVerdadeiro();
            return JSON.stringify({ quadros: quadrosGastos, fase: fase, faseDaMare: faseDaMare, indiceDaMare: indiceDaMare, perdidas: perdidas, aviso: aviso.textContent, painel: painel.textContent, agua: agua });
        }

        // ------------------------------------------------------------
        // A busca da página: todo plano do tamanho do par (sem memória), para achar as casas que todos tocam
        // ------------------------------------------------------------
        function casasQueMudaram(antes, depois) {
            const mudadas = [];
            depois.forEach(function (linha, y) { linha.forEach(function (altura, x) { if (altura !== antes[y][x]) mudadas.push(x + "," + y); }); });
            return mudadas;
        }

        function planosDoTamanhoDoPar(dia) {              // cada plano vira a lista (ordenada, sem repetição) das casas que ele muda
            return comODiaCarregado(dia, function () {
                const candidatas = candidatasDoDia(), planos = [];
                function seguir(indice, estado, perdidasAteAgora, gasto, tocadas) {
                    if (indice === tabuaDeMares.length) {
                        if (contarCasas(perdidasAteAgora).salvas >= metaDoDia) planos.push(Array.from(new Set(tocadas)).sort());
                        return;
                    }
                    const ficha = tabuaDeMares[indice], comBlocos = receberBlocos(estado, ficha);
                    terrenosAte(comBlocos, dia.par - gasto, candidatas, function (terreno, custo, blocos) {
                        const novasPerdidas = acumularPerdidas(perdidasAteAgora, aguaDaFicha(terreno, ficha, ficha.passos).alagado);
                        if (contarCasas(novasPerdidas).salvas < metaDoDia) return false;
                        seguir(indice + 1, { alturas: terreno, blocos: blocos }, novasPerdidas, gasto + custo, tocadas.concat(casasQueMudaram(comBlocos.alturas, terreno)));
                        return false;
                    });
                }
                seguir(0, estadoInicial(), criarMatriz(false), 0, []);
                return planos;
            });
        }

        function casasDeTodosOsPlanos(planos) {
            const primeiro = planos.length > 0 ? planos[0] : [];
            return primeiro.filter(function (casa) { return planos.every(function (plano) { return plano.indexOf(casa) !== -1; }); });
        }

        // ------------------------------------------------------------
        // O pixel sob a casa-chave
        // ------------------------------------------------------------
        function pixelsDaCasa(casa, deslocamento) {       // varre o canvas inteiro; deslocamento 0.5 = o centro de cada pixel, 0 = o canto
            let achados = 0, somaX = 0, somaY = 0;
            const pixels = [];
            for (let y = 0; y < ALTURA_DA_VISTA; y++) {
                for (let x = 0; x < LARGURA_DA_VISTA; x++) {
                    const acerto = casaSobOPixel({ x: x + deslocamento, y: y + deslocamento });
                    if (acerto && acerto.x === casa.x && acerto.y === casa.y) { achados++; somaX += x; somaY += y; pixels.push({ x: x, y: y }); }
                }
            }
            const meio = { x: somaX / Math.max(1, achados), y: somaY / Math.max(1, achados) };
            const maisPerto = pixels.slice().sort(function (a, b) { return Math.hypot(a.x - meio.x, a.y - meio.y) - Math.hypot(b.x - meio.x, b.y - meio.y); })[0] || null;
            return { achados: achados, maisPertoDoMeio: maisPerto };
        }

        function tocarNoPixel(pixel) {                    // pointerdown no canvas e pointerup na janela, como o dedo
            const caixa = tela.getBoundingClientRect();
            const opcoes = { button: 0, pointerId: 11, bubbles: true, clientX: caixa.left + pixel.x * caixa.width / tela.width, clientY: caixa.top + pixel.y * caixa.height / tela.height };
            tela.dispatchEvent(new PointerEvent("pointerdown", opcoes));
            window.dispatchEvent(new PointerEvent("pointerup", opcoes));
        }

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("[CARGA] o passo carrega o dia 1, sem erro, e o script dimensiona o canvas", function () {
            conferirIgual("[CARGA] a carga não registrou console.error", errosNaCarga.join(" | "), "");
            conferirIgual("[CARGA] o dia 1 vale (MAPA_VALIDO)", MAPA_VALIDO, true);
            conferirIgual("[CARGA] o jogo começa no dia 1, lendo a ficha", indiceDoDia + "/" + fase + "/" + faseDaMare + "/" + jogadas, "0/ler/baixa/0");
            conferirIgual("[CARGA] o canvas nasceu 1×1 na marcação e o script o fez 384×252", tela.width + "×" + tela.height, "384×252");
            conferir("[CARGA] o laço de quadros foi pedido", avancarQuadro(16));
        });

        testar("[DADOS] são 10 dias; cada um é um objeto válido; par, fichas e chuva batem com a tabela do GUIA", function () {
            conferirIgual("[DADOS] são 10 dias", DIAS.length, 10);
            DIAS.forEach(function (dia, i) {
                const nome = "[DADOS] dia " + (i + 1) + ": ";
                conferirIgual(nome + "problemasDoMapa devolve a lista vazia", problemasDoMapa(dia).join(" | "), "");
                conferirIgual(nome + "par " + PARES_ESPERADOS[i] + " e " + FICHAS_ESPERADAS[i] + " fichas", dia.par + "/" + dia.tabua.length, PARES_ESPERADOS[i] + "/" + FICHAS_ESPERADAS[i]);
                conferir(nome + "tem dica em texto e meta entre 1 e as casas (" + dia.meta + " de " + casasDoTexto(dia, "C").length + ")", typeof dia.dica === "string" && dia.dica.length > 10 && dia.meta >= 1 && dia.meta <= casasDoTexto(dia, "C").length);

            conferirIgual("[BOTÕES] Erguer escolhe a ferramenta e fica aria-pressed", ferramenta + " " + pressionado("erguer") + "/" + pressionado("cavar"), "erguer true/false");
            clicarEAnotar("aplicar");
            conferirIgual("[BOTÕES] Aplicar ergue (4, 3): altura 1 → 2, estoque 0, jogadas 1", alturas[3][4] + "/" + estadoAtual.blocos + "/" + jogadas, "2/0/1");
            clicarEAnotar("reiniciar");
            conferirIgual("[BOTÕES] Refazer volta ao terreno do dia, ao estoque e a 0 jogadas", primeiraDiferenca(alturas, alturasDoTexto(DIAS[0])) + "/" + estadoAtual.blocos + "/" + jogadas, "/1/0");
            clicarEAnotar("avancar");
            conferirIgual("[BOTÕES] Maré libera a maré (mare/enchente)", fase + "/" + faseDaMare, "mare/enchente");
            esperarAMare();
            desenharVerdadeiro();
            conferirIgual("[BOTÕES] o dia 1 sem jogar acaba perdido, e o botão segue dizendo Maré", fase + "/" + botaoDaMare.textContent, "fim/Maré");
            clicarEAnotar("avancar");
            conferirIgual("[BOTÕES] Maré num dia perdido não troca de dia", indiceDoDia, 0);
            clicarEAnotar("reiniciar");
            conferirIgual("[BOTÕES] Refazer recomeça o dia perdido", fase + "/" + jogadas, "ler/0");
            cursor = { x: 3, y: 6 };
            clicarEAnotar("aplicar");
            clicarEAnotar("avancar");
            esperarAMare();
            desenharVerdadeiro();
            conferirIgual("[BOTÕES] o dia 1 vencido: o botão diz Próximo", fase + "/" + botaoDaMare.textContent, "fim/Próximo");
            clicarEAnotar("avancar");
            conferirIgual("[BOTÕES] Próximo abre o dia 2", indiceDoDia + "/" + fase, "1/ler");
            prepararDia(4);
            clicarEAnotar("avancar");
            esperarAMare();
            desenharVerdadeiro();
            conferirIgual("[BOTÕES] no dia 5, depois da 1ª maré o botão diz Seguir", fase + "/" + botaoDaMare.textContent, "contar/Seguir");
            clicarEAnotar("avancar");
            desenharVerdadeiro();
            conferirIgual("[BOTÕES] Seguir chama a ficha 2 e o botão volta a dizer Maré", indiceDaMare + "/" + fase + "/" + botaoDaMare.textContent, "1/ler/Maré");
            prepararDia(0);

            semearSorteio(4403);
            const partidas = [{ x: 0, y: 0 }, { x: 9, y: 9 }, { x: 0, y: 9 }, { x: 9, y: 0 }];
            for (let i = 0; i < 16; i++) partidas.push({ x: sorteio(TAMANHO), y: sorteio(TAMANHO) });
            rodarNosQuatroGiros(function (giro) {
                let erros = 0, primeiro = null, paradas = 0, continuouMarcada = 0;
                partidas.forEach(function (partida) {
                    SETAS_DA_TELA.forEach(function (seta) {
                        cursor = { x: partida.x, y: partida.y };
                        marcada = true;
                        clicarEAnotar(seta[0]);
                        const centro = girarComTamanho(partida.x + 0.5, partida.y + 0.5, giro, TAMANHO);
                        const alvo = casaDoCentroGiradoNoApoio(centro[0] + seta[1], centro[1] + seta[2], giro, TAMANHO);
                        if (!alvo) paradas++;
                        const esperada = alvo || partida;
                        if (cursor.x !== esperada.x || cursor.y !== esperada.y) {
                            erros++;
                            if (primeiro === null) primeiro = seta[0] + " a partir de (" + partida.x + "," + partida.y + "): foi para (" + cursor.x + "," + cursor.y + "), esperado (" + esperada.x + "," + esperada.y + ")";
                        }
                        if (marcada) continuouMarcada++;
                    });
                });
                conferir("[BOTÕES] giro " + giro * 90 + "°: " + partidas.length * 4 + " cliques nas setas andam uma casa pela tela (ou ficam na borda: " + paradas + ")", erros === 0 && paradas > 0, primeiro);
                conferirIgual("[BOTÕES] giro " + giro * 90 + "°: mexer o cursor desmarca", continuouMarcada, 0);
            });

            clicarEAnotar("girarDireita");
            conferirIgual("[BOTÕES] ⟳ gira 90°", rotacao, 1);
            clicarEAnotar("girarEsquerda");
            clicarEAnotar("girarEsquerda");
            conferirIgual("[BOTÕES] ⟲ duas vezes: 270°", rotacao, 3);
            irParaOGiro(0);
            clicarEAnotar("aproximar");
            conferirIgual("[BOTÕES] Perto aproxima", camera.zoom, 1.5);
            clicarEAnotar("afastar");
            conferirIgual("[BOTÕES] Longe afasta", camera.zoom, 1);
            clicarEAnotar("alternarVer");
            conferirIgual("[BOTÕES] Ver liga o H", depuracaoLigada, true);
            clicarEAnotar("alternarVer");
            conferirIgual("[BOTÕES] e outro clique desliga", depuracaoLigada, false);

            conferirIgual("[BOTÕES] nenhum botão ficou sem teste: as ações da página = as clicadas", acoesDosBotoes().sort().join(" "), Array.from(clicadas).sort().join(" "));
            prepararDia(0);
        });

        function clicar(acao) {
            return clicarNoBotao(acao);
        }

        testar("[FIM] sem erro de console e com o jogo e os dados como estavam", function () {
            prepararDia(0);
            conferirIgual("[FIM] a carga não registrou console.error", errosNaCarga.join(" | "), "");
            conferirIgual("[FIM] nenhum console.error sobrou além dos esperados", errosDeConsole.join(" | "), "");
            conferirIgual("[FIM] DIAS não foi editado (nem o robô, nem os defeitos plantados em cópias)", JSON.stringify(DIAS), DIAS_ORIGINAIS);
            conferirIgual("[FIM] o giro final é 0 e a câmera é a inicial", rotacao + "/" + camera.zoom + "/" + camera.desvioX + "/" + camera.desvioY, "0/1/0/0");
            conferir("[FIM] o laço segue vivo", avancarQuadro(16));
        });

        finalizar();
    </script>
</body>

</html>
