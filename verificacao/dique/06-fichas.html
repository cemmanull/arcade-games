<body>
    <h1>Teste — Dique, passo 6: as fichas</h1>
    <pre id="resultado"></pre>

    <script src="../apoio.js"></script>
    <script src="apoio-dique.js"></script>

    <!-- O esqueleto do passo (o miolo do <body> do index.html): o script dele procura estes ids. A mesma marcação vai para o iframe do layout.
         Na página o canvas começa com 1×1: quem o dimensiona é o script. -->
    <script>
        const MARCACAO_DO_PASSO = '<h1>Dique</h1>'
            + '<canvas id="jogo" width="384" height="252">Seu navegador não suporta canvas.</canvas>'
            + '<p id="painel"></p>'
            + '<p id="tabua" title="Tábua de marés"></p>'
            + '<div id="ferramentas">'
            + '<button type="button" data-acao="escolherErguer" data-ferramenta="erguer" aria-pressed="true" aria-label="Ferramenta Erguer: sobe a casa um degrau e gasta um bloco (1)">Erguer</button>'
            + '<button type="button" data-acao="escolherCavar" data-ferramenta="cavar" aria-pressed="false" aria-label="Ferramenta Cavar: desce a casa um degrau e devolve um bloco (2)">Cavar</button>'
            + '<button type="button" data-acao="aplicar" aria-label="Aplicar a ferramenta na casa marcada (Enter ou Espaço)">Aplicar</button>'
            + '<button type="button" data-acao="desfazer" aria-label="Desfazer a última jogada (Z)">Desfazer</button>'
            + '<button type="button" data-acao="avancar" aria-label="Liberar a maré; depois que ela passa, chamar a próxima ficha (M)">Maré</button>'
            + '<button type="button" data-acao="reiniciar" aria-label="Recomeçar o dia (N)">Refazer</button>'
            + '</div>'
            + '<div id="botoes">'
            + '<button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>'
            + '<button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>'
            + '<button type="button" data-acao="afastar" aria-label="Longe: afastar o mapa (−)">Longe</button>'
            + '<button type="button" data-acao="aproximar" aria-label="Perto: aproximar o mapa (+)">Perto</button>'
            + '<button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>'
            + '</div>'
            + '<div id="setas">'
            + '<button type="button" data-acao="cursorParaEsquerda" aria-label="Mover o cursor para a esquerda (seta)">←</button>'
            + '<button type="button" data-acao="cursorParaCima" aria-label="Mover o cursor para cima (seta)">↑</button>'
            + '<button type="button" data-acao="cursorParaBaixo" aria-label="Mover o cursor para baixo (seta)">↓</button>'
            + '<button type="button" data-acao="cursorParaDireita" aria-label="Mover o cursor para a direita (seta)">→</button>'
            + '</div>'
            + '<p id="aviso" role="status"></p>'
            + '<pre id="leitura" aria-live="off"></pre>';
        document.body.insertAdjacentHTML("beforeend", MARCACAO_DO_PASSO.replace('width="384" height="252"', 'width="1" height="1"'));
    </script>

    <!-- Guarda os console.error (o mapa inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/06-fichas/regras.js"></script>
    <script src="../../dique/06-fichas/script.js"></script>

    <script>
        const errosNaCarga = errosDeConsole.slice();
        const ALTURAS_ORIGINAIS = JSON.stringify(ALTURAS_INICIAIS);
        const MAR = matrizDoMar(ALTURAS_EM_TEXTO);
        const FONTES_DO_MAR = fontesDoMar(MAR);
        const SETAS_DA_TELA = [["cursorParaEsquerda", -1, 0], ["cursorParaCima", 0, -1], ["cursorParaBaixo", 0, 1], ["cursorParaDireita", 1, 0]];

        // Os números do GDD e do GUIA, escritos aqui de propósito (não lidos do jogo).
        const BONUS_DA_CHUVA_ESPERADO = 2, NIVEL_DA_NASCENTE_ESPERADO = 1, NIVEL_DA_BAIXA_MAR_ESPERADO = 1, META_ESPERADA = 2, BLOCOS_INICIAIS_ESPERADOS = 0;
        const BASE_DAS_MAQUINAS = {                       // GDD 4.5
            dia: { ler: ["moldar"], moldar: ["mare"], mare: ["contar"], contar: ["ler", "fim"], fim: [] },
            mare: { baixa: ["enchente"], enchente: ["preamar"], preamar: ["vazante"], vazante: ["baixa"] },
        };
        const ALVO_DO_REINICIAR = { dia: "ler", mare: "baixa" };

        // ------------------------------------------------------------
        // Ajudantes de entrada, de estado e de conta
        // ------------------------------------------------------------
        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(0);
            }
        }

        function definirCamera(zoom, desvioX, desvioY) {
            camera.zoom = zoom;
            camera.desvioX = desvioX;
            camera.desvioY = desvioY;
            limitarCamera();
        }

        function casasComObjeto(simbolo) {
            const casas = [];
            OBJETOS_EM_TEXTO.forEach(function (linha, y) { linha.split("").forEach(function (objeto, x) { if (objeto === simbolo) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        const CASAS_DO_TEXTO = casasComObjeto("C"), NASCENTES_DO_TEXTO = casasComObjeto("N");

        function volumeDoPassoEsperado(ficha) {
            return ficha.volume + (ficha.chuva ? BONUS_DA_CHUVA_ESPERADO : 0);
        }

        /* A água depois de `passos` passos, pela minha conta: o mar enche com nível e volume (como no passo 5); na chuva, as nascentes
           alagam à parte, sem volume, o que alcançam no nível 1; as duas águas se juntam casa a casa. */
        function aguaEsperada(terreno, ficha, passos, nascentes) {
            const mar = encherPelaMinhaConta(terreno, ficha.nivel, FONTES_DO_MAR, passos * volumeDoPassoEsperado(ficha)).alagado;
            return ficha.chuva ? uniaoDeMatrizes(mar, alagarPorPontoFixo(terreno, NIVEL_DA_NASCENTE_ESPERADO, nascentes || NASCENTES_DO_TEXTO)) : mar;
        }

        function niveisEsperados(terreno, ficha, passos, nascentes) {   // o nível de cada casa molhada: o maior entre as águas que a alcançam
            const mar = encherPelaMinhaConta(terreno, ficha.nivel, FONTES_DO_MAR, passos * volumeDoPassoEsperado(ficha)).alagado;
            const doNascente = ficha.chuva ? alagarPorPontoFixo(terreno, NIVEL_DA_NASCENTE_ESPERADO, nascentes || NASCENTES_DO_TEXTO) : matrizDeValor(terreno.length, false);
            return mar.map(function (linha, y) { return linha.map(function (molhada, x) { return molhada ? ficha.nivel : (doNascente[y][x] ? NIVEL_DA_NASCENTE_ESPERADO : 0); }); });
        }

        function casasPerdidasPelaMinhaConta(alagado) {
            return CASAS_DO_TEXTO.filter(function (casa) { return alagado[casa.y][casa.x]; }).length;
        }

        function somaDoTerreno(terreno) {
            return terreno.reduce(function (soma, linha) { return soma + linha.reduce(function (parcial, altura) { return parcial + altura; }, 0); }, 0);
        }

        function quadrosDe(duracao) {                     // quadros de 16 ms que a espera pede (o jogo zera o relógio ao esperar)
            return Math.ceil(duracao / 0.016 - 1e-9);
        }

        function congelarDeVez(valor) {
            if (valor !== null && typeof valor === "object" && !Object.isFrozen(valor)) {
                Object.freeze(valor);
                Object.keys(valor).forEach(function (chave) { congelarDeVez(valor[chave]); });
            }
            return valor;
        }

        // O relógio falso não precisa pintar 100 casas por quadro (o dia inteiro são ~1.700 quadros): o desenho vira nada, e os casos que
        // leem o que o desenho escreve no DOM (faixa, painel, botão) ou espiam o canvas chamam desenharVerdadeiro().
        const desenharVerdadeiro = desenhar;
        desenhar = function () { };

        // ------------------------------------------------------------
        // O vigia das máquinas: irPara é o único caminho das tabelas; qualquer mudança de fase que ele não explique é um desvio
        // ------------------------------------------------------------
        const chamadasDeIrPara = [];
        const irParaVerdadeira = irPara;
        irPara = function (maquina, destino) {
            const de = maquina === "dia" ? fase : faseDaMare;
            const mudou = irParaVerdadeira(maquina, destino);
            chamadasDeIrPara.push({ maquina: maquina, de: de, para: destino, mudou: mudou });
            return mudou;
        };

        const vigia = { dia: fase, mare: faseDaMare, chamadasLidas: chamadasDeIrPara.length, mudancas: [] };

        function olharAsMaquinas(motivo) {
            [["dia", fase], ["mare", faseDaMare]].forEach(function (par) {
                const maquina = par[0], agora = par[1];
                let atual = vigia[maquina];
                chamadasDeIrPara.slice(vigia.chamadasLidas).filter(function (chamada) { return chamada.maquina === maquina && chamada.mudou; }).forEach(function (chamada) {
                    if (chamada.de !== atual) { vigia.mudancas.push({ maquina: maquina, de: atual, para: chamada.de, via: "direto", motivo: motivo }); atual = chamada.de; }
                    vigia.mudancas.push({ maquina: maquina, de: atual, para: chamada.para, via: "irPara", motivo: motivo });
                    atual = chamada.para;
                });
                if (atual !== agora) vigia.mudancas.push({ maquina: maquina, de: atual, para: agora, via: "direto", motivo: motivo });
                vigia[maquina] = agora;
            });
            vigia.chamadasLidas = chamadasDeIrPara.length;
        }

        function apertarTecla(tecla, modificadores) {
            const evento = new KeyboardEvent("keydown", Object.assign({ key: tecla, cancelable: true, bubbles: true }, modificadores || {}));
            document.dispatchEvent(evento);
            olharAsMaquinas("tecla " + tecla);
            return evento;
        }

        function quadro(vezes) {
            for (let i = 0; i < (vezes || 1); i++) { avancarQuadro(16); olharAsMaquinas("quadro"); }
        }

        function clicar(acao) {
            const existe = clicarNoBotao(acao);
            olharAsMaquinas("clique " + acao);
            return existe;
        }

        function avancarAte(condicao, limiteDeQuadros) {  // quadros até a condição valer; -1 se passar do limite
            let quadros = 0;
            while (!condicao() && quadros < limiteDeQuadros) { quadro(); quadros++; }
            return condicao() ? quadros : -1;
        }

        function voltarAoComeco() {                       // o que o Refazer não limpa (giro, câmera, cursor, H, ferramenta) e, por último, o botão Refazer do jogo
            if (depuracaoLigada) apertarTecla("h");
            escolherFerramenta("erguer");
            rotacao = 0;
            definirCamera(1, 0, 0);
            cursor = { x: 4, y: 4 };
            marcada = false;
            ponteiro = null;
            dedo = null;
            giroDaRoda = 0;
            reiniciar();                                  // por último: o aviso fica sendo o da 1ª ficha
            olharAsMaquinas("reiniciar");
            irParaOGiro(0);
        }

        function fotoDoEstado() {
            return JSON.stringify({ alturas: alturas, blocos: estadoAtual.blocos });
        }

        function lerATabua() {                            // o texto da faixa → uma lista de fichas lidas
            const fichas = [];
            const leitor = /(\[)?n(\d+) (\d+)×(\d+) \+(\d+)( ☂)?(\])?/g;
            let achado;
            while ((achado = leitor.exec(tabua.textContent)) !== null) {
                fichas.push({ atual: achado[1] === "[", nivel: Number(achado[2]), passos: Number(achado[3]), volume: Number(achado[4]), blocos: Number(achado[5]), chuva: achado[6] !== undefined });
            }
            return fichas;
        }

        // ------------------------------------------------------------
        // Jogar o dia inteiro pelo relógio falso, conferindo cada instante contra a tábua e a minha conta de água
        // ------------------------------------------------------------
        /* plano[i] = jogadas da maré i: [ferramenta, x, y]. Devolve o que aconteceu; os desvios vão em `problemas`. */
        function jogarODia(plano, rotulo) {
            voltarAoComeco();
            const resumo = { problemas: [], blocosNoComeco: [], perdidasAcumuladas: [], terraNoMundo: [], passos: 0, fim: null };
            const registrar = function (texto) { resumo.problemas.push(rotulo + ": " + texto); };
            const dentroDe = function (obtido, esperado, nome) { if (obtido < 0 || Math.abs(obtido - esperado) > 1) registrar(nome + " levou " + obtido + " quadros, esperado " + esperado + " ±1"); };
            let perdidasEsperadas = matrizDeValor(TAMANHO, false);
            let blocosEsperados = BLOCOS_INICIAIS_ESPERADOS;
            const terraDoMapa = somaDoTerreno(JSON.parse(ALTURAS_ORIGINAIS));
            let terraEsperada = terraDoMapa;

            TABUA_DE_MARES.forEach(function (ficha, i) {
                if (resumo.problemas.length > 12) return;
                blocosEsperados += ficha.blocos;
                terraEsperada += ficha.blocos;
                const nome = "maré " + (i + 1);
                if (fase !== "ler" || faseDaMare !== "baixa" || indiceDaMare !== i || passoDaMare !== 0) registrar(nome + ": começo em " + fase + "/" + faseDaMare + "/" + indiceDaMare + "/" + passoDaMare);
                if (estadoAtual.blocos !== blocosEsperados) registrar(nome + ": estoque " + estadoAtual.blocos + ", esperado " + blocosEsperados + " (o que sobrou + os blocos da ficha)");
                resumo.blocosNoComeco.push(estadoAtual.blocos);
                desenharVerdadeiro();                         // a faixa e o painel só mudam no desenho: pinta sem passar o relógio
                if (blocosNoMundo(estadoAtual) !== terraEsperada) registrar(nome + ": a terra do mundo é " + blocosNoMundo(estadoAtual) + ", esperada " + terraEsperada);
                if (primeiraDiferenca(agua.alagado, alagarPorPontoFixo(alturas, NIVEL_DA_BAIXA_MAR_ESPERADO, FONTES_DO_MAR))) registrar(nome + ": a água de baixa-mar não é o ponto fixo do nível 1");
                const faixa = lerATabua();
                if (faixa.length !== TABUA_DE_MARES.length || faixa.some(function (lida, j) {
                    const f = TABUA_DE_MARES[j];
                    return lida.nivel !== f.nivel || lida.passos !== f.passos || lida.volume !== volumeDoPassoEsperado(f) || lida.blocos !== f.blocos || lida.chuva !== f.chuva || lida.atual !== (j === i);
                })) registrar(nome + ": a faixa da tábua não bate com as fichas e o volume real por passo (" + tabua.textContent + ")");
                const anuncio = "Maré " + (i + 1) + " de " + TABUA_DE_MARES.length;
                if (aviso.textContent.indexOf(anuncio) !== 0 || aviso.textContent.indexOf(ficha.passos + " passos de " + volumeDoPassoEsperado(ficha) + " casas") === -1) registrar(nome + ": o aviso da ficha: " + aviso.textContent);

                dentroDe(avancarAte(function () { return fase === "moldar"; }, 400), quadrosDe(TEMPO_DE_LEITURA), nome + ": a leitura");
                (plano[i] || []).forEach(function (jogada) {
                    cursor = { x: jogada[1], y: jogada[2] };
                    apertarTecla(jogada[0] === "erguer" ? "1" : "2");
                    const antes = fotoDoEstado();
                    apertarTecla("Enter");
                    if (fotoDoEstado() === antes) registrar(nome + ": a jogada " + jogada + " foi recusada: " + aviso.textContent);
                    blocosEsperados += jogada[0] === "erguer" ? -1 : 1;
                });
                if (estadoAtual.blocos !== blocosEsperados) registrar(nome + ": depois de moldar o estoque é " + estadoAtual.blocos + ", esperado " + blocosEsperados + " (erguer gasta um, cavar devolve um)");
                if (blocosNoMundo(estadoAtual) !== terraEsperada) registrar(nome + ": depois de moldar, a terra do mundo é " + blocosNoMundo(estadoAtual) + ", esperada " + terraEsperada);
                const terreno = JSON.parse(JSON.stringify(alturas));

                quadro(40);                                   // o jogador pensa 0,64 s em 'moldar': o relógio da fase corre, e liberar a maré tem de zerá-lo
                apertarTecla("m");
                if (fase !== "mare" || faseDaMare !== "enchente" || passoDaMare !== 0) registrar(nome + ": M não liberou a maré (" + fase + "/" + faseDaMare + "/" + passoDaMare + ")");
                const nivelDaMare = ficha.nivel;
                const noPasso0 = casasDaMatriz(agua.alagado);
                if (FONTES_DO_MAR.some(function (casa) { return !agua.alagado[casa.y][casa.x]; })) registrar(nome + ": no passo 0 o mar não está todo molhado");
                if (primeiraDiferenca(uniaoDeMatrizes(agua.alagado, aguaEsperada(terreno, ficha, ficha.passos)), aguaEsperada(terreno, ficha, ficha.passos))) registrar(nome + ": no passo 0 há água que a maré cheia não tem");
                if (noPasso0.length === 0) registrar(nome + ": no passo 0 não há água nenhuma");

                for (let k = 1; k <= ficha.passos; k++) {
                    dentroDe(avancarAte(function () { return passoDaMare === k; }, 300), quadrosDe(PASSO_DA_MARE), nome + ": o passo " + k + " da enchente");
                    const diferenca = primeiraDiferenca(agua.alagado, aguaEsperada(terreno, ficha, k));
                    if (diferenca) registrar(nome + ": a água do passo " + k + " (volume " + k * volumeDoPassoEsperado(ficha) + ") não é a minha conta " + diferenca);
                    if (faseDaMare !== (k === ficha.passos ? "preamar" : "enchente")) registrar(nome + ": passo " + k + " na fase " + faseDaMare);
                    if (fase !== "mare") registrar(nome + ": o dia saiu de 'mare' no passo " + k + " (" + fase + ")");
                    resumo.passos++;
                }
                dentroDe(avancarAte(function () { return fase === "contar"; }, 400), quadrosDe(PAUSA_NA_PREAMAR), nome + ": a pausa na preamar");
                perdidasEsperadas = uniaoDeMatrizes(perdidasEsperadas, aguaEsperada(terreno, ficha, ficha.passos));
                if (faseDaMare !== "vazante") registrar(nome + ": depois da preamar a maré devia estar em vazante (" + faseDaMare + ")");
                if (primeiraDiferenca(perdidas, perdidasEsperadas)) registrar(nome + ": as casas perdidas não são a união das marés até aqui " + primeiraDiferenca(perdidas, perdidasEsperadas));
                const perdidasAteAgora = casasPerdidasPelaMinhaConta(perdidasEsperadas);
                if (aviso.textContent.indexOf("Preamar: " + perdidasAteAgora + " casas perdidas até agora") !== 0) registrar(nome + ": o aviso da preamar: " + aviso.textContent);
                resumo.perdidasAcumuladas.push(perdidasAteAgora);

                for (let k = ficha.passos - 1; k >= 0; k--) {
                    dentroDe(avancarAte(function () { return passoDaMare === k; }, 300), quadrosDe(PASSO_DA_MARE / 2), nome + ": o passo " + k + " da vazante");
                    const esperada = k >= 1 ? aguaEsperada(terreno, ficha, k) : alagarPorPontoFixo(terreno, NIVEL_DA_BAIXA_MAR_ESPERADO, FONTES_DO_MAR);
                    const diferenca = primeiraDiferenca(agua.alagado, esperada);
                    if (diferenca) registrar(nome + ": a água do passo " + k + " da vazante não é a esperada " + diferenca);
                    if (k >= 1 && faseDaMare !== "vazante") registrar(nome + ": vazante passo " + k + " na fase " + faseDaMare);
                }
                if (faseDaMare !== "baixa") registrar(nome + ": a vazante terminou fora da baixa-mar (" + faseDaMare + ")");
                if (primeiraDiferenca(perdidas, perdidasEsperadas)) registrar(nome + ": a vazante mexeu nas casas perdidas");
                desenharVerdadeiro();
                resumo.terraNoMundo.push(blocosNoMundo(estadoAtual));

                if (i < TABUA_DE_MARES.length - 1) {
                    const salvas = TOTAL_DE_CASAS - perdidasAteAgora;
                    if (fase !== "contar") registrar(nome + ": esperava 'contar' à espera do M (" + fase + ")");
                    if (aviso.textContent.indexOf("Maré " + (i + 1) + " passou, " + salvas + " casas a salvo") !== 0) registrar(nome + ": o aviso da vazante: " + aviso.textContent);
                    if (botaoDaMare.textContent !== "Seguir") registrar(nome + ": o botão devia dizer Seguir (" + botaoDaMare.textContent + ")");
                    apertarTecla("m");
                    if (indiceDaMare !== i + 1 || fase !== "ler") registrar(nome + ": M não chamou a próxima ficha (" + indiceDaMare + "/" + fase + ")");
                    if (historico.length !== 0) registrar(nome + ": a história de desfazer devia recomeçar");
                } else {
                    const salvas = TOTAL_DE_CASAS - perdidasAteAgora;
                    const veredito = salvas >= META_ESPERADA ? "vencido" : "perdido";
                    resumo.fim = { fase: fase, salvas: salvas, veredito: veredito };
                    if (fase !== "fim") registrar(nome + ": depois da última vazante o dia devia estar em 'fim' (" + fase + ")");
                    if (aviso.textContent.indexOf("Dia " + veredito + ": " + salvas + " de " + TOTAL_DE_CASAS + " casas salvas, meta " + META_ESPERADA) !== 0) registrar("o aviso do fim: " + aviso.textContent);
                    if (painel.textContent.indexOf("Dia " + veredito) !== 0 || painel.textContent.indexOf("salvas " + salvas + "/" + TOTAL_DE_CASAS) === -1) registrar("o painel do fim: " + painel.textContent);
                }
            });
            return resumo;
        }

        const TOTAL_DE_CASAS = 3;

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("a tábua é dado: fichas completas, volume real por passo (chuva soma 2), nascente do texto, mapa válido", function () {
            conferirIgual("o mapa de verdade é válido", MAPA_VALIDO, true);
            conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
            conferir("há fichas na tábua (" + TABUA_DE_MARES.length + ")", TABUA_DE_MARES.length >= 3);
            conferir("toda ficha traz nível, passos, volume, chuva e blocos", TABUA_DE_MARES.every(function (ficha) {

                const nome = mudanca.maquina + " " + mudanca.de + "→" + mudanca.para + " (" + mudanca.motivo + ", " + mudanca.via + ")";
                if (TRANSICOES[mudanca.maquina][mudanca.de] === undefined || TRANSICOES[mudanca.maquina][mudanca.de].indexOf(mudanca.para) === -1) problemas.push("fora da tabela: " + nome);
                else if (BASE_DAS_MAQUINAS[mudanca.maquina][mudanca.de].indexOf(mudanca.para) === -1 && mudanca.para !== ALVO_DO_REINICIAR[mudanca.maquina]) problemas.push("não é do GDD nem reiniciar: " + nome);

            chamadasDeIrPara.forEach(function (chamada) {

        });

        testar("cada botão [data-acao] responde a um clique de verdade: ferramentas, aplicar, desfazer, Maré/Seguir, refazer, giro, zoom, ver e as 4 setas (pela TELA, nos 4 giros)", function () {

            const clicadas = new Set();
            function clicarEAnotar(acao) {                  // só a primeira vez de cada ação vira linha de resultado
                const existe = clicar(acao);
                if (!clicadas.has(acao) || !existe) conferir("o botão " + acao + " existe e recebe o clique", existe);
                clicadas.add(acao);
            }
            function pressionado(ferramentaDoBotao) {
                return document.querySelector('[data-ferramenta="' + ferramentaDoBotao + '"]').getAttribute("aria-pressed");

            cursor = { x: 4, y: 3 };

            clicarEAnotar("aplicar");
            conferirIgual("Aplicar cava (4,3): altura 1 → 0", alturas[3][4], 0);
            conferirIgual("e devolve um bloco (1 + 1)", estadoAtual.blocos, 2);
            clicarEAnotar("desfazer");
            conferirIgual("Desfazer devolve a altura 1", alturas[3][4], 1);
            conferirIgual("e o estoque 1", estadoAtual.blocos, 1);
            clicarEAnotar("escolherErguer");
            conferirIgual("Erguer escolhe a ferramenta", ferramenta, "erguer");
            conferirIgual("Erguer fica aria-pressed", pressionado("erguer") + "/" + pressionado("cavar"), "true/false");
            clicarEAnotar("aplicar");
            conferirIgual("Aplicar ergue (4,3): altura 1 → 2", alturas[3][4], 2);
            conferirIgual("e gasta o bloco (0)", estadoAtual.blocos, 0);
            clicarEAnotar("reiniciar");
            conferirIgual("Refazer volta ao terreno original", JSON.stringify(alturas), ALTURAS_ORIGINAIS);
            conferirIgual("e ao estoque da 1ª ficha", estadoAtual.blocos, 1);
            clicarEAnotar("avancar");
            conferirIgual("Maré libera a maré (fase 'mare', enchente)", fase + "/" + faseDaMare, "mare/enchente");
            avancarAte(function () { return fase === "contar" && faseDaMare === "baixa"; }, 2000);
            desenharVerdadeiro();
            conferirIgual("depois da maré o botão diz Seguir", botaoDaMare.textContent, "Seguir");
            clicarEAnotar("avancar");
            conferirIgual("Seguir chama a próxima ficha", indiceDaMare + "/" + fase, "1/ler");
            desenharVerdadeiro();
            conferirIgual("e o botão volta a dizer Maré", botaoDaMare.textContent, "Maré");
            clicarEAnotar("reiniciar");
            conferirIgual("Refazer volta de dentro do dia à 1ª ficha", indiceDaMare + "/" + fase, "0/ler");

            semearSorteio(4403);
            const partidas = [{ x: 0, y: 0 }, { x: 9, y: 9 }, { x: 0, y: 9 }, { x: 9, y: 0 }];
            for (let i = 0; i < 16; i++) partidas.push({ x: Math.floor(Math.random() * TAMANHO), y: Math.floor(Math.random() * TAMANHO) });
            rodarNosQuatroGiros(function (giro) {
                let erros = 0, primeiro = null, paradas = 0, continuouMarcada = 0;
                partidas.forEach(function (partida) {
                    SETAS_DA_TELA.forEach(function (seta) {
                        cursor = { x: partida.x, y: partida.y };
                        marcada = true;
                        clicarEAnotar(seta[0]);
                        const centro = girarComTamanho(partida.x + 0.5, partida.y + 0.5, giro, TAMANHO);
                        const alvo = casaDoCentroGiradoNoApoio(centro[0] + seta[1], centro[1] + seta[2], giro, TAMANHO);
                        if (!alvo) paradas++;
                        const esperada = alvo || partida;
                        if (cursor.x !== esperada.x || cursor.y !== esperada.y) {
                            erros++;
                            if (primeiro === null) primeiro = seta[0] + " a partir de (" + partida.x + "," + partida.y + "): foi para (" + cursor.x + "," + cursor.y + "), esperado (" + esperada.x + "," + esperada.y + ")";
                        }
                        if (marcada) continuouMarcada++;
                    });
                });
                conferir("giro " + giro * 90 + "°: " + partidas.length * 4 + " cliques nas setas andam uma casa pela tela (ou ficam na borda: " + paradas + ")", erros === 0 && paradas > 0, primeiro);
                conferirIgual("giro " + giro * 90 + "°: mexer o cursor desmarca", continuouMarcada, 0);
            });

            clicarEAnotar("girarDireita");
            conferirIgual("⟳ gira 90°", rotacao, 1);
            clicarEAnotar("girarEsquerda");
            clicarEAnotar("girarEsquerda");
            conferirIgual("⟲ duas vezes: 270°", rotacao, 3);
            irParaOGiro(0);
            clicarEAnotar("aproximar");
            conferirIgual("Perto aproxima", camera.zoom, 1.5);
            clicarEAnotar("afastar");
            conferirIgual("Longe afasta", camera.zoom, 1);
            clicarEAnotar("alternarVer");
            conferirIgual("Ver liga o H", depuracaoLigada, true);
            clicarEAnotar("alternarVer");
            conferirIgual("e outro clique desliga", depuracaoLigada, false);

            conferirIgual("nenhum botão ficou sem teste: as ações da página = as clicadas", acoesDosBotoes().sort().join(" "), Array.from(clicadas).sort().join(" "));
            voltarAoComeco();
        });

        testar("ÁGUA COM PAREDE (mar e chuva): onde a água se ergue sobre uma vizinha da frente mais baixa, seca ou com água mais baixa, uma parede translúcida desce; nos outros lados, nenhuma", function () {
            voltarAoComeco();
            const nascentesGuardadas = NASCENTES.slice();
            let esperadasNoTotal = 0, faltando = [], sobrando = [], curtas = [], quadros = 0;
            function conferirAgua(rotulo, terreno, ficha, passos, giro) {
                const alagado = aguaEsperada(terreno, ficha, passos, NASCENTES), niveis = niveisEsperados(terreno, ficha, passos, NASCENTES);
                definirAgua(ficha.nivel, casasDaMatriz(alagado).map(function (casa) { return { x: casa.x, y: casa.y, nivel: niveis[casa.y][casa.x] }; }));
                const resultado = conferirParedesDaAgua(rotulo, alagado, function (x, y) { return niveis[y][x]; }, giro, desenharVerdadeiro);
                quadros++;
                esperadasNoTotal += resultado.esperadas;
                faltando = faltando.concat(resultado.faltando);
                sobrando = sobrando.concat(resultado.sobrando);
                curtas = curtas.concat(resultado.curtas);
            }
            try {
                const fichaSeca = { nivel: 2, passos: 3, volume: 5, chuva: false, blocos: 0 }, fichaChuvosa = { nivel: 2, passos: 2, volume: 5, chuva: true, blocos: 0 };
                rodarNosQuatroGiros(function (giro) {
                    [1, 2, 3].forEach(function (passos) { conferirAgua("mapa seco passo " + passos + " giro " + giro * 90 + "°", alturas, fichaSeca, passos, giro); });
                    [1, 2].forEach(function (passos) { conferirAgua("mapa chuva passo " + passos + " giro " + giro * 90 + "°", alturas, fichaChuvosa, passos, giro); });
                });
                semearSorteio(1313);
                for (let sorteado = 0; sorteado < 8; sorteado++) {
                    const terreno = sortearTerrenoDaIlha(MAR, true), giro = sorteado % 4;
                    NASCENTES.splice(0, NASCENTES.length, ...sortearFontesNaTerra(2, MAR));
                    alturas = terreno;
                    irParaOGiro(giro);
                    conferirAgua("terreno " + sorteado + " seco giro " + giro * 90 + "°", terreno, { nivel: 2 + sorteado % 2, passos: 3, volume: 4, chuva: false, blocos: 0 }, 2, giro);
                    conferirAgua("terreno " + sorteado + " chuva giro " + giro * 90 + "°", terreno, { nivel: 2 + sorteado % 2, passos: 3, volume: 4, chuva: true, blocos: 0 }, 2, giro);
                }
                irParaOGiro(0);
            } finally {
                NASCENTES.splice(0, NASCENTES.length, ...nascentesGuardadas);
            }
            conferir("a amostra tem " + esperadasNoTotal + " paredes esperadas em " + quadros + " quadros", esperadasNoTotal > 200);
            conferir("toda parede esperada foi pintada (faltam " + faltando.length + ": " + faltando.slice(0, 3).join(" | ") + ")", faltando.length === 0);
            conferir("nenhuma parede onde a vizinha da frente é igual ou mais alta (sobram " + sobrando.length + ": " + sobrando.slice(0, 3).join(" | ") + ")", sobrando.length === 0);
            conferir("a parede desce do nível até a vizinha ou até o terreno da própria casa, o que for mais alto", curtas.length === 0, curtas.slice(0, 3).join(" | "));
            voltarAoComeco();
        });

        // ------------------------------------------------------------
        // O passo inteiro em iframes (apoio-dique.js): movimento reduzido e layout
        // ------------------------------------------------------------
        const ANTES_DO_MOVIMENTO_REDUZIDO = "window.matchMedia = function (consulta) { return { matches: /reduce/.test(consulta), media: consulta, addEventListener: function () {}, removeEventListener: function () {} }; };";

        async function conferirMovimentoReduzido() {
            const quadroDoJogo = await abrirPassoNoIframe("06-fichas", MARCACAO_DO_PASSO, ANTES_DO_MOVIMENTO_REDUZIDO, 390, 750);
            try {
                const janela = quadroDoJogo.contentWindow;
                pararODesenhoDaJanela(janela);
                const ler = function (expressao) { return janela.eval(expressao); };
                const estado = function () { return ler("fase") + "/" + ler("faseDaMare") + "/" + ler("passoDaMare") + "/" + ler("agua.alagado").reduce(function (soma, linha) { return soma + linha.filter(Boolean).length; }, 0); };
                conferirIgual("o iframe vê prefers-reduced-motion", ler("movimentoReduzido"), true);
                let instante = 16;
                darQuadro(janela, instante);
                instante += 16; darQuadro(janela, instante);
                conferir("antes do M a maré não começa sozinha (dia em '" + ler("fase") + "', maré em '" + ler("faseDaMare") + "')", (ler("fase") === "ler" || ler("fase") === "moldar") && ler("faseDaMare") === "baixa");
                const ficha = ler("TABUA_DE_MARES[0]");
                teclaNaJanela(janela, "m");
                const depoisDaPrimeira = estado();
                conferir("a primeira tecla M libera a maré e não a leva ao fim (" + depoisDaPrimeira + ")", ler("fase") === "mare" && ler("faseDaMare") === "enchente" && ler("passoDaMare") <= 1);
                instante = passarTempoNaJanela(janela, instante, 10);
                conferirIgual("10 s de quadros depois, a água não andou sozinha", estado(), depoisDaPrimeira);
                const passosVistos = [ler("passoDaMare")];
                let teclas = 1, problemas = [];
                while (!(ler("fase") === "contar" && ler("faseDaMare") === "baixa") && ler("fase") !== "fim" && teclas < 40) {
                    const antes = estado(), faseAntes = ler("faseDaMare"), passoAntes = ler("passoDaMare");
                    teclaNaJanela(janela, "m");
                    teclas++;
                    instante += 16; darQuadro(janela, instante);
                    const logoDepois = estado();
                    if (logoDepois === antes) problemas.push("a tecla " + teclas + " não fez nada (" + antes + ")");
                    if (faseAntes === "enchente" && ler("passoDaMare") !== passoAntes + 1) problemas.push("a tecla " + teclas + " na enchente devia dar um passo (" + passoAntes + " → " + ler("passoDaMare") + ")");
                    if (faseAntes === "enchente" && ler("passoDaMare") <= ficha.passos) {
                        const esperada = aguaEsperada(JSON.parse(ALTURAS_ORIGINAIS), ficha, ler("passoDaMare"));
                        const diferenca = primeiraDiferenca(ler("agua.alagado"), esperada);
                        if (diferenca) problemas.push("a água do passo " + ler("passoDaMare") + " não é a minha " + diferenca);
                    }
                    instante = passarTempoNaJanela(janela, instante, 1.5);
                    if (estado() !== logoDepois) problemas.push("1,5 s depois da tecla " + teclas + " a maré andou sozinha (" + logoDepois + " → " + estado() + ")");
                    passosVistos.push(ler("passoDaMare"));
                }
                conferir("cada tecla dá UM passo e a maré nunca anda sem tecla: " + problemas.slice(0, 3).join(" | "), problemas.length === 0);
                conferir("a maré só chega ao fim depois de várias teclas (" + teclas + "; passos vistos " + passosVistos.join(",") + ")", teclas >= ficha.passos + 2 && ler("fase") === "contar");
            } finally {
                quadroDoJogo.remove();
            }
        }

        const CONFIGURACAO_DO_LAYOUT = {
            pasta: "06-fichas",
            corpo: MARCACAO_DO_PASSO,
            quantidadeDeBotoes: 15,
            proporcaoDoCanvas: 384 / 252,
            mensagens: ["", "Zoom: perto", "Maré 1 passou, 3 casas a salvo. M chama a próxima ficha", "Vista girada para 270 graus. Casas escondidas: 2",
                "Maré 3 de 3: nível 2, 2 passos de 7 casas, com chuva, chegam 0 blocos",
                "Dia perdido: 1 de 3 casas salvas, meta 2. N recomeça. Marcada: casa 7, 7, altura 1, escondida atrás de um bloco"],
        };

        async function principal() {
            await testarNoIframe("movimento reduzido", conferirMovimentoReduzido);
            await testarNoIframe("layout 390×750", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 390, 750); });
            await testarNoIframe("layout 360×640", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 360, 640); });
            testar("sem erro de console e com o estado restaurado", function () {
                voltarAoComeco();
                conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
                conferirIgual("o terreno de partida nunca foi mexido", JSON.stringify(ALTURAS_INICIAIS), ALTURAS_ORIGINAIS);
                conferirIgual("a nascente do jogo voltou ao texto", textoDasCasas(NASCENTES), textoDasCasas(NASCENTES_DO_TEXTO));
                conferirIgual("o mar do jogo voltou ao texto", textoDasCasas(CASAS_DO_MAR), textoDasCasas(FONTES_DO_MAR));
                conferirIgual("o giro final é 0", rotacao, 0);
                conferirIgual("nenhum aviso de erro sobrou", errosDeConsole.join(" | "), "");
                conferir("o laço segue vivo", avancarQuadro(16));
            });
        }

        principal().finally(finalizar);
    </script>
