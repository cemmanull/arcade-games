<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Dique, passo 5: a enchente</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        #resultado { font-size: 14px; white-space: pre-wrap; }
    </style>
</head>

<body>
    <h1>Teste — Dique, passo 5: a enchente</h1>
    <pre id="resultado"></pre>

    <script src="../apoio.js"></script>
    <script src="apoio-dique.js"></script>

    <!-- O esqueleto do passo (o miolo do <body> do index.html): o script dele procura estes ids. A mesma marcação vai para o iframe do layout.
         Na página o canvas começa com 1×1: quem o dimensiona é o script. -->
    <script>
        // ESPELHO:inicio dique/05-enchente/index.html corpo
        const MARCACAO_DO_PASSO = '<h1>Dique</h1>'
            + '<canvas id="jogo" width="384" height="252">Seu navegador não suporta canvas.</canvas>'
            + '<p id="painel"></p>'
            + '<div id="ferramentas">'
            + '<button type="button" data-acao="escolherErguer" data-ferramenta="erguer" aria-pressed="true" aria-label="Ferramenta Erguer: sobe a casa um degrau e gasta um bloco (1)">Erguer</button>'
            + '<button type="button" data-acao="escolherCavar" data-ferramenta="cavar" aria-pressed="false" aria-label="Ferramenta Cavar: desce a casa um degrau e devolve um bloco (2)">Cavar</button>'
            + '<button type="button" data-acao="aplicar" aria-label="Aplicar a ferramenta na casa marcada (Enter ou Espaço)">Aplicar</button>'
            + '<button type="button" data-acao="desfazer" aria-label="Desfazer a última jogada (Z)">Desfazer</button>'
            + '<button type="button" data-acao="liberarMare" aria-label="Liberar a maré (M)">Maré</button>'
            + '<button type="button" data-acao="reiniciar" aria-label="Recomeçar o dia (N)">Refazer</button>'
            + '</div>'
            + '<div id="botoes">'
            + '<button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>'
            + '<button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>'
            + '<button type="button" data-acao="afastar" aria-label="Longe: afastar o mapa (−)">Longe</button>'
            + '<button type="button" data-acao="aproximar" aria-label="Perto: aproximar o mapa (+)">Perto</button>'
            + '<button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>'
            + '</div>'
            + '<div id="setas">'
            + '<button type="button" data-acao="cursorParaEsquerda" aria-label="Mover o cursor para a esquerda (seta)">←</button>'
            + '<button type="button" data-acao="cursorParaCima" aria-label="Mover o cursor para cima (seta)">↑</button>'
            + '<button type="button" data-acao="cursorParaBaixo" aria-label="Mover o cursor para baixo (seta)">↓</button>'
            + '<button type="button" data-acao="cursorParaDireita" aria-label="Mover o cursor para a direita (seta)">→</button>'
            + '</div>'
            + '<p id="aviso" role="status"></p>'
            + '<pre id="leitura" aria-live="off"></pre>'
            + '<p id="ajuda">1 Erguer · 2 Cavar · Z desfazer · M maré · N refazer · H ver a água</p>';
        // ESPELHO:fim
        document.body.insertAdjacentHTML("beforeend", MARCACAO_DO_PASSO.replace('width="384" height="252"', 'width="1" height="1"'));
    </script>

    <!-- Guarda os console.error (o mapa inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/05-enchente/regras.js"></script>
    <script src="../../dique/05-enchente/script.js"></script>

    <script>
        const errosNaCarga = errosDeConsole.slice();
        const ALTURAS_ORIGINAIS = JSON.stringify(ALTURAS_INICIAIS);
        const MAR = matrizDoMar(ALTURAS_EM_TEXTO);
        const FONTES_DO_MAR = fontesDoMar(MAR);
        const SETAS_DA_TELA = [["cursorParaEsquerda", -1, 0], ["cursorParaCima", 0, -1], ["cursorParaBaixo", 0, 1], ["cursorParaDireita", 1, 0]];

        // Os números do GDD e do GUIA, escritos aqui de propósito (não lidos do jogo).
        const NIVEL_DA_MARE_ESPERADO = 2, NIVEL_DA_BAIXA_MAR_ESPERADO = 1, VOLUME_ESPERADO = 17, BLOCOS_ESPERADOS = 1;

        // O relógio falso não precisa pintar 100 casas por quadro: o desenho vira nada, e os casos que leem o que ele escreve no DOM
        // (painel, leitura) ou espiam o canvas chamam desenharVerdadeiro().
        const desenharVerdadeiro = desenhar;
        desenhar = function () { };

        // ------------------------------------------------------------
        // Ajudantes de entrada e de estado
        // ------------------------------------------------------------
        function apertarTecla(tecla, modificadores) {
            const evento = new KeyboardEvent("keydown", Object.assign({ key: tecla, cancelable: true, bubbles: true }, modificadores || {}));
            document.dispatchEvent(evento);
            return evento;
        }

        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(0);
            }
        }

        function definirCamera(zoom, desvioX, desvioY) {
            camera.zoom = zoom;
            camera.desvioX = desvioX;
            camera.desvioY = desvioY;
            limitarCamera();
        }

        function voltarAoComeco() {                 // o botão Refazer do jogo, mais o que ele não limpa (giro, câmera, cursor, H)
            reiniciar();
            irParaOGiro(0);
            definirCamera(1, 0, 0);
            cursor = { x: 4, y: 4 };
            marcada = false;
            ponteiro = null;
            dedo = null;
            giroDaRoda = 0;
            if (depuracaoLigada) apertarTecla("h");
            escolherFerramenta("erguer");
            avisar("");
        }

        function fotoDoEstado() {
            return JSON.stringify({ alturas: alturas, blocos: estadoAtual.blocos });
        }

        function terraTotal() {                      // a terra que existe: o que está empilhado mais o estoque
            return alturas.reduce(function (soma, linha) { return soma + linha.reduce(function (parcial, altura) { return parcial + altura; }, 0); }, estadoAtual.blocos);
        }

        function casasComObjeto(simbolo) {
            const casas = [];
            OBJETOS_EM_TEXTO.forEach(function (linha, y) { linha.split("").forEach(function (objeto, x) { if (objeto === simbolo) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        function casasPerdidasPelaMinhaConta(alagado) {
            return casasComObjeto("C").filter(function (casa) { return alagado[casa.y][casa.x]; }).length;
        }

        function congelarDeVez(valor) {
            if (valor !== null && typeof valor === "object" && !Object.isFrozen(valor)) {
                Object.freeze(valor);
                Object.keys(valor).forEach(function (chave) { congelarDeVez(valor[chave]); });
            }
            return valor;
        }

        function estadoCom(blocos, jogadas) {        // parte do terreno de verdade e aplica jogadas [ferramenta, x, y]; null se alguma não vale
            let estado = { alturas: JSON.parse(ALTURAS_ORIGINAIS), blocos: blocos };
            for (let i = 0; i < jogadas.length; i++) {
                estado = moldar(estado, jogadas[i][0], jogadas[i][1], jogadas[i][2]);
                if (estado === null) return null;
            }
            return estado;
        }

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("o mapa, as constantes do GUIA e o estado de partida", function () {
            conferirIgual("o mapa de verdade é válido", MAPA_VALIDO, true);
            conferirIgual("o mapa tem 10×10", TAMANHO, 10);
            conferirIgual("a maré alcança o nível 2", NIVEL_DA_MARE, NIVEL_DA_MARE_ESPERADO);
            conferirIgual("a baixa-mar cobre o nível 1", NIVEL_DA_BAIXA_MAR, NIVEL_DA_BAIXA_MAR_ESPERADO);
            conferirIgual("o volume da maré é 17", VOLUME_DA_MARE, VOLUME_ESPERADO);
            conferirIgual("o estoque começa com 1 bloco", BLOCOS_INICIAIS, BLOCOS_ESPERADOS);
            conferirIgual("as fontes do jogo são as casas de mar do texto (" + FONTES_DO_MAR.length + ")", textoDasCasas(CASAS_DO_MAR), textoDasCasas(FONTES_DO_MAR));
            conferirIgual("as três casas do mapa", textoDasCasas(CASAS_COM_CASA), textoDasCasas(casasComObjeto("C")));
            conferirIgual("e são 3", CASAS_COM_CASA.length, 3);
            conferirIgual("o estado de partida tem o terreno do texto", JSON.stringify(estadoInicial().alturas), ALTURAS_ORIGINAIS);
            conferirIgual("e o estoque de 1 bloco", estadoInicial().blocos, 1);
            conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
        });

        testar("ENCHENTE = PONTO FIXO: sem volume, o jogo molha as mesmas casas que o preenchimento repetido sobre a grade inteira (24 terrenos × 4 níveis), com a mesma distância", function () {
            semearSorteio(5050);
            let comparados = 0, divergenciasDoConjunto = 0, divergenciasDaDistancia = 0, divergenciasDaFila = 0, casasAlcancadas = 0, casasBarradas = 0;
            const exemplos = [];
            for (let terrenoSorteado = 0; terrenoSorteado < 24; terrenoSorteado++) {
                const terreno = terrenoSorteado === 0 ? JSON.parse(ALTURAS_ORIGINAIS) : sortearTerrenoDaIlha(MAR, terrenoSorteado % 2 === 1);
                const fontes = terrenoSorteado % 3 === 0 ? FONTES_DO_MAR.concat(sortearFontesNaTerra(3, MAR)) : FONTES_DO_MAR;
                for (let nivel = 1; nivel <= 4; nivel++) {
                    const meu = alagarPorPontoFixo(terreno, nivel, fontes);
                    const dele = buscaEmLargura(terreno, nivel, fontes);
                    const molhadoDele = dele.distancia.map(function (linha) { return linha.map(function (distancia) { return distancia >= 0; }); });
                    comparados++;
                    const diferenca = primeiraDiferenca(molhadoDele, meu);
                    if (diferenca) { divergenciasDoConjunto++; if (exemplos.length < 3) exemplos.push("terreno " + terrenoSorteado + " nível " + nivel + " " + diferenca); }
                    if (primeiraDiferenca(dele.distancia, distanciasPorRelaxamento(meu, fontes))) divergenciasDaDistancia++;
                    if (textoDasCasas(dele.ordem.slice().sort(function (a, b) { return a.y - b.y || a.x - b.x; })) !== textoDasCasas(casasDaMatriz(meu))) divergenciasDaFila++;
                    casasAlcancadas += casasDaMatriz(meu).length;
                    casasBarradas += TAMANHO * TAMANHO - casasDaMatriz(meu).length;
                }
            }
            conferir(comparados + " enchentes: o conjunto molhado = o ponto fixo (nível 1 a 4, fontes do mar e, às vezes, 3 fontes em terra)", divergenciasDoConjunto === 0, divergenciasDoConjunto + " divergências; " + exemplos.join(" | "));
            conferirIgual("a distância (passos desde a fonte) = a do relaxamento", divergenciasDaDistancia, 0);
            conferirIgual("a fila da busca tem cada casa molhada uma vez só e nenhuma outra", divergenciasDaFila, 0);
            conferir("a amostra tem água e barreira: " + casasAlcancadas + " casas molhadas, " + casasBarradas + " barradas", casasAlcancadas > 2500 && casasBarradas > 1500);
        });

        testar("um terreno todo mais alto que o nível não molha nada além do mar; com o nível acima de tudo molha a ilha inteira", function () {
            const alto = matrizDeValor(TAMANHO, 4);
            MAR.forEach(function (linha, y) { linha.forEach(function (mar, x) { if (mar) alto[y][x] = 0; }); });
            conferirIgual("nível 4 sobre blocos de altura 4: só o mar", textoDasCasas(casasDaMatriz(buscaEmLargura(alto, 4, FONTES_DO_MAR).distancia.map(function (linha) { return linha.map(function (distancia) { return distancia >= 0; }); }))), textoDasCasas(FONTES_DO_MAR));
            const baixo = matrizDeValor(TAMANHO, 0);
            const tudo = buscaEmLargura(baixo, 1, FONTES_DO_MAR).distancia.map(function (linha) { return linha.map(function (distancia) { return distancia >= 0; }); });
            conferirIgual("terreno raso (altura 0) e nível 1: a ilha inteira (100 casas)", casasDaMatriz(tudo).length, 100);
        });

        testar("COM VOLUME: a água gasta uma unidade por casa, da mais baixa para a mais alta (empate: menor distância, depois índice), igual à minha conta em 24 terrenos × 10 volumes", function () {
            semearSorteio(6060);
            let comparados = 0, divergenciasDoConjunto = 0, divergenciasDaOrdem = 0, divergenciasDoResto = 0, completas = 0, cortadas = 0;
            const exemplos = [];
            for (let terrenoSorteado = 0; terrenoSorteado < 24; terrenoSorteado++) {
                const terreno = terrenoSorteado === 0 ? JSON.parse(ALTURAS_ORIGINAIS) : sortearTerrenoDaIlha(MAR, terrenoSorteado % 2 === 1);
                const nivel = 2 + terrenoSorteado % 3;
                [0, 1, 2, 5, 9, 14, 17, 25, 60, 300].forEach(function (volume) {
                    const dele = encherComVolume(terreno, nivel, FONTES_DO_MAR, volume), meu = encherPelaMinhaConta(terreno, nivel, FONTES_DO_MAR, volume);
                    comparados++;
                    if (primeiraDiferenca(dele.alagado, meu.alagado)) divergenciasDoConjunto++;
                    const ordemDele = textoDasCasas(dele.ordem.filter(function (casa) { return casa.distancia > 0; }));
                    if (ordemDele !== textoDasCasas(meu.consumidas)) { divergenciasDaOrdem++; if (exemplos.length < 2) exemplos.push("terreno " + terrenoSorteado + " nível " + nivel + " volume " + volume + ": jogo [" + ordemDele + "] minha [" + textoDasCasas(meu.consumidas) + "]"); }
                    if (dele.volumeRestante !== meu.restante) divergenciasDoResto++;
                    if (meu.restante > 0) completas++; else cortadas++;
                });
            }
            conferirIgual(comparados + " enchentes: o conjunto molhado = a minha conta", divergenciasDoConjunto, 0);
            conferir("a ORDEM em que as casas são molhadas = a minha (baixa → alta; distância; índice)", divergenciasDaOrdem === 0, exemplos.join(" | "));
            conferirIgual("o volume que sobra = o meu", divergenciasDoResto, 0);
            conferir("a amostra tem as duas situações: " + cortadas + " cortadas pelo volume, " + completas + " em que o volume sobra", cortadas > 60 && completas > 20);
        });

        testar("a ordem à mão: a vala (mais baixa) enche antes do terraço, mesmo mais longe; no empate de altura vence a menor distância, depois o menor índice", function () {
            function terrenoAlto() { return matrizDeValor(TAMANHO, 4); }
            function ordemDe(terreno, nivel, fonte, volume) {
                return textoDasCasas(encherComVolume(terreno, nivel, [fonte], volume).ordem.filter(function (casa) { return casa.distancia > 0; }));
            }
            let terreno = terrenoAlto();
            terreno[5][0] = 0; terreno[5][1] = 2; terreno[4][0] = 1; terreno[6][0] = 0; terreno[3][0] = 1;
            conferirIgual("de baixo para cima: (0,6) h0, (0,4) h1, (0,3) h1 (mais longe, mas mais baixa que (1,5)), por fim (1,5) h2", ordemDe(terreno, 3, { x: 0, y: 5 }, 4), "0,6 0,4 0,3 1,5");
            conferirIgual("a conta do teste diz o mesmo", textoDasCasas(encherPelaMinhaConta(terreno, 3, [{ x: 0, y: 5 }], 4).consumidas), "0,6 0,4 0,3 1,5");

            terreno = terrenoAlto();
            terreno[5][5] = 0; terreno[5][4] = 0; terreno[5][6] = 1; terreno[5][3] = 1;
            conferirIgual("mesma altura (1): (6,5) a 1 passo vence (3,5) a 2 passos, mesmo (3,5) tendo o menor índice", ordemDe(terreno, 3, { x: 5, y: 5 }, 3), "4,5 6,5 3,5");

            terreno = terrenoAlto();
            terreno[5][5] = 0; terreno[5][4] = 1; terreno[5][6] = 1; terreno[4][5] = 1; terreno[6][5] = 1;
            conferirIgual("mesma altura e mesma distância: o menor índice (y · 10 + x) primeiro", ordemDe(terreno, 3, { x: 5, y: 5 }, 4), "5,4 4,5 6,5 5,6");

            terreno = terrenoAlto();
            terreno[5][0] = 0; terreno[5][1] = 0;
            conferirIgual("a fronteira acaba depois de 1 casa (1,5): sobram 49 de 50 unidades e nada mais molha", encherComVolume(terreno, 2, [{ x: 0, y: 5 }], 50).volumeRestante, 49);
            conferirIgual("volume 0: só a fonte", textoDasCasas(casasDaMatriz(encherComVolume(terreno, 2, [{ x: 0, y: 5 }], 0).alagado)), "0,5");
        });

        testar("MONOTONIA: com mais volume a água só cresce, uma casa por unidade, e a que molhou nunca seca (12 terrenos × volume 0 a 30)", function () {
            semearSorteio(7070);
            let secaram = 0, saltos = 0, comparadas = 0;
            for (let terrenoSorteado = 0; terrenoSorteado < 12; terrenoSorteado++) {
                const terreno = terrenoSorteado === 0 ? JSON.parse(ALTURAS_ORIGINAIS) : sortearTerrenoDaIlha(MAR, terrenoSorteado % 2 === 1);
                let anterior = encherComVolume(terreno, 2, FONTES_DO_MAR, 0).alagado;
                for (let volume = 1; volume <= 30; volume++) {
                    const agora = encherComVolume(terreno, 2, FONTES_DO_MAR, volume).alagado;
                    comparadas++;
                    anterior.forEach(function (linha, y) { linha.forEach(function (molhada, x) { if (molhada && !agora[y][x]) secaram++; }); });
                    if (casasDaMatriz(agora).length - casasDaMatriz(anterior).length > 1) saltos++;
                    anterior = agora;
                }
            }
            conferirIgual(comparadas + " passos de volume: nenhuma casa molhada secou", secaram, 0);
            conferirIgual("e cada unidade de volume molha no máximo uma casa", saltos, 0);
        });

        testar("a maré é um filme: a água só cresce quadro a quadro, termina em 'contar' com a água do volume 17, e o aviso conta as casas", function () {
            voltarAoComeco();
            const prevista = encherPelaMinhaConta(alturas, NIVEL_DA_MARE_ESPERADO, FONTES_DO_MAR, VOLUME_ESPERADO);
            const aSeco = casasDaMatriz(agua.alagado).length;
            conferirIgual("antes da maré, a água é a da baixa-mar (nível 1 por ponto fixo)", primeiraDiferenca(agua.alagado, alagarPorPontoFixo(alturas, NIVEL_DA_BAIXA_MAR_ESPERADO, FONTES_DO_MAR)), "");
            clicarNoBotao("liberarMare");
            conferirIgual("liberar a maré tira o jogo de 'moldar'", fase, "mare");
            let anterior = copiarMatriz(agua.alagado), contagemAnterior = casasDaMatriz(anterior).length;
            let secaram = 0, saltos = 0, quadros = 0, aguaParada = 0;
            while (fase === "mare" && quadros < 4000) {
                avancarQuadro(16);
                quadros++;
                anterior.forEach(function (linha, y) { linha.forEach(function (molhada, x) { if (molhada && !agua.alagado[y][x]) secaram++; }); });
                const contagem = casasDaMatriz(agua.alagado).length;
                if (contagem - contagemAnterior > 1) saltos++;
                if (contagem === contagemAnterior) aguaParada++;
                anterior = copiarMatriz(agua.alagado);
                contagemAnterior = contagem;
            }
            conferirIgual("nenhuma casa molhada secou durante o filme", secaram, 0);
            conferirIgual("e no máximo uma casa a mais por quadro", saltos, 0);
            conferir("a água parou entre um passo e outro (" + aguaParada + " quadros sem casa nova)", aguaParada > quadros / 2);
            conferirIgual("o filme termina em 'contar'", fase, "contar");
            const molhadasNoFim = casasDaMatriz(agua.alagado).length;
            conferirIgual("no fim a água é a minha conta do volume 17", primeiraDiferenca(agua.alagado, prevista.alagado), "");
            const passosDoFilme = molhadasNoFim - FONTES_DO_MAR.length;
            conferir("o filme dura ~" + PASSO_DA_MARE + " s por casa: " + (quadros * 0.016).toFixed(2) + " s para " + passosDoFilme + " casas", quadros * 0.016 >= (passosDoFilme - 1) * PASSO_DA_MARE && quadros * 0.016 <= (passosDoFilme + 1) * PASSO_DA_MARE);
            const perdidas = casasPerdidasPelaMinhaConta(prevista.alagado);
            conferirIgual("o aviso conta as casas (" + perdidas + " alagadas, " + (3 - perdidas) + " salvas)", aviso.textContent.indexOf("Maré: " + perdidas + " casas alagadas, " + (3 - perdidas) + " salvas"), 0);
            desenharVerdadeiro();
            conferirIgual("o painel diz salvas/total", painel.textContent.indexOf("Salvas " + (3 - perdidas) + "/3"), 0);
            conferirIgual("depois do 'contar', a água não anda mais", (avancarQuadros(120, 16), primeiraDiferenca(agua.alagado, prevista.alagado)), "");
            conferir("a água de baixa-mar tinha menos casas que a da maré cheia (" + aSeco + " < " + molhadasNoFim + ")", aSeco < molhadasNoFim);
            voltarAoComeco();
        });

        testar("A MARÉ NÃO SE DESFAZ: depois de liberada, aplicar e desfazer só avisam; refazer (N) volta tudo", function () {
            voltarAoComeco();
            cursor = { x: 4, y: 3 };
            apertarTecla("Enter");
            const depoisDeUmaJogada = fotoDoEstado();
            clicarNoBotao("liberarMare");
            apertarTecla("Enter");
            conferirIgual("na maré, aplicar não muda o terreno", fotoDoEstado(), depoisDeUmaJogada);
            conferir("e o aviso diz que a maré já foi liberada: " + aviso.textContent, /maré já foi liberada/i.test(aviso.textContent));
            apertarTecla("z");
            conferirIgual("na maré, desfazer também não", fotoDoEstado(), depoisDeUmaJogada);
            conferir("e avisa que a maré não se desfaz: " + aviso.textContent, /maré não se desfaz/i.test(aviso.textContent));
            apertarTecla("m");
            conferirIgual("M de novo (com movimento) não reinicia a maré", fase, "mare");
            apertarTecla("n");
            conferirIgual("N recomeça o dia: o terreno é o original", JSON.stringify(alturas), ALTURAS_ORIGINAIS);
            conferirIgual("o estoque volta a 1", estadoAtual.blocos, 1);
            conferirIgual("a fase volta a 'moldar'", fase, "moldar");
            apertarTecla("z");
            conferir("e não há o que desfazer: " + aviso.textContent, /nada para desfazer/i.test(aviso.textContent));
            voltarAoComeco();
        });

            voltarAoComeco();
        });

        testar("H mostra a ordem em que a água enche (o número 1 vai para a casa mais baixa da fronteira) e o alcance que o volume não cobre", function () {
            voltarAoComeco();
            apertarTecla("h");
            desenharVerdadeiro();
            const minha = encherPelaMinhaConta(alturas, 2, FONTES_DO_MAR, 17);
            conferir("a leitura diz o nível, o volume e quantas casas enchem: " + leitura.textContent.split("\n")[0], leitura.textContent.indexOf("nível 2, volume 17") !== -1 && leitura.textContent.indexOf("enchem " + minha.consumidas.length) !== -1);
            conferir("e o alcance (as casas que a água alcançaria sem limite de volume = " + (casasDaMatriz(minha.alcance).length - FONTES_DO_MAR.length) + ")", leitura.textContent.indexOf("alcance " + (casasDaMatriz(minha.alcance).length - FONTES_DO_MAR.length)) !== -1);
            const registro = gravarDesenho(pincel, desenharVerdadeiro);
            const rotulos = registro.tracos.length;
            conferir("H desenha (traços no quadro: " + rotulos + ")", rotulos > 100);
            voltarAoComeco();
        });

        testar("ARESTAS COMPARTILHADAS (picking com câmera e água): num ponto de coordenada inteira sobre a aresta de duas casas ou mais, o raio dá a mesma casa e face que o pintor de trás para a frente, com cova seca, laterais só onde há altura, 3 zooms e rolagens inexatas", function () {
            voltarAoComeco();
            conferirArestasComunsComCamera({
                semente: 5353, tamanho: TAMANHO, mapa: { x: 384, y: 252 }, vista: { x: 384, y: 252 }, zooms: [1, 1.5, 2], estados: 8,
                sortearEstado: function (indice) {
                    alturas = indice === 0 ? JSON.parse(ALTURAS_ORIGINAIS) : sortearTerrenoDaIlha(MAR, indice % 2 === 0);
                    const nivel = 1 + indice % 3;
                    const molhadas = indice === 0 ? alagarPorPontoFixo(alturas, NIVEL_DA_BAIXA_MAR_ESPERADO, FONTES_DO_MAR) : matrizDeValor(TAMANHO, false).map(function (linha) { return linha.map(function () { return Math.random() < 0.4; }); });
                    definirAgua(indice === 0 ? NIVEL_DA_BAIXA_MAR_ESPERADO : nivel, casasDaMatriz(molhadas));
                    const nivelDaAgua = indice === 0 ? NIVEL_DA_BAIXA_MAR_ESPERADO : nivel;
                    return function (x, y) { return molhadas[y][x] ? Math.max(alturas[y][x], nivelDaAgua) : alturas[y][x]; };
                },
                alturaVisivelDoJogo: alturaVisivel,
                irParaOGiro: irParaOGiro,
                definirCamera: definirCamera,
                cameraDoJogo: function () { return camera; },
                raio: acharCasaPeloRaio,
                casaSobOPixel: casaSobOPixel,
            });
            voltarAoComeco();
        });

        // ------------------------------------------------------------
        // O passo inteiro em iframes (apoio-dique.js): movimento reduzido e layout
        // ------------------------------------------------------------
        const ANTES_DO_MOVIMENTO_REDUZIDO = "window.matchMedia = function (consulta) { return { matches: /reduce/.test(consulta), media: consulta, addEventListener: function () {}, removeEventListener: function () {} }; };";

        async function conferirMovimentoReduzido() {
            const quadro = await abrirPassoNoIframe("05-enchente", MARCACAO_DO_PASSO, ANTES_DO_MOVIMENTO_REDUZIDO, 390, 750);
            try {
                const janela = quadro.contentWindow;
                pararODesenhoDaJanela(janela);
                const molhadas = function () { return janela.eval("agua.alagado").reduce(function (soma, linha) { return soma + linha.filter(Boolean).length; }, 0); };
                conferirIgual("o iframe vê prefers-reduced-motion", janela.eval("movimentoReduzido"), true);
                let instante = 16;
                darQuadro(janela, instante);
                teclaNaJanela(janela, "m");
                const depoisDaPrimeira = { fase: janela.eval("fase"), molhadas: molhadas() };
                conferir("a primeira tecla M não leva a maré ao fim (fase " + depoisDaPrimeira.fase + ")", depoisDaPrimeira.fase !== "contar");
                instante = passarTempoNaJanela(janela, instante, 10);
                conferirIgual("10 s de quadros depois, a água não andou sozinha", janela.eval("fase") + "/" + molhadas(), depoisDaPrimeira.fase + "/" + depoisDaPrimeira.molhadas);
                const contagens = [depoisDaPrimeira.molhadas];
                let teclas = 1;
                while (janela.eval("fase") !== "contar" && teclas < 80) {
                    teclaNaJanela(janela, "m");
                    teclas++;
                    instante += 16;
                    darQuadro(janela, instante);
                    contagens.push(molhadas());
                }
                conferir("a maré só chega ao fim depois de várias teclas (" + teclas + ")", teclas >= 3 && janela.eval("fase") === "contar");
                const semAvanco = contagens.slice(1).filter(function (quantas, i) { return quantas <= contagens[i]; }).length;
                conferirIgual("cada tecla depois da primeira acrescenta água", semAvanco, 0);
                const prevista = encherPelaMinhaConta(JSON.parse(ALTURAS_ORIGINAIS), NIVEL_DA_MARE_ESPERADO, FONTES_DO_MAR, VOLUME_ESPERADO);
                conferirIgual("no fim a água é a mesma do filme: a minha conta do volume 17", primeiraDiferenca(janela.eval("agua.alagado"), prevista.alagado), "");
                conferir("o aviso conta as casas", /Maré: \d casas alagadas, \d salvas/.test(janela.document.getElementById("aviso").textContent), janela.document.getElementById("aviso").textContent);
            } finally {
                quadro.remove();
            }
        }

        const CONFIGURACAO_DO_LAYOUT = {
            pasta: "05-enchente",
            corpo: MARCACAO_DO_PASSO,
            quantidadeDeBotoes: 15,
            proporcaoDoCanvas: 384 / 252,
            mensagens: ["", "Zoom: perto", "Ferramenta: Cavar", "Vista girada para 270 graus. Casas escondidas: 2", "Maré: 3 casas alagadas, 0 salvas. N recomeça o dia",
                "Marcada: casa 7, 7, altura 1, escondida atrás de um bloco. Toque de novo para erguer e gastar um bloco do estoque"],
        };

        async function principal() {
            await testarNoIframe("movimento reduzido", conferirMovimentoReduzido);
            await testarNoIframe("layout 390×750", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 390, 750); });
            await testarNoIframe("layout 360×640", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 360, 640); });
            testar("sem erro de console e com o estado restaurado", function () {
                voltarAoComeco();
                conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
                conferirIgual("o terreno de partida nunca foi mexido", JSON.stringify(ALTURAS_INICIAIS), ALTURAS_ORIGINAIS);
                conferirIgual("o giro final é 0", rotacao, 0);
                conferirIgual("nenhum aviso de erro sobrou", errosDeConsole.join(" | "), "");
                conferir("o laço segue vivo", avancarQuadro(16));
            });
        }

        principal().finally(finalizar);
    </script>
