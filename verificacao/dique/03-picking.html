<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Teste — Dique, passo 3: o picking (o jogo)</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #ddd; padding: 1rem; }
        #resultado { font-size: 14px; white-space: pre-wrap; }
    </style>
</head>

<body>
    <h1>Teste — Dique, passo 3: o picking (o jogo)</h1>
    <pre id="resultado"></pre>

    <!-- O esqueleto do passo: o script dele procura estes ids. O canvas começa com 1×1: quem o dimensiona é o script, a partir do mapa. -->
    <canvas id="jogo" width="1" height="1"></canvas>
    <!-- ESPELHO:inicio dique/03-picking/index.html trecho -->
    <div id="botoes">
        <button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>
        <button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>
        <button type="button" data-acao="aplicar" aria-label="Aplicar na casa marcada (Enter ou Espaço)">Aplicar</button>
        <button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>
    </div>
    <div id="setas">
        <button type="button" data-acao="cursorParaEsquerda" aria-label="Mover o cursor para a esquerda (seta)">←</button>
        <button type="button" data-acao="cursorParaCima" aria-label="Mover o cursor para cima (seta)">↑</button>
        <button type="button" data-acao="cursorParaBaixo" aria-label="Mover o cursor para baixo (seta)">↓</button>
        <button type="button" data-acao="cursorParaDireita" aria-label="Mover o cursor para a direita (seta)">→</button>
    </div>
    <p id="aviso" role="status"></p>
    <pre id="leitura" aria-live="off"></pre>
    <!-- ESPELHO:fim -->

    <script src="../apoio.js"></script>
    <script src="apoio-dique.js"></script>

    <!-- Guarda os console.error (o mapa inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/03-picking/regras.js"></script>
    <script src="../../dique/03-picking/script.js"></script>

    <script>
        const TOLERANCIA = 1e-9;
        const errosNaCarga = errosDeConsole.slice();
        const ALTURAS_ORIGINAIS = JSON.stringify(alturas);
        const FACES = ["topo", "esquerda", "direita"];
        const COR_DO_CURSOR = "#ffe14d";
        const COR_DO_CONTORNO = "rgba(0, 0, 0, 0.5)";
        const COR_DO_PINO = "#101820";

        // ------------------------------------------------------------
        // Ajudantes de entrada e de estado
        // ------------------------------------------------------------
        function apertarTecla(tecla, modificadores, alvo) {
            const evento = new KeyboardEvent("keydown", Object.assign({ key: tecla, cancelable: true, bubbles: true }, modificadores || {}));
            (alvo || document).dispatchEvent(evento);
            return evento;
        }

        function eventoNoPixel(tipo, sx, sy) {
            const caixa = tela.getBoundingClientRect();
            return new PointerEvent(tipo, { clientX: caixa.left + sx * caixa.width / tela.width, clientY: caixa.top + sy * caixa.height / tela.height, pointerId: 1, bubbles: true });
        }

        function tocarNoPixel(sx, sy) {
            tela.dispatchEvent(eventoNoPixel("pointerdown", sx, sy));
        }

        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            const rotacaoOriginal = rotacao;
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(rotacaoOriginal);
            }
        }

        function sortearTerreno() {
            alturas.forEach(function (linha) {
                for (let x = 0; x < linha.length; x++) linha[x] = Math.floor(Math.random() * 5);
            });
        }

        function restaurarTerreno() {
            const original = JSON.parse(ALTURAS_ORIGINAIS);
            alturas.forEach(function (linha, y) {
                for (let x = 0; x < linha.length; x++) linha[x] = original[y][x];
            });
            irParaOGiro(0);
        }

        function zerarAEntrada() {
            pinos.clear();
            marcada = false;
            cursor = { x: 4, y: 4 };
            if (depuracaoLigada) apertarTecla("h");
            avisar("");
            irParaOGiro(0);
        }

        function nomeDaCasa(casa) {
            return casa.x + "," + casa.y;
        }

        // ------------------------------------------------------------
        // Minha força bruta (sem as funções de projeção do jogo): sx = ox + 18 (u − v), sy = oy + 9 (u + v) − 12 z.
        // ------------------------------------------------------------
        function girarPeloMeuCaminho(x, y, giros) {
            let ponto = [x, y];
            for (let i = 0; i < giros; i++) ponto = [TAMANHO - ponto[1], ponto[0]];
            return ponto;
        }

        function projetarMinha(u, v, z) {
            return { x: 192 + 18 * (u - v), y: 60 + 9 * (u + v) - 12 * z };
        }

        function pontoNoPoligonoConvexo(poligono, ponto) {
            let positivo = false, negativo = false;
            for (let i = 0; i < poligono.length; i++) {
                const canto = poligono[i], proximo = poligono[(i + 1) % poligono.length];
                const lado = (proximo.x - canto.x) * (ponto.y - canto.y) - (proximo.y - canto.y) * (ponto.x - canto.x);
                if (lado > 1e-9) positivo = true;
                if (lado < -1e-9) negativo = true;
            }
            return !(positivo && negativo);
        }

        function construirCenario() {
            const casas = [];
            alturas.forEach(function (linha, y) {
                linha.forEach(function (altura, x) {
                    const centro = girarPeloMeuCaminho(x + 0.5, y + 0.5, rotacao);
                    const nivel = Math.max(altura, 1);
                    const canto = function (du, dv, z) { return projetarMinha(centro[0] + du, centro[1] + dv, z); };
                    const topoCima = canto(-0.5, -0.5, nivel), topoDireita = canto(0.5, -0.5, nivel);
                    const topoBaixo = canto(0.5, 0.5, nivel), topoEsquerda = canto(-0.5, 0.5, nivel);
                    const baseDireita = canto(0.5, -0.5, 0), baseBaixo = canto(0.5, 0.5, 0), baseEsquerda = canto(-0.5, 0.5, 0);
                    casas.push({
                        x: x, y: y, proximidade: centro[0] + centro[1],
                        faces: {
                            topo: [topoCima, topoDireita, topoBaixo, topoEsquerda],
                            esquerda: [topoEsquerda, topoBaixo, baseBaixo, baseEsquerda],
                            direita: [topoBaixo, topoDireita, baseDireita, baseBaixo],
                        },
                        minX: topoEsquerda.x, maxX: topoDireita.x, minY: topoCima.y, maxY: baseBaixo.y,
                    });
                });
            });
            casas.sort(function (a, b) { return b.proximidade - a.proximidade || (b.y * TAMANHO + b.x) - (a.y * TAMANHO + a.x); });      // a lista do pintor lida de trás para a frente: da mais perto à mais longe, e no empate a pintada por último (maior índice) primeiro
            return casas;
        }

        function acharPelaMinhaForcaBruta(cenario, sx, sy) {
            const ponto = { x: sx, y: sy };
            for (let i = 0; i < cenario.length; i++) {
                const casa = cenario[i];
                if (sx < casa.minX || sx > casa.maxX || sy < casa.minY || sy > casa.maxY) continue;
                for (let f = 0; f < 3; f++) {
                    if (pontoNoPoligonoConvexo(casa.faces[FACES[f]], ponto)) return { x: casa.x, y: casa.y, face: FACES[f] };
                }
            }
            return null;
        }

        function escondedoresPelaMinhaConta(cenario, x, y) {
            const dela = cenario.find(function (casa) { return casa.x === x && casa.y === y; });
            const ponto = dela.faces.topo.reduce(function (soma, canto) { return { x: soma.x + canto.x / 4, y: soma.y + canto.y / 4 }; }, { x: 0, y: 0 });
            return cenario.filter(function (casa) {
                return casa.proximidade > dela.proximidade + 1e-9 && FACES.some(function (nome) { return pontoNoPoligonoConvexo(casa.faces[nome], ponto); });
            }).map(nomeDaCasa);
        }

        // Um pixel de verdade DENTRO de uma face de uma casa, à vista no giro 0: procura, pela minha força bruta, um ponto da face que
        // nenhuma casa da frente cobre. Devolve null se a face está toda coberta.
        function pixelNaFace(x, y, face) {
            const cenario = construirCenario();
            const casa = cenario.find(function (candidata) { return candidata.x === x && candidata.y === y; });
            const poligono = casa.faces[face];
            for (let sy = casa.minY + 0.5; sy < casa.maxY; sy += 1) {
                for (let sx = casa.minX + 0.5; sx < casa.maxX; sx += 1) {
                    const acerto = acharPelaMinhaForcaBruta(cenario, sx, sy);
                    if (acerto && acerto.x === x && acerto.y === y && acerto.face === face && pontoNoPoligonoConvexo(poligono, { x: sx, y: sy })) return { x: sx, y: sy };
                }
            }
            return null;
        }

        function casaComAsTresFacesAVista() {      // no giro 0: a primeira casa de terra cujo topo e as duas laterais têm pixels à vista
            for (let y = 0; y < TAMANHO; y++) {
                for (let x = 0; x < TAMANHO; x++) {
                    if (alturas[y][x] >= 2 && FACES.every(function (face) { return pixelNaFace(x, y, face) !== null; })) return { x: x, y: y };
                }
            }
            return null;
        }

        // ------------------------------------------------------------
        // O gravador do quadro (traços com espessura/cor/tracejado e preenchimentos) e os espiões nas funções de desenho.
        // ------------------------------------------------------------
        function alfaDaCor(cor) {
            const partes = /^rgba\(.*,\s*([\d.]+)\)$/.exec(cor);
            return partes ? Number(partes[1]) : 1;
        }

        function gravarQuadros(quantidade) {
            const registro = [];
            let caminho = [];
            let dentroDe = null;
            const prototipo = CanvasRenderingContext2D.prototype;
            const caixaVerdadeira = desenharCaixa, aguaVerdadeira = desenharAgua, pinoVerdadeiro = desenharPino;
            pincel.beginPath = function () { caminho = []; prototipo.beginPath.call(pincel); };
            pincel.moveTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.moveTo.call(pincel, x, y); };
            pincel.lineTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.lineTo.call(pincel, x, y); };
            pincel.stroke = function () {
                registro.push({ tipo: "traco", pontos: caminho.slice(), largura: pincel.lineWidth, cor: pincel.strokeStyle, tracejado: pincel.getLineDash().length > 0, dentroDe: dentroDe });
                prototipo.stroke.call(pincel);
            };
            pincel.fill = function () {
                registro.push({ tipo: "preenchimento", pontos: caminho.slice(), cor: pincel.fillStyle, dentroDe: dentroDe });
                prototipo.fill.call(pincel);
            };
            desenharCaixa = function (x, y, de, ate, estilo) {
                registro.push({ tipo: "caixa", x: x, y: y, de: de, ate: ate, contorno: estilo.contorno });
                dentroDe = "caixa";
                try { return caixaVerdadeira(x, y, de, ate, estilo); } finally { dentroDe = null; }
            };
            desenharAgua = function (casa) {
                registro.push({ tipo: "agua", x: casa.x, y: casa.y, altura: casa.altura });
                dentroDe = "agua";
                try { return aguaVerdadeira(casa); } finally { dentroDe = null; }
            };
            desenharPino = function (casa) {
                registro.push({ tipo: "pino", x: casa.x, y: casa.y });
                dentroDe = "pino";
                try { return pinoVerdadeiro(casa); } finally { dentroDe = null; }
            };
            try {
                for (let i = 0; i < quantidade; i++) if (!avancarQuadro(16)) throw new Error("o laço do jogo parou de pedir quadros");
            } finally {
                desenharCaixa = caixaVerdadeira;
                desenharAgua = aguaVerdadeira;
                desenharPino = pinoVerdadeiro;
                ["beginPath", "moveTo", "lineTo", "stroke", "fill"].forEach(function (nome) { delete pincel[nome]; });
            }
            return registro;
        }

        function fichasDoQuadro(registro) {          // C caixa, A água, P pino, K cursor sólido, k cursor tracejado
            const fichas = [];
            registro.forEach(function (operacao) {
                if (operacao.tipo === "caixa") fichas.push("C " + operacao.x + "," + operacao.y);
                else if (operacao.tipo === "agua") fichas.push("A " + operacao.x + "," + operacao.y);
                else if (operacao.tipo === "pino") fichas.push("P " + operacao.x + "," + operacao.y);
                else if (operacao.tipo === "traco" && operacao.cor === COR_DO_CURSOR) fichas.push(operacao.tracejado ? "k" : "K");
            });
            return fichas;
        }

        function fichasEsperadas(escondido) {
            const fichas = [];
            listaDeDesenho.forEach(function (casa) {
                fichas.push((casa.altura < NIVEL_DA_AGUA ? "A " : "C ") + casa.x + "," + casa.y);      // a casa alagada pinta leito e água, não caixa
                if (pinos.has(casa.x + "," + casa.y)) fichas.push("P " + casa.x + "," + casa.y);
                if (casa.x === cursor.x && casa.y === cursor.y) { fichas.push("K"); if (marcada) fichas.push("K"); }
            });
            if (escondido) { fichas.push("k"); if (marcada) fichas.push("k"); }
            return fichas;
        }

        function chaveDePonto(ponto) {
            return (Math.round(ponto.x * 1000) / 1000) + ";" + (Math.round(ponto.y * 1000) / 1000);
        }

        function casasAlagadasDoMapa() {
            const casas = [];
            alturas.forEach(function (linha, y) { linha.forEach(function (altura, x) { if (altura < NIVEL_DA_AGUA) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        function bordasBrancasEsperadas() {
            const chaves = [];
            casasAlagadasDoMapa().forEach(function (casa) {
                [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (passo) {
                    const vx = casa.x + passo[0], vy = casa.y + passo[1];
                    const dentro = vx >= 0 && vy >= 0 && vx < TAMANHO && vy < TAMANHO;
                    if (!dentro || alturas[vy][vx] >= NIVEL_DA_AGUA) chaves.push(chaveDePonto(mundoParaTela(casa.x + 0.5 + passo[0] / 2, casa.y + 0.5 + passo[1] / 2, NIVEL_DA_AGUA)));
                });
            });
            return chaves.sort();
        }

        // Três casas com o topo à vista no giro 0 (não cobertas por dique): o terreno de verdade decide quais.
        const CASAS_A_VISTA = [[7, 7], [4, 4], [6, 2], [2, 6], [3, 3]].map(function (par) { return { x: par[0], y: par[1] }; }).filter(function (casa) { return pixelNaFace(casa.x, casa.y, "topo") !== null; });
        const PRIMEIRA = CASAS_A_VISTA[0], SEGUNDA = CASAS_A_VISTA[1], TERCEIRA = CASAS_A_VISTA[2];

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("a tela: canvas dimensionado pelo script a partir do mapa, #aviso com role=status", function () {
            conferirIgual("largura = ilha + 2 margens de 12 px", tela.width, TAMANHO * LARGURA_DO_BLOCO + 24);
            conferirIgual("altura = ORIGEM.y + meia ilha + margem", tela.height, ORIGEM.y + TAMANHO * LARGURA_DO_BLOCO / 2 + 12);
            conferirIgual("e são 384 px de largura", tela.width, 384);
            conferirIgual("e 252 px de altura", tela.height, 252);
            conferirIgual("o aviso do esqueleto é uma região role=status", aviso.getAttribute("role"), "status");
            conferirIgual("o mapa de verdade é válido", MAPA_VALIDO, true);
            conferirIgual("o laço começou (pediu o primeiro quadro)", avancarQuadro(16), true);
            conferirIgual("estado inicial: cursor (4, 4), nada marcado, sem pinos", JSON.stringify({ c: cursor, m: marcada, p: pinos.size }), JSON.stringify({ c: { x: 4, y: 4 }, m: false, p: 0 }));
        });

        testar("DOIS TOQUES: o primeiro marca, o segundo na mesma casa confirma", function () {
            zerarAEntrada();
            const topo = pixelNaFace(PRIMEIRA.x, PRIMEIRA.y, "topo");
            const acertoDoTopo = acharCasaPeloRaio(topo.x, topo.y);
            conferirIgual("preparação: o pixel à vista do topo de (" + nomeDaCasa(PRIMEIRA) + ") é dela mesmo", acertoDoTopo && nomeDaCasa(acertoDoTopo), nomeDaCasa(PRIMEIRA));

            tocarNoPixel(topo.x, topo.y);
            conferirIgual("1º toque: o cursor vai para a casa tocada", nomeDaCasa(cursor), nomeDaCasa(PRIMEIRA));
            conferirIgual("1º toque: ela fica marcada", marcada, true);
            conferirIgual("1º toque: NADA é confirmado (sem pinos)", pinos.size, 0);
            conferir("1º toque: o aviso diz que marcou e pede o segundo toque", /Marcada/.test(aviso.textContent) && /de novo/.test(aviso.textContent), aviso.textContent);
            conferir("1º toque: o aviso descreve a casa (altura)", aviso.textContent.indexOf("casa " + PRIMEIRA.x + ", " + PRIMEIRA.y + ", altura " + alturas[PRIMEIRA.y][PRIMEIRA.x]) !== -1, aviso.textContent);

            tocarNoPixel(topo.x, topo.y);
            conferirIgual("2º toque: o pino foi gravado em pinos (\"x,y\")", Array.from(pinos).join("|"), nomeDaCasa(PRIMEIRA));
            conferirIgual("2º toque: a marca some", marcada, false);
            conferir("2º toque: o aviso diz que colocou o pino", aviso.textContent === "Pino colocado na casa " + PRIMEIRA.x + ", " + PRIMEIRA.y, aviso.textContent);

            tocarNoPixel(topo.x, topo.y);
            conferirIgual("3º toque: marca de novo (não confirma de novo)", marcada, true);
            conferirIgual("3º toque: o pino continua", pinos.size, 1);
            tocarNoPixel(topo.x, topo.y);
            conferirIgual("4º toque: o pino é retirado", pinos.size, 0);
            conferir("4º toque: o aviso diz que retirou", aviso.textContent === "Pino retirado na casa " + PRIMEIRA.x + ", " + PRIMEIRA.y, aviso.textContent);
        });

        testar("um toque em OUTRA casa move a marca (sem confirmar nada); só repetir a casa marcada confirma", function () {
            zerarAEntrada();
            const a = pixelNaFace(PRIMEIRA.x, PRIMEIRA.y, "topo"), b = pixelNaFace(SEGUNDA.x, SEGUNDA.y, "topo"), c = pixelNaFace(TERCEIRA.x, TERCEIRA.y, "topo");
            tocarNoPixel(a.x, a.y);
            tocarNoPixel(b.x, b.y);
            conferirIgual("toque em B depois de A: o cursor está em B", nomeDaCasa(cursor), nomeDaCasa(SEGUNDA));
            conferirIgual("e B está marcada (a marca andou)", marcada, true);
            conferirIgual("e A NÃO recebeu pino", pinos.size, 0);
            tocarNoPixel(c.x, c.y);
            conferirIgual("toque em C: a marca anda de novo", nomeDaCasa(cursor), nomeDaCasa(TERCEIRA));
            conferirIgual("ainda sem pinos", pinos.size, 0);
            tocarNoPixel(c.x, c.y);
            conferirIgual("repetir C confirma só em C", Array.from(pinos).join("|"), nomeDaCasa(TERCEIRA));
            tocarNoPixel(a.x, a.y);
            tocarNoPixel(b.x, b.y);
            tocarNoPixel(a.x, a.y);
            conferirIgual("A, B, A em seguida: o último toque só marca A (não é a casa que estava marcada)", pinos.size, 1);
            conferirIgual("e A está marcada", nomeDaCasa(cursor) + " " + marcada, nomeDaCasa(PRIMEIRA) + " true");
        });

        testar("topo e lateral são da MESMA casa: marcar no topo e confirmar na lateral funciona", function () {
            zerarAEntrada();
            const casa = casaComAsTresFacesAVista();
            conferir("preparação: há uma casa com topo e as duas laterais à vista (" + (casa && nomeDaCasa(casa)) + ")", casa !== null);
            ["esquerda", "direita"].forEach(function (lateral) {
                pinos.clear(); marcada = false;
                const noTopo = pixelNaFace(casa.x, casa.y, "topo"), naLateral = pixelNaFace(casa.x, casa.y, lateral);
                const acerto = acharCasaPeloRaio(naLateral.x, naLateral.y);
                conferirIgual("preparação: o pixel está na lateral " + lateral + " de (" + nomeDaCasa(casa) + ")", acerto.x + "," + acerto.y + " " + acerto.face, nomeDaCasa(casa) + " " + lateral);
                tocarNoPixel(noTopo.x, noTopo.y);
                tocarNoPixel(naLateral.x, naLateral.y);
                conferirIgual("topo e depois lateral " + lateral + ": confirma o pino na casa", Array.from(pinos).join("|"), nomeDaCasa(casa));
                tocarNoPixel(naLateral.x, naLateral.y);
                tocarNoPixel(noTopo.x, noTopo.y);
                conferirIgual("lateral " + lateral + " e depois topo: retira o pino", pinos.size, 0);
            });
        });

        testar("um toque no vazio (céu, mar aberto fora do mapa) não muda nada, nem desfaz a marca", function () {
            zerarAEntrada();
            const a = pixelNaFace(PRIMEIRA.x, PRIMEIRA.y, "topo");
            tocarNoPixel(a.x, a.y);
            const antes = JSON.stringify({ c: cursor, m: marcada, p: Array.from(pinos), a: aviso.textContent });
            [[2.5, 2.5], [380.5, 5.5], [2.5, 248.5], [380.5, 248.5], [192.5, 1.5]].forEach(function (pixel) { tocarNoPixel(pixel[0], pixel[1]); });
            conferirIgual("cinco toques no vazio: cursor, marca, pinos e aviso iguais", JSON.stringify({ c: cursor, m: marcada, p: Array.from(pinos), a: aviso.textContent }), antes);
            tocarNoPixel(a.x, a.y);
            conferirIgual("e o toque seguinte na casa marcada ainda confirma", pinos.size, 1);
        });

        testar("o toque pega o que está à vista: a casa de trás do dique não responde (contra a minha força bruta), nos 4 giros", function () {
            zerarAEntrada();
            semearSorteio(1234);
            let toques = 0, divergencias = 0, semAcerto = 0, escondidasTocadas = 0;
            const exemplos = [];
            [0, 1, 2, 3].forEach(function (giro) {
                irParaOGiro(giro);
                const cenario = construirCenario();
                for (let i = 0; i < 400; i++) {

            conferirIgual("e outro clique o retira", pinos.size, 0);
            clicar("girarDireita");
            conferirIgual("⟳ gira 90°", rotacao, 1);
            clicar("girarEsquerda");
            clicar("girarEsquerda");
            conferirIgual("⟲ duas vezes: 270°", rotacao, 3);
            irParaOGiro(0);
            conferirIgual("a depuração começa desligada", depuracaoLigada, false);
            clicar("alternarVer");
            conferirIgual("Ver liga o H", depuracaoLigada, true);
            clicar("alternarVer");
            conferirIgual("e outro clique desliga", depuracaoLigada, false);
            conferirIgual("nenhum botão ficou sem teste: as ações da página = as clicadas", acoesDosBotoes().sort().join(" "), Array.from(clicadas).sort().join(" "));
            zerarAEntrada();
        });

        testar("o LEITO da água também é plano (passos 2 a 4 não têm parede): um só preenchimento por casa alagada, o topo no nível da água, nos 4 giros", function () {
            rodarNosQuatroGiros(function (giro) {
                const chamadas = espiarPreenchimentosPorChamada("desenharLeito", function () { avancarQuadro(16); });
                const alagadas = alturas.reduce(function (soma, linha) { return soma + linha.filter(function (altura) { return altura < NIVEL_DA_AGUA; }).length; }, 0);
                conferirIgual("giro " + giro * 90 + "°: uma chamada de desenharLeito por casa alagada", chamadas.length, alagadas);
                const erradas = chamadas.filter(function (chamada) {
                    const esperado = meusCantos(chamada.args[0].x, chamada.args[0].y, NIVEL_DA_AGUA, giro, TAMANHO);
                    return chamada.preenchimentos.length !== 1 || chamada.preenchimentos[0].pontos.length !== 4 || !chamada.preenchimentos[0].pontos.every(function (ponto, i) { return mesmoPonto(ponto, esperado[i]); });
                });
                conferirIgual("giro " + giro * 90 + "°: cada leito é um único losango no nível da água (sem laterais)", erradas.length, 0);
            });
        });

        testar("o jogo roda sem se estragar e sem erro de console", function () {
            zerarAEntrada();
            restaurarTerreno();
            avancarQuadros(60, 16);
            conferir("o loop segue pedindo quadros", avancarQuadro(16));
            conferir("e sobrevive a um quadro gigante", avancarQuadro(10000));
            conferirIgual("o terreno de verdade foi restaurado", JSON.stringify(alturas), ALTURAS_ORIGINAIS);
            conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
            conferirIgual("e depois de tudo também não", errosDeConsole.join(" | "), "");
        });

        finalizar();
    </script>
