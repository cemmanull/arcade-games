<body>

    <pre id="resultado"></pre>

    <script src="../apoio.js"></script>
    <script src="apoio-dique.js"></script>

    <!-- O esqueleto do passo (o miolo do <body> do index.html): o script dele procura estes ids. A mesma marcação vai para o iframe do layout.
         Na página o canvas começa com 1×1: quem o dimensiona é o script. -->
    <script>
        // ESPELHO:inicio dique/04-camera/index.html corpo
        const MARCACAO_DO_PASSO = '<h1>Dique</h1>'
            + '<canvas id="jogo" width="384" height="300">Seu navegador não suporta canvas.</canvas>'
            + '<div id="botoes">'
            + '<button type="button" data-acao="girarEsquerda" aria-label="Girar a vista para a esquerda (Q)">⟲</button>'
            + '<button type="button" data-acao="girarDireita" aria-label="Girar a vista para a direita (R)">⟳</button>'
            + '<button type="button" data-acao="afastar" aria-label="Longe: afastar o mapa (−)">Longe</button>'
            + '<button type="button" data-acao="aproximar" aria-label="Perto: aproximar o mapa (+)">Perto</button>'
            + '<button type="button" data-acao="aplicar" aria-label="Aplicar na casa marcada (Enter ou Espaço)">Aplicar</button>'
            + '<button type="button" data-acao="alternarVer" aria-label="Ver o invisível (H)">Ver</button>'
            + '</div>'
            + '<div id="setas">'
            + '<button type="button" data-acao="cursorParaEsquerda" aria-label="Mover o cursor para a esquerda (seta)">←</button>'
            + '<button type="button" data-acao="cursorParaCima" aria-label="Mover o cursor para cima (seta)">↑</button>'
            + '<button type="button" data-acao="cursorParaBaixo" aria-label="Mover o cursor para baixo (seta)">↓</button>'
            + '<button type="button" data-acao="cursorParaDireita" aria-label="Mover o cursor para a direita (seta)">→</button>'
            + '</div>'
            + '<p id="aviso" role="status"></p>'
            + '<pre id="leitura" aria-live="off"></pre>'
            + '<p id="ajuda">Arraste: rolar · Toque: marcar, de novo: confirmar · setas: cursor · W A S D: rolar · + −: zoom · Q R: girar · H: invisível</p>';
        // ESPELHO:fim
        document.body.insertAdjacentHTML("beforeend", MARCACAO_DO_PASSO.replace('width="384" height="300"', 'width="1" height="1"'));
    </script>

    <!-- Guarda os console.error (o mapa inválido avisa por ali). -->
    <script>
        const errosDeConsole = [];
        console.error = function () {
            errosDeConsole.push(Array.prototype.join.call(arguments, " "));
        };
    </script>
    <script src="../../dique/04-camera/regras.js"></script>
    <script src="../../dique/04-camera/script.js"></script>

    <script>
        const TOLERANCIA = 1e-9;
        const errosNaCarga = errosDeConsole.slice();
        const ALTURAS_ORIGINAIS = JSON.stringify(alturas);
        const FACES = ["topo", "esquerda", "direita"];
        const COR_DO_CURSOR = "#ffe14d";
        const COR_DO_CONTORNO = "rgba(0, 0, 0, 0.5)";

        // As medidas da câmera, escritas aqui à mão (sem ler as constantes do jogo): o mapa tem 10×10 casas de 36 px.
        const MAPA_EM_PIXELS = { x: 10 * 36 + 24, y: 60 + 10 * 18 + 12 };       // 384 × 252
        const VISTA_EM_PIXELS = { x: 384, y: 300 };
        const NIVEIS_DE_ZOOM = [1, 1.5, 2];

        // ------------------------------------------------------------
        // Ajudantes de entrada e de estado
        // ------------------------------------------------------------
        function apertarTecla(tecla, modificadores, alvo) {
            const evento = new KeyboardEvent("keydown", Object.assign({ key: tecla, cancelable: true, bubbles: true }, modificadores || {}));
            (alvo || document).dispatchEvent(evento);
            return evento;
        }

        function posicaoNaPagina(sx, sy) {
            const caixa = tela.getBoundingClientRect();
            return { clientX: caixa.left + sx * caixa.width / tela.width, clientY: caixa.top + sy * caixa.height / tela.height };
        }

        function criarEventoDePonteiro(tipo, id, sx, sy, extras) {
            return new PointerEvent(tipo, Object.assign({ pointerId: id, bubbles: true }, posicaoNaPagina(sx, sy), extras || {}));
        }

        // Como o navegador manda: apertar o botão principal diz button 0 e buttons 1; arrastar mantém buttons 1; soltar diz buttons 0.
        function descer(id, sx, sy, extras) { tela.dispatchEvent(criarEventoDePonteiro("pointerdown", id, sx, sy, Object.assign({ button: 0, buttons: 1 }, extras || {}))); }
        function mover(id, sx, sy, extras) { window.dispatchEvent(criarEventoDePonteiro("pointermove", id, sx, sy, Object.assign({ buttons: 1 }, extras || {}))); }
        function soltar(id, sx, sy, extras) { window.dispatchEvent(criarEventoDePonteiro("pointerup", id, sx, sy, Object.assign({ button: 0, buttons: 0 }, extras || {}))); }
        function cancelar(id, sx, sy) { window.dispatchEvent(criarEventoDePonteiro("pointercancel", id, sx, sy)); }

        function estadoDoToque() {                  // tudo que um toque marcaria ou mudaria
            return JSON.stringify({ c: cursor, m: marcada, p: Array.from(pinos), a: aviso.textContent });
        }

        function irParaOGiro(giro) {
            rotacao = giro;
            listaDeDesenho = montarListaDeDesenho();
        }

        function rodarNosQuatroGiros(caso) {
            const rotacaoOriginal = rotacao;
            try {
                for (let giro = 0; giro < 4; giro++) {
                    irParaOGiro(giro);
                    caso(giro);
                }
            } finally {
                irParaOGiro(rotacaoOriginal);
            }
        }

        function sortearTerreno() {
            alturas.forEach(function (linha) {
                for (let x = 0; x < linha.length; x++) linha[x] = Math.floor(Math.random() * 5);
            });
        }

        function restaurarTerreno() {
            const original = JSON.parse(ALTURAS_ORIGINAIS);
            alturas.forEach(function (linha, y) {
                for (let x = 0; x < linha.length; x++) linha[x] = original[y][x];
            });
            irParaOGiro(0);
        }

        function definirCamera(zoom, desvioX, desvioY) {
            camera.zoom = zoom;
            camera.desvioX = desvioX;
            camera.desvioY = desvioY;
            limitarCamera();
        }

        function reiniciar() {
            restaurarTerreno();
            definirCamera(1, 0, 0);
            pinos.clear();
            marcada = false;
            dedo = null;
            giroDaRoda = 0;
            ponteiro = null;
            cursor = { x: 4, y: 4 };
            if (depuracaoLigada) apertarTecla("h");
            avisar("");
        }

        function nomeDaCasa(casa) {
            return casa.x + "," + casa.y;
        }

        function nomeDoAcerto(acerto) {
            return acerto ? acerto.x + "," + acerto.y + " " + acerto.face : "nada";
        }

        // O que a câmera deve fazer num eixo, pela minha conta: mapa menor que a janela fica no centro; maior, rola de `vista − mapa·zoom` até 0.
        function limitesDoEixo(mapa, vista, zoom) {
            const sobra = vista - mapa * zoom;
            return sobra >= 0 ? { centrado: true, fixo: sobra / 2, minimo: sobra / 2, maximo: sobra / 2 } : { centrado: false, fixo: null, minimo: sobra, maximo: 0 };
        }

        function desvioPermitido(desvio, limites) {
            return limites.centrado ? limites.fixo : Math.min(limites.maximo, Math.max(limites.minimo, desvio));
        }

        function limitesAtuais(zoom) {
            return { x: limitesDoEixo(MAPA_EM_PIXELS.x, VISTA_EM_PIXELS.x, zoom), y: limitesDoEixo(MAPA_EM_PIXELS.y, VISTA_EM_PIXELS.y, zoom) };
        }

        function desvioSorteado(limites) {
            return limites.centrado ? limites.fixo : limites.minimo + Math.random() * (limites.maximo - limites.minimo);
        }

        function paraAJanela(p, zoom, desvioX, desvioY) {
            return { x: p.x * zoom + desvioX, y: p.y * zoom + desvioY };
        }

        function dentroDaJanela(q, margem) {
            return q.x >= margem && q.y >= margem && q.x < VISTA_EM_PIXELS.x - margem && q.y < VISTA_EM_PIXELS.y - margem;
        }

        // ------------------------------------------------------------
        // Minha força bruta (sem as funções de projeção do jogo): sx = ox + 18 (u − v), sy = oy + 9 (u + v) − 12 z, no pixel do MAPA.
        // ------------------------------------------------------------
        function girarPeloMeuCaminho(x, y, giros) {
            let ponto = [x, y];
            for (let i = 0; i < giros; i++) ponto = [TAMANHO - ponto[1], ponto[0]];
            return ponto;
        }

        function projetarMinha(u, v, z) {
            return { x: 192 + 18 * (u - v), y: 60 + 9 * (u + v) - 12 * z };
        }

        function pontoNoPoligonoConvexo(poligono, ponto) {
            let positivo = false, negativo = false;
            for (let i = 0; i < poligono.length; i++) {
                const canto = poligono[i], proximo = poligono[(i + 1) % poligono.length];
                const lado = (proximo.x - canto.x) * (ponto.y - canto.y) - (proximo.y - canto.y) * (ponto.x - canto.x);
                if (lado > 1e-9) positivo = true;
                if (lado < -1e-9) negativo = true;
            }
            return !(positivo && negativo);
        }

        function construirCenario() {
            const casas = [];
            alturas.forEach(function (linha, y) {
                linha.forEach(function (altura, x) {
                    const centro = girarPeloMeuCaminho(x + 0.5, y + 0.5, rotacao);
                    const nivel = Math.max(altura, 1);
                    const canto = function (du, dv, z) { return projetarMinha(centro[0] + du, centro[1] + dv, z); };
                    const topoCima = canto(-0.5, -0.5, nivel), topoDireita = canto(0.5, -0.5, nivel);
                    const topoBaixo = canto(0.5, 0.5, nivel), topoEsquerda = canto(-0.5, 0.5, nivel);
                    const baseDireita = canto(0.5, -0.5, 0), baseBaixo = canto(0.5, 0.5, 0), baseEsquerda = canto(-0.5, 0.5, 0);
                    casas.push({
                        x: x, y: y, proximidade: centro[0] + centro[1], topoDoCentro: projetarMinha(centro[0], centro[1], nivel),
                        faces: {
                            topo: [topoCima, topoDireita, topoBaixo, topoEsquerda],
                            esquerda: [topoEsquerda, topoBaixo, baseBaixo, baseEsquerda],
                            direita: [topoBaixo, topoDireita, baseDireita, baseBaixo],
                        },
                        minX: topoEsquerda.x, maxX: topoDireita.x, minY: topoCima.y, maxY: baseBaixo.y,
                    });
                });
            });
            casas.sort(function (a, b) { return b.proximidade - a.proximidade || (b.y * TAMANHO + b.x) - (a.y * TAMANHO + a.x); });      // a lista do pintor lida de trás para a frente: da mais perto à mais longe, e no empate a pintada por último (maior índice) primeiro
            return casas;
        }

        function acharPelaMinhaForcaBruta(cenario, sx, sy) {
            const ponto = { x: sx, y: sy };
            for (let i = 0; i < cenario.length; i++) {
                const casa = cenario[i];
                if (sx < casa.minX || sx > casa.maxX || sy < casa.minY || sy > casa.maxY) continue;
                for (let f = 0; f < 3; f++) {
                    if (pontoNoPoligonoConvexo(casa.faces[FACES[f]], ponto)) return { x: casa.x, y: casa.y, face: FACES[f] };
                }
            }
            return null;
        }

        // Encostar na borda da caixa não é cobrir: o ponto tem de estar DENTRO (a conta olha quatro pontos a 1e-6 dele, todos dentro de alguma face).
        function pontoNoInteriorDaCaixa(casa, ponto) {
            return [[1e-6, 0], [-1e-6, 0], [0, 1e-6], [0, -1e-6]].every(function (folga) {
                const perto = { x: ponto.x + folga[0], y: ponto.y + folga[1] };
                return FACES.some(function (nome) { return pontoNoPoligonoConvexo(casa.faces[nome], perto); });
            });
        }

        function escondedoresPelaMinhaConta(cenario, x, y) {
            const dela = cenario.find(function (casa) { return casa.x === x && casa.y === y; });
            return cenario.filter(function (casa) {
                return casa.proximidade > dela.proximidade + 1e-9 && pontoNoInteriorDaCaixa(casa, dela.topoDoCentro);
            }).map(nomeDaCasa);
        }

        function casasComObjeto(simbolo) {
            const casas = [];
            OBJETOS_EM_TEXTO.forEach(function (linha, y) { linha.split("").forEach(function (objeto, x) { if (objeto === simbolo) casas.push({ x: x, y: y }); }); });
            return casas;
        }

        // O ponto do toque: o centro do topo deslocado 0,31 × 0,17 px. No centro exato passam arestas de casas vizinhas (empate legítimo entre duas faces).
        function alvoDoToque(casa) {
            return { x: casa.topoDoCentro.x + 0.31, y: casa.topoDoCentro.y + 0.17 };
        }

        // Um toque que acerta de verdade: o centro do topo de uma casa à vista (minha conta), dentro da janela atual; o mais perto do meio da janela.
        function acharToqueNaJanela() {
            const cenario = construirCenario();
            let melhor = null, menorDistancia = Infinity;
            cenario.forEach(function (casa) {
                const alvo = alvoDoToque(casa), acerto = acharPelaMinhaForcaBruta(cenario, alvo.x, alvo.y);
                if (!acerto || acerto.x !== casa.x || acerto.y !== casa.y || acerto.face !== "topo") return;
                const q = paraAJanela(alvo, camera.zoom, camera.desvioX, camera.desvioY);
                if (!dentroDaJanela(q, 16)) return;
                const distancia = Math.hypot(q.x - 192, q.y - 150);
                if (distancia < menorDistancia) { menorDistancia = distancia; melhor = { q: q, casa: { x: casa.x, y: casa.y } }; }
            });
            return melhor;
        }

        // ------------------------------------------------------------
        // O gravador do quadro (traços com espessura, cor e tracejado; preenchimentos)
        // ------------------------------------------------------------
        function gravarQuadros(quantidade) {
            const registro = [];
            let caminho = [];
            let dentroDe = null;
            const prototipo = CanvasRenderingContext2D.prototype;
            const caixaVerdadeira = desenharCaixa, aguaVerdadeira = desenharAgua;
            pincel.beginPath = function () { caminho = []; prototipo.beginPath.call(pincel); };
            pincel.moveTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.moveTo.call(pincel, x, y); };
            pincel.lineTo = function (x, y) { caminho.push({ x: x, y: y }); prototipo.lineTo.call(pincel, x, y); };
            pincel.stroke = function () {
                registro.push({ tipo: "traco", pontos: caminho.slice(), largura: pincel.lineWidth, cor: pincel.strokeStyle, tracejado: pincel.getLineDash().length > 0, dentroDe: dentroDe });
                prototipo.stroke.call(pincel);
            };
            desenharCaixa = function (x, y, de, ate, estilo) {
                dentroDe = "caixa";
                try { return caixaVerdadeira(x, y, de, ate, estilo); } finally { dentroDe = null; }
            };
            desenharAgua = function (casa) {
                dentroDe = "agua";
                try { return aguaVerdadeira(casa); } finally { dentroDe = null; }
            };
            try {
                for (let i = 0; i < quantidade; i++) if (!avancarQuadro(16)) throw new Error("o laço do jogo parou de pedir quadros");
            } finally {
                desenharCaixa = caixaVerdadeira;
                desenharAgua = aguaVerdadeira;
                ["beginPath", "moveTo", "lineTo", "stroke"].forEach(function (nome) { delete pincel[nome]; });
            }
            return registro;
        }

        function lerPixel(x, y) {
            const dados = pincel.getImageData(Math.round(x), Math.round(y), 1, 1).data;
            return { r: dados[0], g: dados[1], b: dados[2] };
        }

        // ------------------------------------------------------------
        // Os casos
        // ------------------------------------------------------------
        testar("a janela e o mapa: canvas dimensionado pelo script, câmera começa centrada", function () {
            conferirIgual("a janela tem 384 px de largura", tela.width, 384);
            conferirIgual("e 300 px de altura", tela.height, 300);
            conferirIgual("o mapa mede 384 px de largura (ilha + margens)", LARGURA_DO_MAPA, MAPA_EM_PIXELS.x);
            conferirIgual("e 252 px de altura (bloco mais alto + ilha + margem)", ALTURA_DO_MAPA, MAPA_EM_PIXELS.y);
            conferirIgual("os zooms são Longe 1, meio 1,5 e Perto 2", JSON.stringify(ZOOMS), JSON.stringify(NIVEIS_DE_ZOOM));
            conferirIgual("a câmera começa com zoom 1", camera.zoom, 1);
            conferirIgual("e centrada: x = 0 (o mapa enche a largura)", camera.desvioX, 0);
            conferirIgual("e y = 24 ((300 − 252) / 2)", camera.desvioY, 24);
            conferirIgual("o mapa de verdade é válido", MAPA_VALIDO, true);
            conferirIgual("o laço começou", avancarQuadro(16), true);
        });

        testar("câmera: ida e volta paraOMapa(paraATela(p)) = p e paraATela(paraOMapa(q)) = q, e a fórmula zoom · p + desvio", function () {
            semearSorteio(101);
            NIVEIS_DE_ZOOM.forEach(function (zoom) {
                const limites = limitesAtuais(zoom);
                let piorIda = 0, piorVolta = 0, piorFormula = 0;
                for (let i = 0; i < 1000; i++) {
                    definirCamera(zoom, desvioSorteado(limites.x), desvioSorteado(limites.y));
                    const p = { x: Math.random() * 400 - 8, y: Math.random() * 300 - 8 };
                    const q = paraATela(p), esperado = paraAJanela(p, zoom, camera.desvioX, camera.desvioY);
                    const devolta = paraOMapa(q), ida = paraATela(paraOMapa(p));
                    piorIda = Math.max(piorIda, Math.abs(devolta.x - p.x), Math.abs(devolta.y - p.y));
                    piorVolta = Math.max(piorVolta, Math.abs(ida.x - p.x), Math.abs(ida.y - p.y));
                    piorFormula = Math.max(piorFormula, Math.abs(q.x - esperado.x), Math.abs(q.y - esperado.y));
                }
                conferir("zoom " + zoom + ": mapa → janela → mapa, erro " + piorIda.toExponential(2), piorIda < TOLERANCIA);
                conferir("zoom " + zoom + ": janela → mapa → janela, erro " + piorVolta.toExponential(2), piorVolta < TOLERANCIA);
                conferir("zoom " + zoom + ": paraATela = zoom · p + desvio, erro " + piorFormula.toExponential(2), piorFormula < TOLERANCIA);
            });
            definirCamera(1, 0, 0);
        });

        testar("limitarCamera: o mapa nunca sai da janela; se é menor, fica no centro; se é maior, rola até a borda e para", function () {
            NIVEIS_DE_ZOOM.forEach(function (zoom) {
                const limites = limitesAtuais(zoom);
                const nome = "zoom " + zoom + ": ";
                [["x", "desvioX", limites.x], ["y", "desvioY", limites.y]].forEach(function (eixo) {
                    const limite = eixo[2];
                    definirCamera(zoom, 0, 0);
                    rolar(-1e6, -1e6);
                    conferirIgual(nome + "rolar muito para o fim, eixo " + eixo[0] + (limite.centrado ? " (centrado)" : " (rola)"), camera[eixo[1]], limite.centrado ? limite.fixo : limite.minimo);
                    rolar(1e6, 1e6);
                    conferirIgual(nome + "rolar muito para o começo, eixo " + eixo[0], camera[eixo[1]], limite.centrado ? limite.fixo : 0);
                    camera.desvioX = -1e9; camera.desvioY = 1e9;
                    limitarCamera();
                    conferirIgual(nome + "limitarCamera(valor absurdo) volta ao permitido, eixo " + eixo[0], camera[eixo[1]], desvioPermitido(eixo[0] === "x" ? -1e9 : 1e9, limite));
                });
                // Percurso aleatório: as bordas do mapa nunca entram na janela.
                semearSorteio(7 + zoom * 10);
                let violacoes = 0;
                definirCamera(zoom, 0, 0);
                for (let i = 0; i < 400; i++) {
                    rolar((Math.random() - 0.5) * 160, (Math.random() - 0.5) * 160);
                    ["x", "y"].forEach(function (eixo) {
                        const desvio = camera[eixo === "x" ? "desvioX" : "desvioY"], mapa = MAPA_EM_PIXELS[eixo] * zoom, vista = VISTA_EM_PIXELS[eixo];
                        if (mapa >= vista) { if (desvio > 1e-9 || desvio + mapa < vista - 1e-9) violacoes++; }
                        else if (Math.abs(desvio - (vista - mapa) / 2) > 1e-9) violacoes++;
                    });
                }
                conferirIgual(nome + "400 rolagens aleatórias: nenhuma deixa um vazio na janela, e o mapa menor fica centrado", violacoes, 0);
            });
            definirCamera(2, -100, -100);
            rolar(-7, 5);
            conferirIgual("rolar(-7, 5) soma ao desvio (x)", camera.desvioX, -107);
            conferirIgual("rolar(-7, 5) soma ao desvio (y)", camera.desvioY, -95);
            definirCamera(1, 0, 0);
            rolar(30, -30);
            conferirIgual("com zoom 1 o mapa inteiro cabe: rolar não desloca (x)", camera.desvioX, 0);
            conferirIgual("e (y) continua no centro, 24", camera.desvioY, 24);
        });

        testar("ZOOM mantém o ponto sob o foco no lugar (conta estrita: prevê o desvio, não confia no resultado)", function () {
            let mantidos = 0, comLimite = 0, aproximacoes = 0, afastamentos = 0, erros = [];
            const focos = [];
            for (let fy = 20; fy <= 280; fy += 65) for (let fx = 20; fx <= 364; fx += 86) focos.push({ x: fx, y: fy });
            focos.push({ x: 192, y: 150 }, { x: 0, y: 0 }, { x: 383, y: 299 }, { x: 5, y: 290 });
            semearSorteio(2026);
            NIVEIS_DE_ZOOM.forEach(function (zoomInicial, indiceInicial) {
                [1, -1].forEach(function (passo) {
                    focos.forEach(function (foco) {
                        for (let tentativa = 0; tentativa < 6; tentativa++) {
                            const limitesAntes = limitesAtuais(zoomInicial);
                            definirCamera(zoomInicial, tentativa === 0 ? limitesAntes.x.minimo : tentativa === 1 ? limitesAntes.x.maximo : desvioSorteado(limitesAntes.x), tentativa === 2 ? limitesAntes.y.minimo : desvioSorteado(limitesAntes.y));

            mover(1, 280, 210, { buttons: 0 });                                  // o mouse anda sem botão nenhum
            conferirIgual("um movimento sem botões não rola o mapa", camera.desvioX + "," + camera.desvioY, antes);
            mover(1, 300, 230, { buttons: 0 });
            conferirIgual("nem o seguinte", camera.desvioX + "," + camera.desvioY, antes);
            soltar(1, 300, 230);
            const toque = acharToqueNaJanela();
            descer(1, toque.q.x, toque.q.y);
            soltar(1, toque.q.x, toque.q.y);
            conferirIgual("depois do acorde, um toque normal ainda marca a casa", marcada + " " + nomeDaCasa(cursor), "true " + nomeDaCasa(toque.casa));
            reiniciar();
        });

        testar("a roda: deltaY 0 não faz nada, deltas pequenos somam até um degrau, a inversão de sentido recomeça a conta, linhas e páginas valem mais que pixels", function () {
            function roda(delta, extras) {
                const evento = new WheelEvent("wheel", Object.assign({ deltaY: delta, cancelable: true, bubbles: true }, posicaoNaPagina(150, 100), extras || {}));
                tela.dispatchEvent(evento);
                return evento;
            }
            reiniciar();
            definirCamera(1.5, -60, -40);
            const antes = JSON.stringify(camera) + aviso.textContent;
            [0, 0, -0].forEach(function (zero) { roda(zero); });
            conferirIgual("deltaY 0 (deslize de lado) não muda a câmera nem o aviso", JSON.stringify(camera) + aviso.textContent, antes);
            conferirIgual("e a roda sem delta ainda não deixa a página rolar", roda(0).defaultPrevented, true);

            [-25, -25, -25].forEach(function (delta) { roda(delta); });
            conferirIgual("três deltas de −25 (soma 75) ainda não dão um degrau", camera.zoom, 1.5);
            roda(-25);
            conferirIgual("o quarto (soma 100) aproxima um degrau", camera.zoom, 2);
            [25, 25, 25].forEach(function (delta) { roda(delta); });
            conferirIgual("depois do degrau a conta recomeça do zero: três de +25 não afastam", camera.zoom, 2);
            roda(25);
            conferirIgual("o quarto afasta um degrau", camera.zoom, 1.5);

            reiniciar();
            definirCamera(1.5, -60, -40);
            roda(60);
            conferirIgual("+60 não basta", camera.zoom, 1.5);
            roda(-60);
            conferirIgual("−60 logo depois (inversão) também não", camera.zoom, 1.5);
            roda(-60);
            conferirIgual("a inversão zerou a conta: −60 −60 somam −120 e aproximam (se a conta seguisse, 60 − 60 − 60 = −60 não bastaria)", camera.zoom, 2);

            reiniciar();
            definirCamera(1.5, -60, -40);
            roda(-1, { deltaMode: 1 });
            conferirIgual("1 linha (30 a 40 px, conforme o navegador) ainda não basta", camera.zoom, 1.5);
            roda(-4, { deltaMode: 1 });
            conferirIgual("5 linhas (mais de 100 px) aproximam um degrau, não dois", camera.zoom, 2);

            reiniciar();
            definirCamera(1, 0, 0);
            roda(-1, { deltaMode: 2 });
            conferirIgual("uma página de roda (deltaMode 2) vale um degrau", camera.zoom, 1.5);
            reiniciar();
        });

        testar("segurar Enter ou Espaço (repeat) age uma vez só; soltar e apertar de novo age de novo", function () {
            reiniciar();
            cursor = { x: 2, y: 3 };
            apertarTecla("Enter");
            conferirIgual("Enter põe o pino", Array.from(pinos).join("|"), "2,3");
            let repetidoSemPreventDefault = 0;
            for (let i = 0; i < 6; i++) if (!apertarTecla("Enter", { repeat: true }).defaultPrevented) repetidoSemPreventDefault++;
            conferirIgual("Enter segurado (6 repetições) não tira o pino", Array.from(pinos).join("|"), "2,3");
            conferirIgual("e a repetição não deixa o navegador agir (preventDefault)", repetidoSemPreventDefault, 0);
            apertarTecla("Enter");
            conferirIgual("um Enter novo (sem repeat) age: tira o pino", pinos.size, 0);
            apertarTecla(" ");
            for (let i = 0; i < 6; i++) apertarTecla(" ", { repeat: true });
            conferirIgual("Espaço põe o pino uma vez só, mesmo segurado", Array.from(pinos).join("|"), "2,3");
            reiniciar();
        });

        testar("o #aviso anuncia o zoom e a rolagem, inclusive o limite", function () {
            reiniciar();
            definirCamera(1, 0, 0);
            apertarTecla("+");
            conferir("+ anuncia o zoom: " + aviso.textContent, /zoom/i.test(aviso.textContent) && /no meio/i.test(aviso.textContent) && !/limite/i.test(aviso.textContent));
            apertarTecla("+");
            conferir("+ de novo: perto, " + aviso.textContent, /perto/i.test(aviso.textContent) && !/limite/i.test(aviso.textContent));
            apertarTecla("+");
            conferir("+ no Perto diz que é o limite: " + aviso.textContent, /perto/i.test(aviso.textContent) && /limite/i.test(aviso.textContent));
            apertarTecla("-"); apertarTecla("-");
            conferir("− duas vezes: longe, " + aviso.textContent, /longe/i.test(aviso.textContent) && !/limite/i.test(aviso.textContent));
            apertarTecla("-");
            conferir("− no Longe diz o limite: " + aviso.textContent, /longe/i.test(aviso.textContent) && /limite/i.test(aviso.textContent));
            tela.dispatchEvent(new WheelEvent("wheel", Object.assign({ deltaY: -100, cancelable: true, bubbles: true }, posicaoNaPagina(100, 100))));
            conferir("a roda também anuncia: " + aviso.textContent, /zoom/i.test(aviso.textContent) && /no meio/i.test(aviso.textContent));
            clicarNoBotao("aproximar");
            conferir("e o botão Perto: " + aviso.textContent, /zoom/i.test(aviso.textContent) && /perto/i.test(aviso.textContent));

            definirCamera(2, -100, -100);
            [["w", /cima/i], ["a", /esquerda/i], ["s", /baixo/i], ["d", /direita/i]].forEach(function (tecla) {
                avisar("");
                apertarTecla(tecla[0]);
                conferir(tecla[0].toUpperCase() + " rolou: o aviso diz para onde (" + aviso.textContent + ")", tecla[1].test(aviso.textContent) && /rolado/i.test(aviso.textContent));
            });
            definirCamera(2, 0, 0);
            apertarTecla("w");
            conferir("W no começo do mapa: o aviso diz que acabou (" + aviso.textContent + ")", /sem mais mapa/i.test(aviso.textContent) && /cima/i.test(aviso.textContent));
            definirCamera(2, -384, -204);
            apertarTecla("d");
            conferir("D no fim do mapa: " + aviso.textContent, /sem mais mapa/i.test(aviso.textContent) && /direita/i.test(aviso.textContent));
            definirCamera(1, 0, 0);
            apertarTecla("a");
            conferir("com o mapa inteiro à vista, nada rola: " + aviso.textContent, /sem mais mapa/i.test(aviso.textContent) && /esquerda/i.test(aviso.textContent));
            reiniciar();
        });

        testar("o LEITO da água também é plano (passos 2 a 4 não têm parede): um só preenchimento por casa alagada, o topo no nível da água, nos 4 giros", function () {
            rodarNosQuatroGiros(function (giro) {
                const chamadas = espiarPreenchimentosPorChamada("desenharLeito", function () { avancarQuadro(16); });
                const alagadas = alturas.reduce(function (soma, linha) { return soma + linha.filter(function (altura) { return altura < NIVEL_DA_AGUA; }).length; }, 0);
                conferirIgual("giro " + giro * 90 + "°: uma chamada de desenharLeito por casa alagada", chamadas.length, alagadas);
                const erradas = chamadas.filter(function (chamada) {
                    const esperado = meusCantos(chamada.args[0].x, chamada.args[0].y, NIVEL_DA_AGUA, giro, TAMANHO);
                    return chamada.preenchimentos.length !== 1 || chamada.preenchimentos[0].pontos.length !== 4 || !chamada.preenchimentos[0].pontos.every(function (ponto, i) { return mesmoPonto(ponto, esperado[i]); });
                });
                conferirIgual("giro " + giro * 90 + "°: cada leito é um único losango no nível da água (sem laterais)", erradas.length, 0);
            });
        });

        testar("sem erro de console e com o estado restaurado", function () {
            reiniciar();
            conferirIgual("a carga não registrou console.error", errosNaCarga.join(" | "), "");
            conferirIgual("o terreno de verdade foi restaurado", JSON.stringify(alturas), ALTURAS_ORIGINAIS);
            conferirIgual("o giro final é 0", rotacao, 0);
            conferirIgual("nenhum aviso de erro sobrou", errosDeConsole.join(" | "), "");
            conferir("o laço segue vivo", avancarQuadro(16));
        });

        // ------------------------------------------------------------
        // O passo inteiro com o style.css de verdade, em dois tamanhos de tela (apoio-dique.js): sem rolar a página em 390×750,
        // sem rolagem horizontal e alvos ≥ 48 px em 360, #aviso com a mesma altura em qualquer mensagem
        // ------------------------------------------------------------
        const CONFIGURACAO_DO_LAYOUT = {
            pasta: "04-camera",
            corpo: MARCACAO_DO_PASSO,
            quantidadeDeBotoes: 10,
            proporcaoDoCanvas: 384 / 300,
            mensagens: ["", "Zoom: perto", "Mapa rolado para a esquerda", "Vista girada para 270 graus. Casas escondidas: 2",
                "Marcada: casa 7, 7, altura 1, escondida atrás de um bloco. Toque de novo na mesma casa para confirmar e ver o pino"],
        };

        async function principal() {
            await testarNoIframe("layout 390×750", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 390, 750); });
            await testarNoIframe("layout 360×640", function () { return conferirLayoutDoPasso(CONFIGURACAO_DO_LAYOUT, 360, 640); });
        }

        principal().finally(finalizar);

    </script>
