<!--
  PAC-MAN — PASSO 4: O FANTASMA

  Um fantasma. Ele não enxerga o labirinto inteiro, não planeja, não
  calcula caminhos: só segue uma regra simples em cada cruzamento. E
  persegue muito bem. Aperte H para ver para onde ele está mirando.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man — passo 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pac-Man</h1>

    <div id="placar">
        <p>Pontos <span id="pontos">0</span></p>
        <p>Faltam <span id="restantes">0</span></p>
        <p>Capturas <span id="capturas">0</span></p>
    </div>

    <canvas id="jogo" width="224" height="240">
        Seu navegador não suporta canvas.
    </canvas>

    <p id="ajuda">
        <span>Setas ou WASD: escolher a direção</span>
        <span>H: mostrar o alvo do fantasma</span>
    </p>
</body>
</html>
