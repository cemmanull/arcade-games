<!--
  PAC-MAN

  O último jogo do curso junta quase tudo: a grade do Tetris, o deslizar
  do Pong, as tabelas do Dealer? Out!, a máquina de estados de todos — e
  quatro fantasmas que parecem caçar em grupo seguindo, cada um, uma
  regra de uma linha.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pac-Man</h1>

    <div id="placar">
        <p>Pontos <span id="pontos">0</span></p>
        <p>Recorde <span id="recorde">0</span></p>
        <p>Vidas <span id="vidas">3</span></p>
        <p>Fase <span id="fase">1</span></p>
    </div>

    <div id="tela">
        <canvas id="jogo" width="224" height="240">
            Seu navegador não suporta canvas.
            <!--
              28 x 30 casas de 8 pixels. No celular, deslize o dedo sobre
              o labirinto para escolher a direção.
            -->
        </canvas>

        <p id="aviso" role="status" hidden></p>

        <!-- A mesma camada é menu, pausa e fim de jogo. -->
        <div id="camada-mensagem" aria-live="polite">
            <p id="mensagem-titulo"></p>
            <p id="mensagem-texto"></p>
            <button id="botao-iniciar" type="button">Iniciar</button>
        </div>
    </div>

    <div id="controles">
        <button id="botao-som" type="button" aria-pressed="true">Som: ligado</button>
        <!-- Só aparece onde não há teclado (ver o CSS). -->
        <button id="botao-pausa" type="button">Pausa</button>
    </div>

    <p id="ajuda">
        <span>Setas ou WASD: escolher a direção</span>
        <span>P: pausar</span>
        <span>H: mostrar os alvos</span>
    </p>
</body>
</html>
