<!--
  PAC-MAN — PASSO 1: O LABIRINTO

  Nada se move. O labirinto inteiro sai de um texto: cada caractere é uma
  casa, e o desenho das paredes é deduzido olhando os vizinhos de cada
  uma.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man — passo 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pac-Man</h1>

    <canvas id="jogo" width="224" height="240">
        Seu navegador não suporta canvas.
        <!--
          28 colunas x 30 linhas de 8 pixels = 224 x 240. Quase quadrado:
          o jogo acontece em todas as direções.
        -->
    </canvas>
</body>
</html>
